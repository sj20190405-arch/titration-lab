<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>중화 적정 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
</head>
<body>
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#15201E; --muted:#56655F; --line:#D3DCD9;
  --accent:#D3121A; --accent-ink:#FFFFFF; --accent-soft:#FDE4E4; --gold:#FFB414; --glass:#2A7584; --glass-soft:#DDEFF2;
  --ok:#1D7F46; --ok-soft:#DDF2E5; --warn:#A96A00; --warn-soft:#FBEFD6; --bad:#B8322A; --bad-soft:#F9E0DE;
  --lcd:#0F2A26; --lcd-ink:#9CF2D6; --shadow:0 1px 2px rgba(20,32,30,.06),0 6px 20px rgba(20,32,30,.06);
  --liquid:#8E1C74; --water:#CFE8F0;
  --r:12px;
  --fd:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --fb:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#FF5F64; --accent-ink:#1E0506; --accent-soft:#3E1517; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#FF5F64; --accent-ink:#1E0506; --accent-soft:#3E1517; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,56px)} h2{font-size:clamp(26px,4vw,34px)} h3{font-size:21px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.panel{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--glass)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.glass{background:var(--glass);border-color:var(--glass);color:var(--surface)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{border-left:3px solid var(--glass);padding:8px 12px;background:var(--glass-soft);border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
main{padding-top:24px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding-block:24px 8px}
.school{font-family:var(--fd);font-size:clamp(28px,4.6vw,42px);line-height:1.15;color:var(--ink);display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline}
.school span{color:var(--accent)}
.hero .lead{font-size:17px;color:var(--muted);max-width:52ch;margin-top:12px}
.door{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.units{margin-top:28px}
.unit{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.unit .num{font-family:var(--fm);font-size:13px;color:var(--muted);min-width:34px;padding-top:3px}
.unit.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit.off{opacity:.62;cursor:default}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* hub */
.mode{display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .tag{font-family:var(--fm);font-size:12px;color:var(--accent)}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.mode svg{width:100%;height:120px}

/* quiz */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lv{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lv:hover{border-color:var(--c)}
.lv .badge{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);font-size:22px;color:#fff;background:var(--c)}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hearts{display:flex;gap:4px}
.heart{width:22px;height:20px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{margin-top:14px}
.qtype{display:inline-block;font-family:var(--fd);font-size:17px;padding:3px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:19px;font-weight:600;margin-top:10px}
.cho{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.cho span{font-family:var(--fd);font-size:40px;width:64px;height:72px;display:grid;place-items:center;background:var(--lcd);color:var(--lcd-ink);border-radius:10px}
.cho span.sp{background:transparent;width:18px}
.jam{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.syl{width:66px;height:78px;border-radius:10px;border:2px dashed var(--glass);display:grid;grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;padding:6px;font-family:var(--fd);font-size:24px;color:var(--glass);background:var(--glass-soft)}
.syl .c{grid-column:1;grid-row:1;display:grid;place-items:center}
.syl .v{grid-column:2;grid-row:1;display:grid;place-items:center;color:var(--muted);font-size:18px}
.syl .j{grid-column:1/3;grid-row:2;display:grid;place-items:center}
.syl.sp{border:0;background:none;width:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ox{display:flex;gap:14px;margin-top:18px}
.ox button{flex:1;font-family:var(--fd);font-size:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:10px}
.ox button:hover{border-color:var(--accent)}
.ansrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:180px;font-size:18px}
.blankq{font-size:19px;line-height:2}
.blankq .b{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:700;padding:0 6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mi.shake{animation:shake .35s}
.orderlist{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.oi{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.oi .n{font-family:var(--fm);color:var(--muted);width:22px}
.oi .t{flex:1}
.oi button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;width:34px;height:30px}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px}
.feedback.ok{background:var(--ok-soft);color:var(--ink);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.feedback b{font-family:var(--fd);font-size:20px;font-weight:400}
.combo{font-family:var(--fd);color:var(--accent);font-size:20px}
.timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:var(--warn)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
.pt{outline:none}.pt .tip{opacity:0;transition:opacity .12s;pointer-events:none}.pt:hover .tip,.pt:focus .tip{opacity:1}.pt:hover circle:nth-child(2),.pt:focus circle:nth-child(2){stroke:var(--ink);stroke-width:2}
.rank{font-family:var(--fd);font-size:88px;line-height:1;color:var(--accent)}

/* practice */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:18px}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .ck{color:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px}
.tool svg{width:70px;height:80px}
.tool.sel{border-color:var(--accent);background:var(--accent-soft)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.bench{grid-template-columns:1fr}}
.stage{background:linear-gradient(var(--surface2),var(--surface2)) padding-box;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:center;align-items:flex-end;gap:20px;padding:14px;min-height:280px;position:relative;flex-wrap:wrap}
.stage svg{max-width:100%}
.holdbtn{user-select:none;-webkit-user-select:none;touch-action:none}
.holdbtn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zoom{width:150px;height:150px;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--surface)}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.stp{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:14px}
.stp::before{counter-increment:s;content:counter(s);font-family:var(--fm);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none}
.stp.done{color:var(--muted)} .stp.done::before{background:var(--ok);color:#fff;content:"✓"}
.stp.cur{background:var(--accent-soft)} .stp.cur::before{background:var(--accent);color:#fff}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip.used{opacity:.35;pointer-events:none}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{min-width:110px;min-height:44px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;padding:6px 10px;font-weight:600;font-size:14px;text-align:center}
.slot.fill{border-style:solid;border-color:var(--glass);background:var(--glass-soft)}
.arrow{color:var(--muted);font-family:var(--fm)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--fm);font-size:11px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.table th{background:var(--surface2);font-weight:600}
.tw{overflow-x:auto}

/* instrument */
.inst{background:#D9DEDC;border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;border:1px solid #BFC6C3;color:#15201E}
:root[data-theme="dark"] .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}}
@media (max-width:760px){.inst{grid-template-columns:1fr}}
.screen{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:12px;min-height:250px;font-family:var(--fm);font-size:13px;position:relative;overflow:hidden}
.screen .big{font-size:30px;font-weight:600}
.screen button{background:rgba(156,242,214,.1);border:1px solid rgba(156,242,214,.4);color:var(--lcd-ink);border-radius:6px;padding:6px 10px;font-family:var(--fm);font-size:12.5px}
.screen button:hover{background:rgba(156,242,214,.22)}
.screen input,.screen select{background:#0a1f1c;color:var(--lcd-ink);border-color:rgba(156,242,214,.35);font-family:var(--fm);padding:4px 8px;font-size:13px}
.screen .off{position:absolute;inset:0;background:#050b0a;display:grid;place-items:center;color:#3c5a54}
.screen table{width:100%;border-collapse:collapse}
.screen td,.screen th{border-bottom:1px solid rgba(156,242,214,.18);padding:3px 4px;text-align:right}
.screen th{text-align:right;font-weight:600;opacity:.7}
.holder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos{background:#11191A;border-radius:8px;padding:6px;color:#cfe;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--fm);font-size:11px;min-height:86px;border:2px solid transparent}
.pos.sel{border-color:var(--accent)}
.pos .cv{width:22px;height:40px;border:1.5px solid #9ab;border-radius:2px;position:relative;background:#1d2b2d}
.pos .cv i{position:absolute;left:0;right:0;bottom:0;height:78%}
.power{width:44px;height:44px;border-radius:50%;border:2px solid #6a7571;background:#2B3432;color:#fff;font-weight:700}
.power.on{background:var(--ok);border-color:var(--ok)}

/* exam */
.examgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.examgrid{grid-template-columns:1fr}}
.stepper{position:sticky;top:70px;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.stepper{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.sb{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}
.sb .d{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--fm);font-size:11px;flex:none}
.sb.done .d{background:var(--ok);color:#fff}
.sb.cur{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.sb.cur .d{background:var(--accent);color:#fff}
.sb:disabled{opacity:.5;cursor:not-allowed}
.stamp{display:inline-grid;place-items:center;width:42px;height:42px;border:2px solid var(--bad);color:var(--bad);border-radius:50%;font-family:var(--fd);font-size:14px;transform:rotate(-12deg);animation:pop .3s}
.sheet{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:18px}
.sheet h3{text-align:center;margin-bottom:10px}
.graphbox{background:#FFFDF7;border:1px solid #E4D9BF;border-radius:6px;overflow:hidden;touch-action:none}
:root[data-theme="dark"] .graphbox{background:#1C1A14;border-color:#3A3527}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .graphbox{background:#1C1A14;border-color:#3A3527}}
.score{font-family:var(--fd);font-size:72px;color:var(--accent);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}
.modalbg{position:fixed;inset:0;background:rgba(10,16,15,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
/* ===== 중화 적정 전용 ===== */
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:120px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
.tbench{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.tbench{grid-template-columns:1fr}}
.scene{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;justify-content:center}
.scene svg{width:100%;max-width:300px;height:auto}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl .row .btn{flex:1;justify-content:center;min-width:120px}
.lens{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lens svg{flex:none}
.tubes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tube{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;font-weight:600}
.tube svg{width:48px;height:130px}
.sortcard{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;width:100%}
.sortcard .tag2{margin-left:auto;flex:none}
.sortcard.safe{border-color:var(--ok);background:var(--ok-soft)}
.sortcard.risk{border-color:var(--bad);background:var(--bad-soft)}
.bal{background:#D9DEDC;border-radius:14px;padding:14px;border:1px solid #BFC6C3;color:#15201E;display:flex;flex-direction:column;gap:10px;align-items:center}
:root[data-theme="dark"] .bal{background:#2A3331;border-color:#3A4643;color:#E4EDEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bal{background:#2A3331;border-color:#3A4643;color:#E4EDEA}}
.bal .lcd{background:var(--lcd);color:var(--lcd-ink);font-family:var(--fm);font-size:30px;font-weight:600;padding:8px 16px;border-radius:8px;min-width:180px;text-align:right}
.indbottle{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.indbottle:hover{border-color:var(--accent)}
.indbottle.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.swatch{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);vertical-align:-3px}
.report{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:22px}
.report h3{text-align:center}
.report .sec{margin-top:16px}
.report .sec>b{display:block;font-family:var(--fd);font-weight:400;font-size:18px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
@media (max-width:560px){.kv{grid-template-columns:1fr}}
.calcrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 70px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
@media (max-width:560px){.calcrow{grid-template-columns:1fr 1fr}}
.calcrow input{width:100%}
.flag{font-size:12.5px;font-weight:700}
.bigstat{font-family:var(--fd);font-size:40px;line-height:1;color:var(--accent)}
.legendsw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.entry{align-self:start;padding:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.entry select,.entry input{width:100%}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:600;line-height:1.15}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%}
.pcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.pcard::after{content:"";position:absolute;right:-26px;top:-26px;width:92px;height:92px;border-radius:50%;background:var(--c);opacity:.12}
.pnum{font-family:var(--fd);font-size:40px;line-height:1;color:var(--c)}
.ppts{margin-top:auto;font-weight:700;color:var(--c)}.ppts .mono{font-size:22px}
.goal{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:8px 18px}
.goal dt{font-size:12px;font-weight:700;color:var(--muted);padding-top:2px}.goal dd{margin:0}
@media (max-width:560px){.goal{grid-template-columns:1fr}}
.modal.wide{max-width:880px}
.linkbtn{border:0;background:none;padding:0;font-weight:600;color:inherit;text-decoration:underline dotted}
.roster td,.roster th{white-space:nowrap}

/* 첫 화면 게이트 */
#gate{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;color:#333;transition:opacity .6s ease}
#gate.gone{opacity:0;pointer-events:none}
.gplaque img{display:block;height:clamp(38px,6vw,52px);width:auto}
.gdept{font-family:var(--fd);font-size:clamp(20px,3.4vw,28px);color:#333;letter-spacing:.04em}
.gtitle{font-family:var(--fd);font-size:clamp(46px,9vw,84px);line-height:1;color:#FC1820;letter-spacing:.02em}
.gsub{font-size:clamp(14px,2.2vw,17px);color:#646363}
.gscene{width:min(560px,88vw);max-height:48vh;display:grid;place-items:center;cursor:pointer;transition:transform 1s cubic-bezier(.6,.05,.3,1)}
.gscene img{max-width:100%;max-height:48vh;height:auto;object-fit:contain;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#gate.open .gscene{transform:scale(1.8)}
#gate.open .gtop,#gate.open .gbtn,#gate.open .gnote{opacity:0;transition:opacity .35s}
.gtop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gbtn{font-family:var(--fd);font-size:22px;padding:12px 34px;border-radius:999px;border:2px solid #FFB414;background:#FC1820;color:#fff;box-shadow:0 8px 22px rgba(252,24,32,.3);animation:gpulse 2s infinite}
.gbtn:hover{background:#E0141B}
@keyframes gpulse{50%{box-shadow:0 8px 34px rgba(252,24,32,.5)}}
.gnote{font-size:12.5px;color:#969696}
@media (prefers-reduced-motion:reduce){.gscene img{animation:none}.gscene{transition:none}}
.gatecard{display:flex;flex-direction:column;gap:10px;text-align:left;border-radius:18px;padding:24px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:190px}
.gatecard:hover{transform:translateY(-3px)}
.gatecard.stu:hover{border-color:var(--accent)}.gatecard.tch:hover{border-color:var(--glass)}
.gatecard .gtag{font-family:var(--fm);font-size:12px;letter-spacing:.14em;color:var(--muted)}
.gatecard .gname{font-family:var(--fd);font-size:34px;line-height:1}
.gatecard.stu .gname{color:var(--accent)}.gatecard.tch .gname{color:var(--glass)}
.gatecard .gdesc{color:var(--muted);font-size:14.5px}
.gatecard .gcta{margin-top:auto;font-weight:700}
.oi.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin-bottom:8px}
.oi.drag .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.oi.drag .grip{font-size:18px;color:var(--muted);padding:0 4px}
.oi.dragging{cursor:grabbing;border-color:var(--accent);box-shadow:0 8px 20px rgba(0,0,0,.15);background:var(--accent-soft);position:relative;z-index:2}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
#printzone{display:none}
@media print{
  body.printing>*:not(#printzone){display:none!important}
  body.printing #printzone{display:block}

  .topbar,.stepper,.noprint,#toastbox{display:none!important}
  body{background:#fff;padding:0}
  .examgrid{display:block}
  .report{border:0;padding:0}
}

    const move=ev=>{const y=ev.clientY;const sibs=$$('.oi',list).filter(x=>x!==it);
      let before=null;for(const s of sibs){const r=s.getBoundingClientRect();if(y<r.top+r.height/2){before=s;break}}

/* =====================================================================
   화학 엔진 — 전하 균형식으로 pH 계산
   S: 강한 양이온(Na+) − 강한 음이온(Cl−, 2×SO4²−)의 농도 [M]
   Cha/Ka: 약산 전체 농도와 이온화 상수, Cb/Kb: 약염기 전체 농도와 이온화 상수
   ===================================================================== */
const KW=1e-14,KA_AC=1.8e-5,KB_NH3=1.8e-5;
function solvePH(S,Cha=0,Ka=KA_AC,Cb=0,Kb=KB_NH3){
  const KaB=KW/Kb;
  const f=H=>H+S+(Cb?Cb*H/(H+KaB):0)-KW/H-(Cha?Cha*Ka/(Ka+H):0);
  let lo=-15,hi=1;
  for(let i=0;i<80;i++){const m=(lo+hi)/2;if(f(10**m)>0)hi=m;else lo=m}
  return -(lo+hi)/2;
}

/* 플라스크 속 pH: Va = 시료 부피(mL), Ca = 시료 농도, Ct = 적정액 농도, V = 넣은 적정액 부피 */
function pHat(sc,Ca,Va,Ct,V){

const IND={

function indFrac(ind,pH){return 1/(1+10**(ind.slope*(ind.pk-pH)))}

function vIndicator(sc,Ca,Va,Ct,ind){
  const veq=veqOf(sc,Ca,Va,Ct);const up=sc.analyte==='acid';
  let lo=0,hi=veq*2;

  const ok=SUIT[sc.aType].includes(ind.k);
  let why;
  if(ind.k==='lit')why='리트머스는 변색 범위(pH 4.5~8.3)가 넓고 색이 서서히 변해 종말점을 한 방울 단위로 정할 수 없습니다. 액성 판별용이지 적정용이 아니에요.';
  else if(ok)why=`변색 범위(pH ${ind.range[0]}~${ind.range[1]})가 중화점 근처 pH가 급격히 변하는 구간 안에 있어, 한 방울 차이로 색이 바뀝니다.`;
  else why=`중화점의 pH는 ${sc.eqpH}인데 ${ind.n}은 pH ${ind.range[0]}~${ind.range[1]}에서 변색합니다. 중화점보다 ${err<0?'먼저':'늦게'} 색이 바뀌어 약 ${Math.abs(err).toFixed(1)} %의 오차가 생겨요.`;

  if(ind.k==='pp')return sc.analyte==='acid'?'무색 → 옅은 분홍색':'붉은색 → 무색';

}

/* ===== 적정 곡선 ===== */
function curveSVG(o){
  const {sc,Ca,Va=20,Ct,ind,marks=[],W=600,H=300,showInd=true}=o;
  const veq=veqOf(sc,Ca,Va,Ct);const Vmax=Math.max(10,Math.ceil(veq*1.8/5)*5);
  const L=44,R=14,T=14,B=38,pw=W-L-R,ph=H-T-B;
  const X=v=>L+v/Vmax*pw,Y=p=>T+(14-p)/14*ph;
  const pts=[];for(let i=0;i<=300;i++){const v=Vmax*i/300;pts.push(`${X(v).toFixed(1)},${Y(pHat(sc,Ca,Va,Ct,v)).toFixed(1)}`)}
  const grid=[];for(let p=0;p<=14;p+=2){grid.push(`<line x1="${L}" x2="${W-R}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(p)+4}" text-anchor="end">${p}</text>`)}
  for(let v=0;v<=Vmax;v+=5)grid.push(`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T+ph}" stroke="var(--line)" opacity=".6"/><text x="${X(v)}" y="${T+ph+16}" text-anchor="middle">${v}</text>`);
  let band='';
  if(ind&&showInd){const [lo,hi]=ind.range;const gid='g'+Math.random().toString(36).slice(2,7);
    band=`<defs><linearGradient id="${gid}" x1="0" y1="1" x2="0" y2="0">${[0,.25,.5,.75,1].map(t=>`<stop offset="${t}" stop-color="${indRGBA(ind,lo+(hi-lo)*t)}"/>`).join('')}</linearGradient></defs>
    <rect x="${L}" y="${Y(hi)}" width="${pw}" height="${Y(lo)-Y(hi)}" fill="url(#${gid})" opacity=".55"/>
    <rect x="${L}" y="${Y(hi)}" width="${pw}" height="${Y(lo)-Y(hi)}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${W-R-6}" y="${Y(hi)-4}" text-anchor="end" style="fill:var(--ink)">${ind.n} 변색 범위 pH ${lo}~${hi}</text>`}
  const mk=marks.map((m,i)=>{const p=pHat(sc,Ca,Va,Ct,m.v);return `<g><circle cx="${X(m.v)}" cy="${Y(p)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/><text x="${X(m.v)+7}" y="${Y(p)-8-i*12}" style="fill:var(--accent);font-weight:600">${esc(m.label||'')}</text></g>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sc.title)} 적정 곡선">
   ${grid.join('')}${band}
   <line x1="${X(veq)}" x2="${X(veq)}" y1="${T}" y2="${T+ph}" stroke="var(--glass)" stroke-width="1.5" stroke-dasharray="5 4"/>
   <text x="${X(veq)+4}" y="${T+12}" style="fill:var(--glass)">중화점 ${veq.toFixed(2)} mL</text>
   <polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
   ${mk}
   <text x="${L+pw/2}" y="${H-4}" text-anchor="middle">넣은 ${sc.tShort} 부피 (mL)</text>
   <text x="12" y="${T+ph/2}" text-anchor="middle" transform="rotate(-90 12 ${T+ph/2})">pH</text>
  </svg>`;
}

function pickQuestions(l){
  const n=LEVELS[l].n;const key='seen'+l;let seen=store.get(key,[]);
  const fresh=QB[l].filter(q=>!seen.includes(q.id));
  let out=[];if(l===3)out=shuffle(GEN).slice(0,3).map(g=>g());
  const need=n-out.length;
  const pickFrom=pool=>{const byType={};const res=[];for(const q of shuffle(pool)){byType[q.t]=byType[q.t]||0;if(byType[q.t]<3&&res.length<need){res.push(q);byType[q.t]++}}for(const q of shuffle(pool)){if(res.length>=need)break;if(!res.includes(q))res.push(q)}return res};
  let st=pickFrom(fresh);
  if(st.length<need){seen=[];const rest=pickFrom(QB[l].filter(q=>!st.includes(q)));st=st.concat(rest.slice(0,need-st.length))}
  seen=seen.concat(st.map(q=>q.id));store.set(key,seen);
  return shuffle(out.concat(st));
}

function checkInput(){
  if(Q.answered)return;const q=Q.qs[Q.i];const v=$('#ans').value.trim();if(!v){toast('답을 입력하세요');return}
  let ok;
  if(q.t==='calc'){const n=num(v);ok=!isNaN(n)&&Math.abs(n-q.a)<=q.tol}
  else if(q.input){ok=q.a.some(a=>norm(a)===norm(v))}
  else{const alts=[q.word,q.disp||'',...(q.alt||[])].filter(Boolean);ok=alts.some(a=>norm(a)===norm(v))}
  judge(ok,answerText(q));
}
function judge(ok,ans){
  if(Q.answered)return;Q.answered=true;clearInterval(qTimer);const q=Q.qs[Q.i];
  if(ok){Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);Q.right++;const pts=100+(Q.combo>1?(Q.combo-1)*20:0)-(Q.hint?40:0);Q.score+=pts;
    $('#fb').innerHTML=`<div class="feedback ok pop"><b>정답! +${pts}</b><p style="margin-top:4px">${esc(q.exp)}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="next">${Q.i+1<Q.qs.length?'다음 문제 →':'결과 보기'}</button></div></div>`;}
  else{Q.combo=0;Q.hearts--;Q.wrong.push({q,ans});
    $('#fb').innerHTML=`<div class="feedback bad pop"><b>아쉬워요</b>${ans?`<p style="margin-top:4px">정답: <b style="font-family:var(--fb);font-size:15px;font-weight:700">${esc(ans)}</b></p>`:''}<p style="margin-top:4px">${esc(q.exp)}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="next">${Q.hearts<=0?'결과 보기':(Q.i+1<Q.qs.length?'다음 문제 →':'결과 보기')}</button></div></div>`;
    $$('.heart path')[Q.hearts]?.setAttribute('fill','var(--line)');}
  $('#qscore').textContent=Q.score+'점';
  const n=$('#next');n.focus();n.onclick=()=>{if(Q.hearts<=0||Q.i+1>=Q.qs.length)endQuiz();else{Q.i++;showQ()}};
}
function endQuiz(){
  clearInterval(qTimer);
  const total=Q.qs.length,rate=Q.right/total;
  const rank=Q.hearts<=0?'C':rate>=.9?'S':rate>=.75?'A':rate>=.55?'B':'C';
  const msg={S:'뷰렛이 당신을 알아봅니다. 다음 난이도 도전!',A:'거의 다 왔어요. 오답노트만 한 번 보면 S랭크.',B:'개념의 뼈대는 잡혔어요. 오답노트를 꼭 확인하세요.',C:'괜찮아요. 교과서 79~83쪽과 수업자료를 보고 다시 도전!'}[rank];
  const best=store.get('quizBest',{});if(best[Q.l]==null||Q.score>best[Q.l]){best[Q.l]=Q.score;store.set('quizBest',best)}
  const b2=store.get('best',{});b2.theory=Math.max(b2.theory||0,Q.score);store.set('best',b2);
  record('기초 이론',`${LEVELS[Q.l].sub} · ${LEVELS[Q.l].name}`,Q.score,`정답 ${Q.right}/${total} · ${rank}랭크 · 최대 콤보 ${Q.maxCombo}${Q.hearts<=0?' · 하트 소진':''}${Q.wrong.length?' · 오답: '+Q.wrong.map(w=>TYPE_NAME[w.q.t]).join(', '):''}`);
  const L=LEVELS[Q.l];
  app.innerHTML=`<div class="card pop" style="text-align:center">
    <p class="eyebrow">${L.badge} ${L.name} 결과</p>
    <div class="rank" style="margin-top:10px">${rank}</div>
    <p style="margin-top:8px;font-size:17px">${msg}</p>
    <div class="row" style="justify-content:center;margin-top:14px">
      <span class="pill acc">점수 ${Q.score}</span><span class="pill ok">정답 ${Q.right}/${total}</span><span class="pill">최대 콤보 ${Q.maxCombo}</span>${Q.hearts<=0?'<span class="pill bad">하트 소진</span>':''}
    </div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn pri" id="again">다시 도전</button><button class="btn" data-go="theory">난이도 선택</button>${Q.l<3?`<button class="btn" id="up">다음 난이도 →</button>`:`<button class="btn" data-go="practice">기초 실습으로 →</button>`}</div>
  </div>
  ${Q.wrong.length?`<div class="card" style="margin-top:16px"><h3>오답노트</h3><div class="stack" style="margin-top:10px">${Q.wrong.map(w=>`<div class="panel"><span class="pill">${TYPE_NAME[w.q.t]}</span><p style="margin-top:6px;font-weight:600">${esc(w.q.q)}</p>${w.ans?`<p class="small" style="margin-top:4px">정답: <b>${esc(w.ans)}</b></p>`:''}<p class="small muted" style="margin-top:4px">${esc(w.q.exp)}</p></div>`).join('')}</div></div>`:''}`;
  $('#again').onclick=()=>startQuiz(Q.l);const up=$('#up');if(up)up.onclick=()=>startQuiz(Q.l+1);

     </div></div>

  const draw=()=>{$('#blens',el).innerHTML=lensSVG(S.R,{eye:S.eye});const lv=Math.abs(S.eye)<.08;$('#eyelab',el).innerHTML=lv?'<span class="pill ok">눈높이 수평 ✓</span>':`<span class="pill warn">눈이 ${S.eye>0?'아래':'위'}에 있어요 → 시차 발생</span>`};
  draw();
  $('#eye',el).oninput=e=>{S.eye=+e.target.value;draw()};
  $('#bchk',el).onclick=()=>{if(S.reads>=3)return;const raw=$('#brd',el).value.trim();const v=num(raw);if(isNaN(v)){toast('숫자로 입력하세요');return}
    if(Math.abs(S.eye)>=.08){$('#bfb',el).innerHTML=`<div class="feedback bad pop"><b>눈높이부터!</b><p>눈이 메니스커스보다 ${S.eye>0?'아래':'위'}에 있으면 실제보다 ${S.eye>0?'크게':'작게'} 읽혀요. 슬라이더를 가운데(수평)로 맞춘 뒤 읽으세요.</p></div>`;return}
    const ok=Math.abs(v-S.R)<=.051;const decOk=/\.\d$/.test(raw);
    if(ok&&decOk){S.reads++;$('#bfb',el).innerHTML=`<div class="feedback ok pop"><b>정확! (${fx(S.R,1)} mL)</b><p>메니스커스 아랫면 기준, 소수 첫째 자리까지 읽었어요.</p></div>`;$('#bcount',el).textContent=`${S.reads} / 3`;
      if(S.reads>=3){$('#brd',el).disabled=true;$('#bchk',el).disabled=true;$('#eye',el).disabled=true;$('#bfb',el).innerHTML=`<div class="feedback ok pop"><b>눈금 읽기 3회 완료!</b><p>${S.orderOk?'뷰렛 준비 순서도 맞혔어요. 미션 완료!':'왼쪽 ① 뷰렛 준비 순서도 맞히면 미션 완료예요.'}</p></div>`;check();return}
      S.R=newR();S.eye=pk([-.7,.6,.9,-.4]);$('#eye',el).value=S.eye;$('#brd',el).value='';setTimeout(draw,900);check()}
    else $('#bfb',el).innerHTML=`<div class="feedback bad pop"><b>아쉬워요</b><p>${!decOk?'소수 첫째 자리까지(예: 12.4) 적어야 해요. ':''}${ok?'':`정답은 ${fx(S.R,1)} mL. 큰 눈금(1 mL) → 작은 눈금(0.1 mL) 순으로 세어 보세요.`}</p></div>`};
  function check(){if(S.orderOk&&S.reads>=3&&!S.fin){S.fin=1;markDone('burette');$('#bnext',el).innerHTML=nextMission('burette');bindNext(el,'burette')}}
}

/* 3. 피펫 필러 · 부피 플라스크 */
function fillerSVG(o={}){
  const {flat=false,act='',level=0,where='',residual=false,labels=false}=o;
  const hl=k=>act===k?'var(--accent)':'#2b2b2b';
  const mark=.72,top=300,bot=548,ly=bot-(bot-top)*level,my=bot-(bot-top)*mark;
  const lx=292,lr=54,zs=5,liqTopZ=my-(level-mark)*(bot-top)*zs;
  return `<svg viewBox="0 0 380 570" width="100%" style="max-width:420px" role="img" aria-label="피펫 필러와 홀 피펫">

   <rect x="148" y="30" width="44" height="28" rx="6" fill="${hl('A')}"/><text x="170" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">A</text>

   ${flat?`<ellipse cx="170" cy="112" rx="74" ry="32" fill="#C8373B"/>`:`<circle cx="170" cy="116" r="58" fill="#C8373B"/>`}
   <text x="170" y="121" text-anchor="middle" font-size="13" fill="#fff">${flat?'쭈그러짐':'고무구'}</text>
   <rect x="152" y="172" width="36" height="96" rx="5" fill="#C8373B"/>
   <rect x="146" y="186" width="48" height="28" rx="6" fill="${hl('S')}"/><text x="170" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">S</text>
   ${labels?`<text x="138" y="206" text-anchor="end" font-size="14" fill="${INK}">빨아올리기</text>`:''}
   <rect x="186" y="232" width="56" height="18" rx="4" fill="#C8373B"/>
   <rect x="194" y="222" width="38" height="38" rx="6" fill="${hl('E')}"/><text x="213" y="247" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">E</text>
   <circle cx="262" cy="241" r="18" fill="${act==='EB'?'var(--accent)':'#C8373B'}"/><text x="262" y="245" text-anchor="middle" font-size="10" fill="#fff">작은 구</text>
   <circle cx="244" cy="262" r="5" fill="${act==='EB'?'var(--accent)':'#fff'}" stroke="${INK}" stroke-width="1.5"/><path d="M249 266 L268 282" stroke="var(--muted)"/><text x="254" y="296" font-size="12" fill="${INK}">E 옆 구멍</text>
   ${labels?`<text x="284" y="232" font-size="14" fill="${INK}">내보내기</text>`:''}
   <rect x="158" y="268" width="24" height="32" fill="#555"/>
   <path d="M162 300 V${bot} L170 566 L178 ${bot} V300" fill="rgba(200,225,240,.3)" stroke="${INK}" stroke-width="2"/>
   ${level>0?`<path d="M163.5 ${Math.max(ly,302)} V${bot} L170 562 L176.5 ${bot} V${Math.max(ly,302)}Z" fill="rgba(222,170,90,.85)"/>`:''}
   ${residual?`<circle cx="170" cy="562" r="4" fill="rgba(222,170,90,.95)"/>`:''}
   <line x1="150" x2="190" y1="${my}" y2="${my}" stroke="var(--accent)" stroke-width="3.5"/><text x="120" y="${my+5}" text-anchor="end" font-size="15" font-weight="700" fill="var(--accent)">표선 →</text>
   <defs><clipPath id="pzc"><circle cx="${lx}" cy="${my}" r="${lr}"/></clipPath></defs>
   <line x1="190" y1="${my}" x2="${lx-lr}" y2="${my}" stroke="var(--muted)" stroke-dasharray="3 3"/>
   <g clip-path="url(#pzc)"><rect x="${lx-lr}" y="${my-lr}" width="${lr*2}" height="${lr*2}" fill="var(--surface)"/>
    ${level>0?`<path d="M${lx-26} ${liqTopZ-8} Q${lx} ${liqTopZ+8} ${lx+26} ${liqTopZ-8} V${my+lr+5} H${lx-26}Z" fill="rgba(222,170,90,.85)"/><path d="M${lx-26} ${liqTopZ-8} Q${lx} ${liqTopZ+8} ${lx+26} ${liqTopZ-8}" fill="none" stroke="${INK}" stroke-width="1.2"/>`:''}
    <line x1="${lx-26}" x2="${lx-26}" y1="${my-lr}" y2="${my+lr}" stroke="${INK}" stroke-width="2.5"/><line x1="${lx+26}" x2="${lx+26}" y1="${my-lr}" y2="${my+lr}" stroke="${INK}" stroke-width="2.5"/>
    <line x1="${lx-34}" x2="${lx+34}" y1="${my}" y2="${my}" stroke="var(--accent)" stroke-width="3"/></g>
   <circle cx="${lx}" cy="${my}" r="${lr}" fill="none" stroke="${INK}" stroke-width="3.5"/><text x="${lx}" y="${my+lr+18}" text-anchor="middle" font-size="12" fill="var(--muted)">표선 확대</text>
  </svg>`;
}
function pPipette(el){
  const FN=[['A','누른 채 고무구를 쥐어 공기를 빼낸다'],['S','누르면 용액이 피펫으로 빨려 올라온다'],['E','누르면 용액이 흘러나온다']];
  const FOPTS=['누른 채 고무구를 쥐어 공기를 빼낸다','누르면 용액이 피펫으로 빨려 올라온다','누르면 용액이 흘러나온다','누르면 피펫이 필러에서 빠진다'];
  const S={fnOk:false,flat:false,level:0,where:'air',act:'',stage:0,residual:false,simOk:false,L:.55,done2:false,over:false};
  const MARK=.72;
  const TASKS=['A를 누른 채 고무구를 쥐어 공기 빼기','피펫 끝을 식초에 담그고 S를 눌러 표선 위까지 빨아올리기','E를 짧게 여러 번 눌러 메니스커스 아랫면을 표선에 맞추기 (내려가면 S로 다시)','삼각 플라스크로 옮겨 E를 눌러 용액 내보내기','E 옆 구멍을 막고 작은 고무구를 눌러 끝에 남은 용액 밀어내기'];
  el.innerHTML=`<div class="card"><p class="eyebrow">왜 중요할까?</p><p style="margin-top:6px">시약은 <b>절대 입으로 빨아올리지 않아요.</b> 홀 피펫에는 반드시 <b>피펫 필러(안전 필러)</b>를 끼워 A · S · E 세 밸브로 조작합니다. 식초 20 mL를 삼각 플라스크에 옮기는 과정으로 연습해 봐요.</p></div>
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>① A · S · E 밸브의 기능</h3>
    <div class="stack" style="margin-top:10px">${FN.map(([k])=>`<label class="row" style="gap:10px;align-items:center"><span class="pill acc" style="font-size:16px;min-width:40px;justify-content:center">${k}</span><select data-fn="${k}" style="flex:1"><option value="">— 기능 선택 —</option>${FOPTS.map(o=>`<option>${o}</option>`).join('')}</select></label>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn pri sm" id="fnc">확인</button></div><div id="fnf"></div>
    <h3 style="margin-top:18px">② 필러로 식초 20 mL 옮기기</h3>
    <ol class="steps" id="ftask" style="margin-top:8px;padding:0;list-style:none"></ol>
    <div class="row" style="margin-top:10px;gap:6px">
     <button class="btn sm" id="fa">A 누르고 고무구 쥐기</button>
     <button class="btn sm holdbtn" id="fs">S 누르기 (누르고 있기)</button>
     <button class="btn sm holdbtn" id="fe">E 누르기 (누르고 있기)</button>
     <button class="btn sm" id="feb">E 옆 구멍 막고 작은 고무구 누르기</button>
    </div>
    <div class="row" style="margin-top:6px;gap:6px"><button class="btn sm" id="freset">처음부터 다시</button><button class="btn sm glass" id="wsample">피펫 끝을 식초에 담그기</button><button class="btn sm glass" id="wflask">삼각 플라스크로 옮기기</button></div>
    <div id="ff" style="margin-top:8px"></div></div>
   <div class="card" style="display:flex;flex-direction:column;align-items:center"><div id="fsvg" style="width:100%;display:flex;justify-content:center"></div><p class="small muted" id="flv" style="margin-top:6px"></p></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>③ 부피 플라스크 표선 맞추기</h3><p class="small muted" style="margin-top:4px">1 L 부피 플라스크에 녹인 NaOH가 들어 있어요. 세척병으로 채우다가, 표선 가까이에서는 스포이트로 한 방울씩! 메니스커스 아랫면이 표선에 닿으면 완료.</p>
    <div class="row" style="margin-top:10px;align-items:center;justify-content:center"><div id="fl"></div><div id="fzoom"></div></div>
    <div class="row" style="margin-top:10px"><button class="btn holdbtn" id="fill">세척병으로 채우기 (누르고 있기)</button><button class="btn" id="drop">스포이트 한 방울</button><button class="btn pri" id="fok">표선 완료</button></div>
    <div id="ffb"></div></div><div class="row" style="margin-top:14px;justify-content:flex-end" id="pnext"></div>`;
  $('#fnc',el).onclick=()=>{const bad=FN.filter(([k,t])=>$(`[data-fn="${k}"]`,el).value!==t);S.fnOk=!bad.length;draw();$('#fnf',el).innerHTML=S.fnOk?`<div class="feedback ok pop"><b>정답!</b><p>A는 공기 빼기 → S는 빨아올리기 → E는 내보내기. E 옆의 작은 구멍을 막고 작은 고무구를 누르면 피펫 끝에 남은 용액까지 밀어낼 수 있어요.</p></div>`:`<div class="feedback bad pop"><p>${bad.map(b=>b[0]).join(', ')} 밸브를 다시 생각해 보세요.</p></div>`;chk()};
  const fb=(t,ok)=>{$('#ff',el).innerHTML=`<div class="feedback ${ok?'ok':'bad'} pop"><p>${t}</p></div>`};
  const draw=()=>{$('#fsvg',el).innerHTML=fillerSVG({flat:S.flat,act:S.act,level:S.level,where:S.where,residual:S.residual,labels:S.fnOk});
    $('#ftask',el).innerHTML=TASKS.map((t,i)=>`<li class="stp ${i<S.stage?'done':i===S.stage?'cur':''}">${t}</li>`).join('');
    const d=(S.level-MARK)*20/MARK;$('#flv',el).textContent=S.level>0?`피펫 속 용액: ${(S.level/MARK*20).toFixed(1)} mL (표선 = 20.0 mL)`:'피펫이 비어 있어요'};
  draw();
  const flashAct=k=>{S.act=k;draw();setTimeout(()=>{if(S.act===k){S.act='';draw()}},500)};
  $('#fa',el).onclick=()=>{flashAct('A');if(S.level>0.02&&S.stage>=1){fb('용액이 들어 있을 때 A를 누르면 안 돼요. 공기 빼기는 맨 처음에!',false);return}S.flat=true;if(S.stage===0){S.stage=1;fb('고무구가 쭈그러졌어요. 이제 피펫 끝을 식초에 담그고 S를 누르세요.',true)}draw()};
  holdButton($('#fs',el),()=>{S.act='S';
    if(!S.flat){fb('고무구에 공기가 차 있어 빨아올릴 수 없어요. 먼저 A로 공기를 빼세요.',false);draw();return}
    if(S.where!=='sample'){fb('피펫 끝이 시료에 담겨 있지 않아 공기만 빨려 들어가요.',false);draw();return}
    S.level=Math.min(.95,S.level+.025);
    if(S.stage===1&&S.level>MARK+.02){S.stage=2;fb('표선 위까지 올라왔어요. E를 살짝 눌러 표선에 맞추세요.',true)}draw()},110);
  holdButton($('#fe',el),()=>{S.act='E';if(S.level<=0){draw();return}
    if(S.stage===2){S.level=Math.max(0,S.level-.0025);if(S.level<MARK-.006){fb('표선 아래로 내려갔어요! S를 눌러 다시 표선 위까지 빨아올린 뒤 E로 천천히 맞추세요.',false);S.stage=1}}
    else if(S.stage===3){if(S.where!=='flask'){fb('삼각 플라스크로 옮긴 뒤에 내보내세요.',false)}else{S.level=Math.max(.02,S.level-.05);if(S.level<=.02){S.residual=true;S.level=0;S.stage=4;fb('피펫 끝에 용액이 조금 남았어요. E 옆 구멍을 막고 작은 고무구를 누르세요.',true)}}}
    else S.level=Math.max(0,S.level-.02);
    draw()},110);
  ['pointerup','pointerleave','keyup'].forEach(ev=>{$('#fe',el).addEventListener(ev,()=>{S.act='';if(S.stage===2&&Math.abs(S.level-MARK)<=.006&&S.where==='sample'){S.level=MARK;S.stage=3;fb('표선에 딱 맞았어요! 삼각 플라스크로 옮겨 E를 눌러 내보내세요.',true)}draw()});$('#fs',el).addEventListener(ev,()=>{S.act='';draw()})});
  $('#feb',el).onclick=()=>{flashAct('EB');if(S.stage===4&&S.residual){S.residual=false;S.stage=5;S.simOk=true;fb('완료! 피펫 끝에 남은 용액까지 모두 옮겼어요. 식초 20.0 mL가 정확히 들어갔습니다.',true);chk()}else fb('끝에 남은 용액을 밀어낼 때 쓰는 방법이에요. 아직은 필요 없어요.',false);draw()};
  $('#wsample',el).onclick=()=>{S.where='sample';draw()};
  $('#freset',el).onclick=()=>{if(S.simOk)return;Object.assign(S,{flat:false,level:0,where:'air',act:'',stage:0,residual:false});$('#ff',el).innerHTML='';draw()};
  $('#wflask',el).onclick=()=>{if(S.stage<3){fb('먼저 메니스커스 아랫면을 표선에 맞추세요.',false);return}S.where='flask';draw()};
  // 부피 플라스크
  const neckZoom=()=>{const px=1400,cy=80,y=cy-(S.L-1)*px;return `<svg viewBox="0 0 160 160" width="230" height="230"><defs><clipPath id="nz"><circle cx="80" cy="80" r="77"/></clipPath></defs><g clip-path="url(#nz)"><rect width="160" height="160" fill="var(--surface)"/><path d="M50 ${y-7} Q80 ${y+7} 110 ${y-7} V170 H50Z" fill="rgba(160,200,230,.55)"/><path d="M50 ${y-7} Q80 ${y+7} 110 ${y-7}" fill="none" stroke="${INK}" stroke-width="1.5"/><line x1="40" x2="120" y1="${cy}" y2="${cy}" stroke="var(--accent)" stroke-width="2.5"/><text x="122" y="${cy-4}" font-size="11" fill="var(--accent)">표선</text><line x1="50" x2="50" y1="0" y2="160" stroke="${INK}" stroke-width="2.4"/><line x1="110" x2="110" y1="0" y2="160" stroke="${INK}" stroke-width="2.4"/></g><circle cx="80" cy="80" r="77" fill="none" stroke="${INK}" stroke-width="4"/></svg>`};
  const drawF=()=>{$('#fl',el).innerHTML=flaskSVG({level:S.L,vol:'1 L',w:190,h:300});$('#fzoom',el).innerHTML=S.L>.9?neckZoom():'<p class="small muted" style="width:230px">표선 근처(목 부분)에 오면 확대경이 켜져요</p>'};
  drawF();
  const add=d=>{if(S.done2)return;S.L+=d;if(S.L>1.012){S.over=true;S.L=Math.min(S.L,1.05);$('#ffb',el).innerHTML=`<div class="feedback bad pop"><b>표선을 넘었어요!</b><p>표선을 넘으면 덜어 낼 수 없어요. 농도가 묽어졌으니 처음부터 다시 만들어야 합니다.</p><button class="btn sm" id="fre" style="margin-top:6px">다시 만들기</button></div>`;$('#fre',el).onclick=()=>{S.L=.55;S.over=false;$('#ffb',el).innerHTML='';drawF()}}drawF()};
  holdButton($('#fill',el),()=>{if(!S.over)add(S.L<.88?.03:S.L<.97?.006:.003)},120);
  $('#drop',el).onclick=()=>{if(!S.over)add(.0012)};
  $('#fok',el).onclick=()=>{if(S.over)return;const d=(S.L-1)*1000;if(Math.abs(S.L-1)<=.0035){S.done2=true;$('#ffb',el).innerHTML=`<div class="feedback ok pop"><b>표선 완료!</b><p>이제 마개를 닫고 여러 번 뒤집어 섞으면 0.1 M NaOH 1 L 완성.</p></div>`;chk()}else $('#ffb',el).innerHTML=`<div class="feedback bad pop"><b>${d<0?'아직 모자라요':'조금 넘었어요'}</b><p>메니스커스 아랫면이 표선에 정확히 닿아야 해요.</p></div>`};
  function chk(){if(S.fnOk&&S.simOk&&S.done2&&!S.fin){S.fin=1;markDone('pipette');$('#pnext',el).innerHTML=nextMission('pipette');bindNext(el,'pipette')}}
}

/* 4. 실습실 안전 수칙 */
function pSafety(el){

/* 5. 0.1 M NaOH 만들기 — 저울 */
function balanceWidget(host,o){
  // o: {target, tol, onDone(m, info)}
  const S={paper:false,tare:0,naoh:0,t0:null,done:false};const PAPER=.352+Math.random()*.02;
  host.innerHTML=`<div class="bal"><div class="lcd" id="bl">0.00 g</div>
   <svg viewBox="0 0 200 70" width="220"><rect x="10" y="40" width="180" height="26" rx="6" fill="#9aa5a1"/><rect x="50" y="30" width="100" height="6" rx="3" fill="#555"/><g id="bp"></g></svg>
   <div class="row" style="justify-content:center;gap:6px">
    <button class="btn sm" id="b_p">시약포지 올리기</button><button class="btn sm" id="b_t">영점 (TARE)</button>
    <button class="btn sm" id="b_b">약숟가락 크게</button><button class="btn sm" id="b_s">조금 톡톡</button><button class="btn sm" id="b_r">조금 덜어 내기</button><button class="btn sm" id="b_x">처음부터</button>
   </div>
   <span class="small" id="bhint">① 시약포지 → ② 영점 → ③ NaOH 덜기</span></div>
   <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn pri" id="b_ok">칭량 완료</button></div><div id="bfb"></div>`;
  const disp=()=>(S.paper?PAPER:0)+S.naoh-S.tare;
  const draw=()=>{if(S.naoh>0&&!S.done){S.naoh+=.0002}$('#bl',host).textContent=disp().toFixed(2)+' g';
    $('#bp',host).innerHTML=(S.paper?`<path d="M60 28 L100 18 L140 28 Z" fill="#fff" stroke="#888"/>`:'')+(S.naoh>0?`<ellipse cx="100" cy="24" rx="${6+Math.min(18,S.naoh*4)}" ry="${2+Math.min(5,S.naoh)}" fill="#f4f4f4" stroke="#aaa"/>`:'')};
  const tick=setInterval(draw,200);onLeave(()=>clearInterval(tick));draw();
  $('#b_p',host).onclick=()=>{if(S.paper)return;S.paper=true;draw()};
  $('#b_t',host).onclick=()=>{if(S.naoh>0){toast('시약을 올리기 전에 영점을 맞춰야 해요');return}S.tare=S.paper?PAPER:0;draw();toast('영점 완료: 0.00 g')};
  const add=d=>{if(!S.paper){toast('저울 접시에 바로 시약을 올리면 안 돼요. 시약포지부터!');return}if(S.done)return;S.naoh=Math.max(0,S.naoh+d);draw()};
  $('#b_b',host).onclick=()=>add(rnd(.5,.9));$('#b_x',host).onclick=()=>{if(S.done)return;S.naoh=0;draw()};$('#b_s',host).onclick=()=>add(rnd(.04,.1));$('#b_r',host).onclick=()=>add(-rnd(.05,.12));
  $('#b_ok',host).onclick=()=>{if(S.done)return;const m=S.naoh,shown=disp();const tared=Math.abs(S.tare-(S.paper?PAPER:0))<1e-9&&S.paper;
    if(!S.paper||m<=0){toast('NaOH를 먼저 올리세요');return}
    if(!tared){$('#bfb',host).innerHTML=`<div class="feedback bad pop"><b>영점을 안 맞췄어요!</b><p>화면 ${shown.toFixed(2)} g에는 시약포지 무게(${PAPER.toFixed(2)} g)가 포함돼 있어요. 실제 NaOH는 ${m.toFixed(2)} g뿐. 시약을 덜어 내고 다시 해 보세요.</p><button class="btn sm" id="bre" style="margin-top:6px">처음부터</button></div>`;$('#bre',host).onclick=()=>balanceWidget(host,o);return}
    if(Math.abs(m-o.target)>o.tol){$('#bfb',host).innerHTML=`<div class="feedback bad pop"><b>${m<o.target?'모자라요':'너무 많아요'} (${m.toFixed(2)} g)</b><p>목표 ${o.target.toFixed(2)} g ± ${o.tol} g. NaOH는 공기 중 수분을 흡수해 계속 무거워지니 빨리!</p></div>`;return}
    S.done=true;o.onDone&&o.onDone(+m.toFixed(2),{})};
}
function pNaoh(el){
  const S={calc:false,weigh:false,ord:null,ordOk:false,m:null};
  const steps=['비커에 NaOH를 넣고 소량의 증류수로 녹인다','녹일 때 열이 나므로 식힌다','깔때기로 1 L 부피 플라스크에 옮긴다','비커를 증류수로 2~3번 헹궈 그 물도 넣는다','표선까지 증류수를 채우고 마개를 닫아 뒤집어 섞는다'];S.ord=shuffle(steps);
  el.innerHTML=`<div class="grid g2">
   <div class="card"><h3>① 필요한 질량 계산</h3><p style="margin-top:6px">0.1 M NaOH 수용액 1 L를 만들려면 NaOH 몇 g이 필요할까? (NaOH = 23 + 16 + 1 = 40 g/mol)</p>
    <div class="ansrow"><input id="nm" inputmode="decimal" placeholder="숫자"><span class="pill">g</span><button class="btn pri" id="nmc">확인</button></div><div id="nmf"></div>
    <h3 style="margin-top:18px">③ 녹이고 옮기는 순서</h3><div class="orderlist" id="no"></div><div class="row" style="margin-top:10px"><button class="btn pri" id="noc">순서 확인</button></div><div id="nof"></div></div>
   <div class="card"><h3>② 전자 저울로 칭량</h3><p class="small muted" style="margin-top:4px">목표 4.00 g (3.90 ~ 4.10 g이면 성공). NaOH는 공기 중 수분을 흡수해 조금씩 무거워지니 빠르게!</p><div id="bw" style="margin-top:10px"></div></div></div>
   <div class="row" style="margin-top:14px;justify-content:flex-end" id="nnext"></div>`;

  balanceWidget($('#bw',el),{target:4,tol:.1,onDone:m=>{S.weigh=true;S.m=m;$('#bw',el).insertAdjacentHTML('beforeend',`<div class="feedback ok pop"><b>칭량 완료: ${m.toFixed(2)} g</b><p>이 NaOH로 1 L를 만들면 ${(m/40).toFixed(4)} M 이에요.</p></div>`);chk()}});
  const getO=numOrder($('#no',el),S.ord);
  $('#noc',el).onclick=()=>{const r=getO();if(r.err){toast(r.err);return}S.ordOk=r.ord.join()===steps.join();$('#nof',el).innerHTML=S.ordOk?`<div class="feedback ok pop"><b>정확해요</b><p>부피 플라스크에 NaOH 고체를 바로 넣고 녹이면 열 때문에 부피가 부정확해져요.</p></div>`:`<div class="feedback bad pop"><b>다시</b><p>녹이기 → 식히기 → 옮기기 → 헹군 물도 넣기 → 표선 맞추고 섞기</p></div>`;chk()};
  function chk(){if(S.calc&&S.weigh&&S.ordOk){markDone('naoh');$('#nnext',el).innerHTML=nextMission('naoh');bindNext(el,'naoh')}}
}

  const CASES=[{sc:SC.hcl,Ca:.1,lab:'염산(HCl) 20 mL + NaOH 적정',t:'강산 + 강염기'},{sc:SC.vinegar,Ca:.085,lab:'식초(아세트산) 20 mL + NaOH 적정',t:'약산 + 강염기'},{sc:SC.nh3,Ca:.1,lab:'암모니아수(NH₃) 20 mL + HCl 적정',t:'강산 + 약염기'}];

   <div class="stack" style="margin-top:14px" id="cc"></div><div class="row" style="margin-top:14px;justify-content:flex-end" id="chnext"></div>`;
  const draw=()=>{$('#cc',el).innerHTML=CASES.map((c,i)=>{const s=S[i];const ind=s.ind?IND[s.ind]:null;const j=ind?judgeIndicator(c.sc,ind):null;
    const colOpts=['무색 → 옅은 분홍색','붉은색 → 무색','빨간색 → 주황색','노란색 → 주황색','노란색 → 초록색','파란색 → 초록색','붉은색 → 보라색','푸른색 → 보라색'];
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${i+1}. ${c.lab}</h3><span class="pill acc">${c.t}</span></div>
     <p class="small muted" style="margin-top:4px">반응식: ${c.sc.eq} · 생성된 염: ${c.sc.salt} · 중화점 pH ${c.sc.eqpH}</p>
     <div style="margin-top:8px">${curveSVG({sc:c.sc,Ca:c.Ca,Ct:.1,ind,W:600,H:260,marks:ind?[{v:vIndicator(c.sc,c.Ca,20,.1,ind),label:'종말점'}]:[]})}</div>
     <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px">${IND_ORDER.map(k=>`<button class="indbottle ${s.ind===k?'sel':''}" data-ci="${i}" data-k="${k}"><b>${IND[k].n}</b><span class="small muted">pH ${IND[k].range[0]} ~ ${IND[k].range[1]}</span><span><span class="swatch" style="background:${indRGBA(IND[k],1)}"></span> → <span class="swatch" style="background:${indRGBA(IND[k],13)}"></span></span></button>`).join('')}</div>
     ${j?`<div class="feedback ${j.ok?'ok':'bad'} pop"><b>${j.ok?'알맞은 지시약':'부적합'}</b><p>${j.why}</p></div>`:''}
     ${s.ok?`<label class="stack" style="gap:4px;margin-top:10px"><b class="small">이 지시약의 종말점 색 변화는? (시료에 적정액을 넣어 갈 때)</b><select data-col="${i}"><option value="">— 선택 —</option>${colOpts.map(o=>`<option ${s.col===o?'selected':''}>${o}</option>`).join('')}</select></label>${s.col?`<div class="feedback ${s.colOk?'ok':'bad'} pop"><p>${s.colOk?'정답! 이 색이 되어 흔들어도 유지되면 꼭지를 잠가요.':'다시 생각해 보세요. 처음 용액의 액성에서의 색 → 변색 범위 가운데 색'}</p></div>`:''}`:''}
    </div>`}).join('');
    $$('[data-ci]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.ci;const s=S[i];s.ind=b.dataset.k;s.ok=judgeIndicator(CASES[i].sc,IND[s.ind]).ok;s.col=null;s.colOk=false;draw()});
    $$('[data-col]',el).forEach(sel=>sel.onchange=()=>{const i=+sel.dataset.col;const s=S[i];s.col=sel.value;s.colOk=sel.value===endChange(CASES[i].sc,IND[s.ind]);draw()});
    if(S.every(s=>s.ok&&s.colOk)&&!S.fin){S.fin=1;markDone('choose');$('#chnext',el).innerHTML=nextMission('choose')}
  };
  draw();
}

/* ===== 5. 심화 실습 — 적정 → 결과 보고서 ===== */
let A=null;
const STEPS={
  1:['실험 준비','0.1 M NaOH 만들기','시료 준비','지시약 선택','뷰렛 준비','적정 (3회)','결과 계산','결과 보고서','채점 · 피드백'],

};
function newAdv(stage,key){
  const sc=stage===1?SC.vinegar:SC[key||'hcl'];
  const a={stage,sc,Va:20,step:stage===1?0:(key?1:0),maxStep:0,t0:Date.now(),trials:[],pts:{},log:[],ind:null};
  if(stage===1){a.Cvin=rnd(.75,.92);a.Ca=a.Cvin/10;a.Ct=null}
  else{a.Ca=sc.aType==='sa2'?rnd(.040,.060):rnd(.080,.120);a.Ct=.1}
  a.maxStep=a.step;return a;
}
function renderAdv(){
  if(!A){

    <p class="muted" style="margin-top:8px;max-width:70ch">용액 조제부터 적정 3회, 계산, 결과 보고서 제출까지 한 번에 진행합니다. 핵심은 <b>알맞은 지시약을 고르고, 색이 바뀌는 그 한 방울에서 멈추는 것(종말점)</b>이에요. 보고서를 제출하면 결과가 선생님께 전달됩니다.</p>
    <div class="grid g2" style="margin-top:20px">
     <button class="mode" id="st1"><span class="tag">1단계 · 교과서 실습 과제</span><h3>식초 속 아세트산의 농도</h3>
      ${erlenSVG(indRGBA(IND.pp,8.7,.55),.45,90,110)}
      <ul><li>0.1 M NaOH 직접 조제 (NaOH 4 g + 증류수 1 L)</li><li>식초 10 mL + 증류수 90 mL → 20 mL 적정</li><li>아세트산 몰 농도와 함량(%) 산출</li></ul></button>
     <div class="mode" style="cursor:default"><span class="tag">2단계 · 다른 산과 염기</span><h3>미지 농도 구하기</h3>
      <div class="stack" style="gap:8px">${['hcl','h2so4','nh3'].map(k=>`<button class="btn" data-st2="${k}" style="justify-content:space-between;width:100%"><span>${SC[k].title}</span><span class="small muted">${SC[k].type}</span></button>`).join('')}</div>
      <ul><li>0.1000 M 표준 용액 사용</li><li>2가 산(황산)의 몰 비, 약염기의 지시약 선택에 주의</li></ul></div>
    </div>
    ${reps.length?`<div class="card" style="margin-top:18px"><h3>내가 제출한 보고서</h3><div class="tw" style="margin-top:8px"><table class="table"><tr><th>제출</th><th>과제</th><th>지시약</th><th>결과</th><th>점수</th><th></th></tr>${reps.slice().reverse().map((r,i)=>`<tr><td class="mono small">${new Date(r.time).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(r.title)}</td><td>${esc(r.ind)}</td><td class="mono">${esc(r.result)}</td><td class="mono">${r.score}</td><td><button class="btn sm" data-rep="${reps.length-1-i}">보기</button></td></tr>`).join('')}</table></div></div>`:''}`;
    $('#st1').onclick=()=>{A=newAdv(1);renderAdv()};
    $$('[data-st2]').forEach(b=>b.onclick=()=>{A=newAdv(2,b.dataset.st2);renderAdv()});
    $$('[data-rep]').forEach(b=>b.onclick=()=>showSavedReport(+b.dataset.rep));
    return;
  }
  app.innerHTML=`<div class="row noprint" style="justify-content:space-between;align-items:flex-end">
    <div><p class="eyebrow">심화 실습 ${A.stage}단계 · ${esc(A.sc.type)}</p><h2 style="margin-top:6px">${esc(A.sc.title)}</h2></div>
    <div class="row"><span class="pill">${esc(sLabel(getStudent()))}</span><button class="btn sm" id="quitA">과제 나가기</button></div></div>
   <div class="examgrid" style="margin-top:16px"><nav class="stepper" id="stepper"></nav><section id="stepbody"></section></div>`;

function drawStepper(){
  $('#stepper').innerHTML=STEPS[A.stage].map((n,i)=>`<button class="sb ${i<A.maxStep||(i===8&&A.graded)?'done':''} ${i===A.step?'cur':''}" data-s="${i}" ${i>A.maxStep||(A.graded&&i<8)?'disabled':''}><span class="d">${i+1}</span>${n}</button>`).join('');
  $$('[data-s]').forEach(b=>b.onclick=()=>goStep(+b.dataset.s));
}
function goStep(i){cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];A.step=i;A.maxStep=Math.max(A.maxStep,i);drawStepper();renderStep();window.scrollTo({top:0})}
function nextBtn(label,ok,why){return `<div class="row" style="margin-top:16px;justify-content:flex-end">${!ok&&why?`<span class="small muted">${why}</span>`:''}<button class="btn pri" id="anext" ${ok?'':'disabled'}>${label} →</button></div>`}
function bindNextA(el){const b=$('#anext',el);if(b)b.onclick=()=>goStep(A.step+1)}
function renderStep(){
  const el=$('#stepbody');
  const f=A.stage===1?[a0,a1,a2,aInd,aBur,aTit,aCalc,aRep,aGrade]:[b0,b1,a2,aInd,aBur,aTit,aCalc,aRep,aGrade];

}

/* 1단계-0: 실험 준비 */
function a0(el){
  const REQ=['부피 플라스크','삼각 플라스크','비커','피펫','전자 저울','약숟가락','시약포지','뷰렛'];const DIS=['분광광도계','큐벳','알코올 램프','막자사발'];

  el.innerHTML=`<div class="card"><h3>실습 목적</h3><p style="margin-top:6px">식초 속 아세트산의 농도를 중화 적정을 이용하여 구할 수 있다.</p>
   <p class="small muted" style="margin-top:6px">반응: ${A.sc.eq}</p></div>
   <div class="grid g2" style="margin-top:14px">

    <div class="card"><h3>② 준비물 고르기</h3><p class="small muted" style="margin-top:4px">교과서 실습 준비물에 있는 기구만 골라 실험대에 올리세요 (시약 제외).</p>
     <div class="row" style="margin-top:10px;gap:8px">${S.items.map(t=>`<button class="chip" data-it="${t}" style="${S.sel[t]?'border-color:var(--accent);background:var(--accent-soft)':''}">${t}</button>`).join('')}</div>
     <div class="row" style="margin-top:10px"><button class="btn sm pri" id="itc">준비물 확인</button></div><div id="itf"></div></div></div>
   ${nextBtn('다음: 0.1 M NaOH 만들기',S.ok&&Object.keys(S.ppe).length===3,'복장 3가지와 준비물을 모두 갖추세요')}`;
  $$('[data-ppe]',el).forEach(b=>b.onclick=()=>{S.ppe[b.dataset.ppe]=!S.ppe[b.dataset.ppe];if(!S.ppe[b.dataset.ppe])delete S.ppe[b.dataset.ppe];a0(el)});
  $$('[data-it]',el).forEach(b=>b.onclick=()=>{if(S.ok)return;S.sel[b.dataset.it]=!S.sel[b.dataset.it];a0(el)});
  $('#itc',el).onclick=()=>{S.tries++;const sel=Object.keys(S.sel).filter(k=>S.sel[k]);const miss=REQ.filter(r=>!sel.includes(r)),extra=sel.filter(s=>DIS.includes(s));
    if(!miss.length&&!extra.length){S.ok=true;A.pts.prep0=S.tries===1?1:S.tries===2?.6:.3;a0(el);toast('준비 완료!')}
    else $('#itf',el).innerHTML=`<div class="feedback bad pop"><p>${miss.length?`빠진 기구 ${miss.length}개. `:''}${extra.length?`필요 없는 기구: ${extra.join(', ')} (흡광광도법용이거나 이 실험에 안 써요)`:''}</p></div>`};

/* 1단계-1: NaOH 조제 */
function a1(el){
  el.innerHTML=`<div class="card"><h3>0.1 M 수산화 소듐 수용액 1 L 만들기</h3>
   <p class="small muted" style="margin-top:4px">교과서 실습 방법 1: 수산화 소듐 4 g과 증류수 1 L를 이용하여 0.1 M 수산화 소듐 수용액을 만든다. 칭량한 질량으로 실제 농도가 정해져요!</p>
   <div class="grid g2" style="margin-top:12px"><div id="abw"></div><div class="stack">
    <div class="panel small"><b>이렇게 해요</b><ol style="margin:6px 0 0;padding-left:18px"><li>시약포지를 올리고 영점(TARE)</li><li>약숟가락으로 NaOH를 덜어 4.00 g 근처로</li><li>공기 중 수분을 흡수해 무게가 늘어요 → 빠르게!</li></ol></div>
    <div id="amres">${A.Ct?resNaOH():''}</div></div></div></div>

  if(!A.Ct)balanceWidget($('#abw',el),{target:4,tol:.1,onDone:m=>{A.mNaOH=m;A.Ct=m/40;A.pts.naoh=Math.abs(m-4)<=.05?1:.8;$('#amres',el).innerHTML=resNaOH();$('#anext',el).disabled=false;$('#anext',el).previousElementSibling?.remove()}});
  else $('#abw',el).innerHTML=`<div class="bal"><div class="lcd">${A.mNaOH.toFixed(2)} g</div><span class="small">칭량 완료</span></div>`;
  bindNextA(el);
}
function resNaOH(){return `<div class="feedback ok pop"><b>NaOH ${A.mNaOH.toFixed(2)} g → 1 L</b><p>녹이고 식혀 1 L 부피 플라스크 표선까지 채웠어요.</p><p style="margin-top:6px">NaOH의 몰 농도 = ${A.mNaOH.toFixed(2)} g ÷ 40.00 g/mol ÷ 1.000 L = <b class="mono">${A.Ct.toFixed(4)} M</b></p><p class="small muted" style="margin-top:4px">결과 계산에서 이 값을 사용하세요. (뷰렛 라벨: NaOH ${A.Ct.toFixed(4)} M)</p></div>`}

/* 2단계-0: 과제 선택 (이미 선택되어 들어오면 건너뜀) */
function b0(el){
  el.innerHTML=`<div class="card"><h3>분석할 시료를 고르세요</h3><div class="stack" style="margin-top:10px">${['hcl','h2so4','nh3'].map(k=>`<button class="unit ${A.sc.key===k?'on':''}" data-k="${k}"><span class="num">${SC[k].type}</span><span><b>${SC[k].title}</b><br><span class="small muted">시료: ${SC[k].acid} 20.00 mL · 뷰렛: ${SC[k].titrant}</span></span></button>`).join('')}</div></div>${nextBtn('다음: 반응식 · 몰 비',true)}`;
  $$('[data-k]',el).forEach(b=>b.onclick=()=>{const t=A.maxStep;A=newAdv(2,b.dataset.k);A.step=0;b0(el);drawStepper()});

/* 2단계-1: 반응식 · 몰 비 */
function b1(el){
  const sc=A.sc;const S=A.b1||(A.b1={eq:null,na:'',nb:'',tries:0,ok:false});
  const EQ={hcl:['HCl + NaOH → NaCl + H₂O','2HCl + NaOH → NaCl₂ + H₂O','HCl + NaOH → NaOH + HCl','HCl + NaOH → Na + Cl + H₂O'],
    h2so4:['H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O','H₂SO₄ + NaOH → NaSO₄ + H₂O','H₂SO₄ + 2NaOH → 2NaSO₄ + H₂','2H₂SO₄ + NaOH → Na₂SO₄ + H₂O'],
    nh3:['NH₃ + HCl → NH₄Cl','NH₃ + HCl → NH₂Cl + H₂','2NH₃ + HCl → (NH₄)₂Cl','NH₃ + 2HCl → NH₄Cl₂']}[sc.key];
  const opts=A.b1opts||(A.b1opts=shuffle(EQ));
  el.innerHTML=`<div class="card"><h3>① 반응식 고르기</h3><p class="small muted" style="margin-top:4px">시료: ${sc.acid} · 뷰렛: ${sc.titrant}</p><div class="opts">${opts.map(o=>`<button class="opt ${S.eq===o?'sel':''}" data-eq="${esc(o)}">${o}</button>`).join('')}</div></div>
   <div class="card" style="margin-top:14px"><h3>② 중화 적정의 양적 관계</h3><p style="margin-top:6px">산이 내놓는 H⁺의 몰 수 = 염기가 내놓는(받는) OH⁻의 몰 수 → <b>n·M·V = n′·M′·V′</b></p>
    <div class="row" style="margin-top:10px">${sc.analyte==='acid'?`<label class="small">산(${sc.aShort})의 가수 n <select id="na"><option></option><option>1</option><option>2</option><option>3</option></select></label><label class="small">염기(NaOH)의 가수 n′ <select id="nb"><option></option><option>1</option><option>2</option><option>3</option></select></label>`:`<label class="small">염기(NH₃)가 받는 H⁺ 수 n <select id="na"><option></option><option>1</option><option>2</option><option>3</option></select></label><label class="small">산(HCl)의 가수 n′ <select id="nb"><option></option><option>1</option><option>2</option><option>3</option></select></label>`}</div>
    <div class="row" style="margin-top:10px"><button class="btn pri sm" id="b1c">확인</button></div><div id="b1f"></div></div>
   ${nextBtn('다음: 시료 준비',S.ok,'반응식과 가수를 확인하세요')}`;
  if(S.na)$('#na',el).value=S.na;if(S.nb)$('#nb',el).value=S.nb;
  $$('[data-eq]',el).forEach(b=>b.onclick=()=>{if(S.ok)return;S.eq=b.dataset.eq;S.na=$('#na',el).value;S.nb=$('#nb',el).value;b1(el)});
  $('#b1c',el).onclick=()=>{if(S.ok)return;S.na=$('#na',el).value;S.nb=$('#nb',el).value;if(!S.eq||!S.na||!S.nb){toast('반응식과 가수를 모두 고르세요');return}S.tries++;
    const ok=S.eq===EQ[0]&&+S.na===sc.na&&+S.nb===sc.nb;
    if(ok){S.ok=true;A.pts.prep0=S.tries===1?1:S.tries===2?.6:.3;b1(el);toast('정답!')}
    else $('#b1f',el).innerHTML=`<div class="feedback bad pop"><p>${S.eq!==EQ[0]?'반응식의 원자 수·전하가 맞는지 다시 보세요. ':''}${+S.na!==sc.na||+S.nb!==sc.nb?(sc.key==='h2so4'?'황산 1 분자는 H⁺를 2개 내놓아요 (2가 산).':'가수를 다시 생각해 보세요.'):''}</p></div>`};
  if(S.ok)$('#b1f',el).innerHTML=`<div class="feedback ok"><b>${EQ[0]}</b><p>${sc.analyte==='acid'?`${sc.na} × M(${sc.aShort}) × 20.00 mL = ${sc.nb} × 0.1000 M × V(NaOH)`:`M(NH₃) × 20.00 mL = 0.1000 M × V(HCl)`}</p></div>`;
  bindNextA(el);
}

/* 공통-2: 시료 준비 (피펫 선택) */
function a2(el){
  const st1=A.stage===1;
  const QS=st1?[

   :[{k:'q1',q:`${A.sc.acid} 20.00 mL를 삼각 플라스크에 옮길 기구는?`,o:['20 mL 홀 피펫 + 피펫 필러','50 mL 비커','약숟가락','눈대중'],a:0},

/* 공통-3: 지시약 선택 (핵심) */

   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px">${IND_ORDER.map(k=>{const d=IND[k];return `<button class="indbottle ${S.pick===k?'sel':''}" data-k="${k}" ${S.conf?'disabled':''}>
     <div class="row" style="gap:8px"><div style="width:44px">${TOOLSVG.dropper.replace('PP',k.toUpperCase().slice(0,3)).replace('rgba(228,32,140,.08)',indRGBA(d,k==='pp'?12:7,.3))}</div><div><b>${d.n}</b><br><span class="small muted mono">pH ${d.range[0]} ~ ${d.range[1]}</span></div></div>
     <span class="small"><span class="swatch" style="background:${indRGBA(d,1)}"></span> ${d.names[0]} · <span class="swatch" style="background:${indRGBA(d,(d.range[0]+d.range[1])/2)}"></span> ${d.k==='pp'?'옅은 분홍':d.names[1]} · <span class="swatch" style="background:${indRGBA(d,13)}"></span> ${d.names[2]}</span></button>`}).join('')}</div>
   <label class="stack" style="gap:4px;margin-top:14px"><b>예상되는 종말점의 색 변화 (시료에 ${sc.tShort}를 넣어 갈 때)</b><select id="chg" ${S.conf?'disabled':''}><option value="">— 선택 —</option>${colOpts.map(o=>`<option ${S.change===o?'selected':''}>${o}</option>`).join('')}</select></label>
   <div class="row" style="margin-top:12px"><button class="btn pri" id="indc" ${S.conf?'disabled':''}>이 지시약으로 결정</button></div><div id="indf">${S.conf?indFeedback():''}</div></div>
   ${nextBtn('다음: 뷰렛 준비',S.conf&&(S.ok||S.force),'지시약을 결정하세요')}`;
  $$('[data-k]',el).forEach(b=>b.onclick=()=>{S.pick=b.dataset.k;S.change=$('#chg',el).value||S.change;aInd(el)});

    S.tries++;const j=judgeIndicator(sc,IND[S.pick]);S.ok=j.ok;S.chOk=S.change===endChange(sc,IND[S.pick]);

  const fo=$('#indforce',el);if(fo)fo.onclick=()=>{S.force=true;toast('결과를 비교해 보는 것도 좋은 공부예요');goStep(A.step+1)};

   ${j.ok?`<p class="small" style="margin-top:6px">종말점 판단 기준: ${ind.k==='pp'?'한 방울 넣고 흔들었을 때 <b>옅은 분홍색이 30초 이상 유지</b>되면 꼭지를 잠가요. 진한 자주색은 지나친 것!':`용액 전체가 <b>${ind.endName}</b>으로 바뀌어 흔들어도 유지되면 멈춰요.`}</p>`:`<div class="row" style="margin-top:10px"><button class="btn sm pri" id="indre">다시 고르기</button><button class="btn sm" id="indforce">그래도 이 지시약으로 해 보기 (감점)</button></div>`}</div>`;

/* 공통-4: 뷰렛 준비 */
function aBur(el){

  const NO=['증류수로 헹군 뒤 물기가 남은 채로 바로 채운다','깔때기를 꽂아 둔 채로 적정한다','뷰렛을 눈높이보다 높은 곳에 두고 위에서 붓는다','액면이 0 눈금보다 위에 있는 채로 적정을 시작한다'];
  const S=A.bur||(A.bur={sel:{},items:shuffle(OK.concat(NO)),tries:0,ok:false});
  el.innerHTML=`<div class="card"><h3>뷰렛 준비 — 올바른 행동만 고르세요</h3><p class="small muted" style="margin-top:4px">뷰렛에 넣을 용액: <b>${A.stage===1?`NaOH ${A.Ct.toFixed(4)} M`:A.sc.titrant}</b></p>
   <div class="stack" style="margin-top:10px;gap:8px">${S.items.map(t=>`<button class="sortcard ${S.sel[t]?(S.ok&&!OK.includes(t)?'risk':'safe'):''}" data-t="${esc(t)}"><span>${t}</span><span class="tag2 pill ${S.sel[t]?'ok':''}">${S.sel[t]?'할 일':'—'}</span></button>`).join('')}</div>
   <div class="row" style="margin-top:10px"><button class="btn pri sm" id="burc">확인</button></div><div id="burf">${S.ok?`<div class="feedback ok"><b>뷰렛 준비 완료</b><p>뷰렛 눈금이 0.0 mL에서 시작하므로, 종말점에서 읽은 눈금이 곧 사용한 부피예요. 삼각 플라스크 아래에 흰 종이를 깔면 색 변화가 잘 보여요.</p></div>`:''}</div></div>
   ${nextBtn('다음: 적정 시작',S.ok,'올바른 행동 5가지를 고르세요')}`;
  $$('[data-t]',el).forEach(b=>b.onclick=()=>{if(S.ok)return;const t=b.dataset.t;S.sel[t]=!S.sel[t];aBur(el)});
  $('#burc',el).onclick=()=>{if(S.ok)return;S.tries++;const sel=S.items.filter(t=>S.sel[t]);const miss=OK.filter(t=>!sel.includes(t)),bad=sel.filter(t=>NO.includes(t));
    if(!miss.length&&!bad.length){S.ok=true;A.pts.prep4=S.tries===1?1:.5;aBur(el)}else $('#burf',el).innerHTML=`<div class="feedback bad pop"><p>${miss.length?`빠진 행동 ${miss.length}개. `:''}${bad.length?`잘못된 행동: ${bad.join(' / ')}`:''}</p></div>`};
  bindNextA(el);
}

/* 공통-5: 적정 3회 */
function newTrial(){return {R0:0,V:0,phase:'titrate',ri:0,rf:null,riTry:0,rfTry:0,riOk:1,rfOk:null}}

  const sc=A.sc,ind=IND[A.ind],Ct=A.Ct,Ca=A.Ca,Va=20;const veq=veqOf(sc,Ca,Va,Ct);

   ${doneAll?'':`<p class="small muted" style="margin-top:4px">${A.trials.length===0?'1회차는 종말점 위치를 알아보는 예비 적정이에요. 대략적인 부피를 알면 2·3회차에서는 그 근처까지 빠르게 넣고, 가까워지면 한 방울씩!':'앞 회차의 부피를 참고해, 종말점 1~2 mL 전부터는 한 방울씩 넣으세요.'}</p>`}

    ${[0,1,2].map(i=>{const t=A.trials[i];return `<tr><td>${i+1}${i===0?' (예비)':''}</td><td class="mono">${t?fx(t.rf,1):'—'}</td></tr>`}).join('')}

   ${nextBtn('다음: 결과 계산',doneAll,'3회 적정을 마치세요')}`;

     <div class="ansrow" style="margin-top:0"><input id="rd" inputmode="decimal" placeholder="예: 16.4"><span class="pill">mL</span><button class="btn pri" id="rdc">기록</button></div><div id="rdf"></div></div></div>`;

      else $('#rdf',tb).innerHTML=`<div class="feedback bad pop"><p>다시 읽어 보세요. 큰 눈금(1 mL) → 작은 눈금(0.1 mL) 순으로 세어 보세요. (기회 1번 더)</p></div>`};
  };

    const st={decay:.1,flash:0,flashCol:'transparent',drops:[],swirl:0,open:false,sw:0};
    tb.innerHTML=`<div class="tbench"><div class="scene" id="scn"></div>
     <div class="ctrl">

      <div class="row"><button class="btn holdbtn" id="open">꼭지 열기 (누르고 있기)</button><button class="btn" id="d1">한 방울 (0.05 mL)</button></div>
