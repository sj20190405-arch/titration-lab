      <label class="small row" style="gap:6px"><input type="checkbox" id="auto" checked> 넣을 때마다 자동으로 흔들기</label>
      <button class="btn pri" id="stop">종말점! 꼭지 잠그고 눈금 읽기</button>
      <div class="note small">${ind.k==='pp'?'NaOH를 떨어뜨리면 떨어진 자리가 <b>순간 분홍색</b>으로 변했다가 흔들면 사라져요. 종말점에 가까울수록 분홍색이 오래 남아요. 종말점 1 mL쯤 전부터 용액 전체가 <b>아주 조금씩 분홍빛</b>을 띠기 시작해요. 이때부터 한 방울씩! <b>견본과 같은 옅은 분홍색이 흔들어도 유지되면</b> 종말점이니 바로 꼭지를 잠그세요.':`떨어진 자리의 색이 순간 변했다가 흔들면 돌아와요. 흔들어도 용액 전체가 <b>${ind.endName}</b>으로 유지되는 순간이 종말점!`}</div>
     </div></div>`;
    const auto=$('#auto',tb);
    const pH=()=>pHat(sc,Ca,Va,Ct,T.V);
    const drawS=()=>{const bulk=indRGBAf(ind,dispF(),.8);$('#fzm',tb).innerHTML=flaskZoomSVG(bulk,st.flash,st.flashCol,st.swirl);$('#scn',tb).innerHTML=sceneSVG({R:T.R0+T.V,open:st.open,flaskVol:20+T.V+(A.stage===1?0:0),bulk,flash:st.flash,flashCol:st.flashCol,drops:st.drops,swirl:st.swirl,titrantCol:tcol});
      $('#live',tb).innerHTML=lensSVG(T.R0+T.V,{size:120})};
    const addV=dv=>{if(T.R0+T.V+dv>50){toast('뷰렛이 비었어요! 종말점을 한참 지나쳤을 거예요.');return}
      T.V+=dv;const far=Math.min(1,Math.abs(veq-T.V)/veq*8);
      const tipCol=indRGBA(ind,sc.analyte==='acid'?12.5:1.5,.85);
      st.flashCol=tipCol;st.flash=Math.min(1,st.flash+.8);st.decay=.015+.1*far;st.drops.push(345);
      if(auto.checked)st.sw=6};
    const loop=setInterval(()=>{
      if(st.open)addV(.1);
      st.drops=st.drops.map(y=>y+14).filter(y=>y<420);
      if(st.sw>0){st.sw--;st.swirl=Math.sin(st.sw*1.4)*6;st.flash=Math.max(0,st.flash-st.decay*3.2)}else{st.swirl=0;st.flash=Math.max(0,st.flash-st.decay*.35)}
      drawS();
      
    },100);
    onLeave(()=>clearInterval(loop));drawS();
    holdButton($('#open',tb),()=>{st.open=true},100);
    ['pointerup','pointerleave','pointercancel','keyup'].forEach(ev=>$('#open',tb).addEventListener(ev,()=>{st.open=false}));
    $('#d1',tb).onclick=()=>addV(.05);$('#d2',tb).onclick=()=>addV(.025);
    $('#sw',tb).onclick=()=>{st.sw=8};
    $('#stop',tb).onclick=()=>{if(T.V<.2){toast('아직 거의 넣지 않았어요');return}st.open=false;clearInterval(loop);T.phase='readFinal';T.col=dispName();T.pHend=pH();readUI('f')};
  };
  const finishTrial=()=>{T.err=T.V-veq;A.trials.push(T);A.cur=null;
    const e=T.err;const msg=Math.abs(e)<=.06?'완벽한 종말점!':e<0?`중화점보다 ${fx(-e)} mL 먼저 멈췄어요`:`중화점을 ${fx(e)} mL 지나쳤어요`;
    tb.innerHTML=`<div class="feedback ${Math.abs(e)<=.12?'ok':'bad'} pop"><b>${A.trials.length}회차 기록: ${fx(T.rf,1)} mL</b><p>멈췄을 때 색: <b>${T.col}</b>. ${A.trials.length===1?'예비 적정 결과를 참고해 다음 회차에서는 더 정확하게!':''}</p>
     <p class="small muted" style="margin-top:4px">종말점 판단은 보고서 제출 후 채점에서 공개돼요.</p>
     <div class="row" style="margin-top:10px"><button class="btn pri" id="nt">${A.trials.length<3?`새 삼각 플라스크로 ${A.trials.length+1}회차 →`:'측정 기록 정리 →'}</button></div></div>`;
    void msg;
    $('#nt',tb).onclick=()=>aTit(el);
  };
  if(T.phase==='titrate')titUI();else readUI('f');
}

/* 공통-6: 결과 계산 */
function aCalc(el){
  const sc=A.sc,st1=A.stage===1;const S=A.calc||(A.calc={inc:[true,true,true],in:{},chk:{},tries:0,ok:false});
  const vols=A.trials.map(t=>+t.rf.toFixed(1));
  const incV=vols.filter((v,i)=>S.inc[i]);const vbar=incV.length?incV.reduce((a,b)=>a+b,0)/incV.length:NaN;
  const Ct=A.Ct;
  const rows=st1?[
    ['m1','희석한 식초의 몰 농도 = M(NaOH) × V̄ ÷ 20.00 mL','M',u=>Ct*u.vbar/20,.005,true],
    ['m0','원래 식초의 몰 농도 = 희석 농도 × 10','M',u=>u.m1*10,.005,true],
    ['pct','아세트산 함량 = 몰 농도 × 60.05 g/mol ÷ 10 (g/100 mL, %)','%',u=>u.m0*60.05/10,.01,true]]
   :[['mol','넣은 적정액의 몰 수 = 0.1000 M × V̄ ÷ 1000','mol',u=>.1*u.vbar/1000,.006,true],
    ['m0',sc.analyte==='acid'?`시료의 몰 농도 = (${sc.nb} × 몰 수) ÷ (${sc.na} × 0.02000 L)`:'시료의 몰 농도 = 몰 수 ÷ 0.02000 L','M',u=>u.mol*sc.nb/sc.na/.02,.005,true]];
  el.innerHTML=`<div class="card"><h3>측정값 정리</h3><div class="tw" style="margin-top:8px"><table class="table"><tr><th>평균에 포함</th><th>회차</th><th>사용한 ${sc.tShort} 부피 (mL)</th></tr>
   ${A.trials.map((t,i)=>`<tr><td><input type="checkbox" data-inc="${i}" ${S.inc[i]?'checked':''} ${S.ok?'disabled':''}></td><td>${i+1}${i===0?' (예비)':''}</td><td class="mono">${fx(vols[i],1)}</td></tr>`).join('')}
   <tr><td></td><td><b>평균 V̄</b></td><td class="mono"><b>${fx(vbar,2)}</b></td></tr></table></div>
   <p class="small muted" style="margin-top:6px">값이 크게 벗어난 회차(특히 예비 적정)는 평균에서 뺄 수 있어요. 최소 2회는 포함해야 합니다.</p></div>
   <div class="card" style="margin-top:14px"><h3>계산</h3>
    <div class="panel small" style="margin-top:8px">${st1?`주어진 값: M(NaOH) = <b class="mono">${Ct.toFixed(4)} M</b> (NaOH ${A.mNaOH.toFixed(2)} g / 1 L) · 희석한 식초 20.00 mL · 식초 10배 희석 · CH₃COOH 60.05 g/mol<br>관계식: M(CH₃COOH) × V(CH₃COOH) = M(NaOH) × V(NaOH) (1가 산 + 1가 염기)`:`주어진 값: ${sc.titrant} · 시료 20.00 mL<br>관계식: n·M·V = n′·M′·V′ → ${sc.analyte==='acid'?`${sc.na} × M × 20.00 = ${sc.nb} × 0.1000 × V̄`:`M × 20.00 = 0.1000 × V̄`}`}</div>
    ${rows.map(r=>`<div class="calcrow"><span>${r[1]}</span><input data-in="${r[0]}" inputmode="decimal" value="${esc(S.in[r[0]]??'')}" ${S.ok?'disabled':''} placeholder="${r[0]==='mol'?'예: 0.001635':'값'}"><span class="small">${r[2]} ${S.chk[r[0]]==null?'':S.chk[r[0]]?'<span class="flag" style="color:var(--ok)">✓</span>':'<span class="flag" style="color:var(--bad)">✗</span>'}</span></div>`).join('')}
    <p class="small muted" style="margin-top:8px">평균 부피 V̄ = <b>${fx(vbar,2)} mL</b>를 사용하세요. 몰 농도는 소수 넷째 자리 정도로 적으세요. 앞 칸에 적은 내 값으로 다음 칸을 계산하면 됩니다.</p>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="cc" ${S.ok?'disabled':''}>계산 확인</button></div><div id="cf">${S.ok?`<div class="feedback ok"><b>계산 완료</b><p>${st1?`원래 식초: ${S.in.m0} M · 아세트산 함량 ${S.in.pct} %`:`${sc.aShort} 농도: ${S.in.m0} M`}</p></div>`:''}</div></div>
   ${nextBtn('다음: 결과 보고서',S.ok,'계산을 모두 맞히세요')}`;
  $$('[data-inc]',el).forEach(c=>c.onchange=()=>{S.inc[+c.dataset.inc]=c.checked;if(S.inc.filter(Boolean).length<2){S.inc[+c.dataset.inc]=true;toast('최소 2회는 포함해야 해요')}S.chk={};aCalc(el)});
  $$('[data-in]',el).forEach(i=>i.oninput=()=>{S.in[i.dataset.in]=i.value});
  $('#cc',el).onclick=()=>{S.tries++;const u={vbar:+fx(vbar,2)};S.in.vbar=fx(vbar,2);let all=true;
    for(const r of rows){const v=num(S.in[r[0]]);const exp=r[3](u);let ok;
      if(isNaN(v)||isNaN(exp)){ok=false}else ok=r[5]?Math.abs(v-exp)<=Math.abs(exp)*r[4]+1e-9:Math.abs(v-exp)<=r[4];
      S.chk[r[0]]=ok;u[r[0]]=isNaN(v)?exp:v;if(!ok)all=false}
    if(all){S.ok=true;A.pts.calc=S.tries===1?1:S.tries===2?.7:S.tries===3?.5:.3;A.vbar=u.vbar;A.result=u;A.incVols=incV}
    aCalc(el);if(!all)toast('✗ 표시된 칸을 다시 계산해 보세요')};
  bindNextA(el);
}

/* 공통-7: 결과 보고서 */
const ERRS=['종말점을 지나쳐 색이 진해졌다','종말점 전에 멈췄다','뷰렛 눈금을 읽을 때 시차가 있었다','뷰렛 끝에 기포가 있었다','뷰렛을 공세척하지 않았다','피펫의 표선을 정확히 맞추지 못했다','NaOH가 공기 중 수분·CO₂를 흡수했다','지시약 선택이 알맞지 않았다'];
function reportHTML(ed){
  const sc=A.sc,st1=A.stage===1,ind=IND[A.ind],s=getStudent(),R=A.rep;
  const vols=A.trials.map(t=>+t.rf.toFixed(1));
  const cb=(on,attr)=>ed?`<input type="checkbox" ${attr} ${on?'checked':''}>`:(on?'☑':'☐');
  return `<div class="report" id="repbox">
   <h3>실험 결과 보고서</h3>
   <div class="kv" style="margin-top:12px"><span class="muted">학번 · 이름</span><span>${esc(sLabel(s))}</span><span class="muted">실험 날짜</span><span>${R.date}</span>
    <span class="muted">실험 제목</span>${ed?`<input id="rt" value="${esc(R.title)}">`:`<b>${esc(R.title)}</b>`}</div>
   <div class="sec"><b>1. 실습 목적</b>${ed?`<input id="rg" value="${esc(R.goal)}" style="width:100%">`:`<p>${esc(R.goal)}</p>`}</div>
   <div class="sec"><b>2. 시약과 기구</b><p class="small">${st1?`수산화 소듐(${A.mNaOH.toFixed(2)} g → 1 L, ${A.Ct.toFixed(4)} M), 식초, 증류수, ${ind.n} 용액 / 부피 플라스크, 삼각 플라스크, 비커, 홀 피펫, 전자 저울, 약숟가락, 시약포지, 뷰렛`:`${sc.acid}, ${sc.titrant}, ${ind.n} 용액 / 홀 피펫(20 mL), 삼각 플라스크, 뷰렛, 스탠드, 비커`}</p></div>
   <div class="sec"><b>3. 반응식</b><p class="mono">${sc.eq}</p><p class="small muted">생성된 염: ${sc.salt} · 중화점 pH ${sc.eqpH}</p></div>
   <div class="sec"><b>4. 지시약과 종말점</b><p>사용한 지시약: <b>${ind.n}</b> (변색 범위 pH ${ind.range[0]}~${ind.range[1]}) · 종말점 색 변화: <b>${endChange(sc,ind)}</b></p></div>
   <div class="sec"><b>5. 실험 결과</b><div class="tw"><table class="table"><tr><th>회차</th><th>사용한 ${sc.tShort} 부피 (mL)</th><th>평균 포함</th></tr>
    ${A.trials.map((t,i)=>`<tr><td>${i+1}</td><td class="mono">${fx(vols[i],1)}</td><td>${A.calc.inc[i]?'○':'×'}</td></tr>`).join('')}
    <tr><td><b>평균 V̄</b></td><td class="mono"><b>${esc(A.calc.in.vbar)}</b></td><td></td></tr></table><p class="small muted">매 회 뷰렛 눈금을 0.0 mL에 맞추고 적정을 시작함.</p></div></div>
   <div class="sec"><b>6. 계산 과정</b>${st1?`<p class="small">① M(CH₃COOH) × 20.00 mL = ${A.Ct.toFixed(4)} M × ${esc(A.calc.in.vbar)} mL → 희석한 식초 <b>${esc(A.calc.in.m1)} M</b></p><p class="small">② 10배 희석이므로 원래 식초 = ${esc(A.calc.in.m1)} × 10 = <b>${esc(A.calc.in.m0)} M</b></p><p class="small">③ 아세트산 함량 = ${esc(A.calc.in.m0)} mol/L × 0.1 L × 60.05 g/mol = <b>${esc(A.calc.in.pct)} g/100 mL (%)</b></p>`
     :`<p class="small">① 넣은 적정액의 몰 수 = 0.1000 M × ${esc(A.calc.in.vbar)} mL ÷ 1000 = <b>${esc(A.calc.in.mol)} mol</b></p><p class="small">② ${sc.analyte==='acid'?`${sc.na} × M × 0.02000 L = ${sc.nb} × ${esc(A.calc.in.mol)} mol`:`M × 0.02000 L = ${esc(A.calc.in.mol)} mol`} → <b>${esc(A.calc.in.m0)} M</b></p>`}</div>
   <div class="sec"><b>7. 결론</b><p>${st1?`식초 속 아세트산의 몰 농도는 <b>${esc(A.calc.in.m0)} M</b>, 함량은 약 <b>${esc(A.calc.in.pct)} %</b>이다.`:`${esc(sc.acid.split(' ')[0])}의 몰 농도는 <b>${esc(A.calc.in.m0)} M</b>이다.`}</p></div>
   <div class="sec"><b>8. 오차의 원인</b><div class="stack" style="gap:4px">${ERRS.map((e,i)=>ed||R.errs[i]?`<label class="small row" style="gap:6px">${cb(R.errs[i],`data-err="${i}"`)} ${e}</label>`:'').join('')}</div></div>
   <div class="sec"><b>9. 고찰</b>${ed?`<p class="small muted">종말점을 어떻게 판단했는지, 지시약을 왜 골랐는지, 세 번의 결과가 차이 난 이유, 다시 한다면 무엇을 바꿀지 적어 보세요. (40자 이상)</p><textarea id="rd" placeholder="예) 페놀프탈레인은 변색 범위가 pH 8.2~10.0이라 염기성 염이 생기는 중화점과 잘 맞았다. 1회차에서는 …">${esc(R.disc)}</textarea><span class="small muted" id="rlen"></span>`:`<p style="white-space:pre-wrap">${esc(R.disc)}</p>`}</div>
   <div class="sec"><b>10. 실습 평가 (자기 점검)</b><div class="stack" style="gap:4px">${[['waste','실험 후 시약을 산·염기 구별하여 폐수통에 처리했다'],['tidy','실험 후 실험 도구를 세척하여 정리했다'],['ppe','보안경·실험복·실험용 장갑을 끝까지 착용했다']].map(([k,t])=>`<label class="small row" style="gap:6px">${cb(R.clean[k],`data-cl="${k}"`)} ${t}</label>`).join('')}</div></div>
   ${!ed&&A.graded?`<div class="sec"><b>11. 채점 결과</b><p>심화 실습 ${A.graded.lab40}/40 · 결과 보고서 ${A.graded.rep20}/20 · 상대 오차 ${A.graded.relErr.toFixed(1)} %</p></div>`:''}
  </div>`;
}
function aRep(el){
  const sc=A.sc,st1=A.stage===1;
  if(!A.rep)A.rep={title:st1?'산 염기 중화 적정 — 식초 속 아세트산의 농도':`산 염기 중화 적정 — ${sc.title}`,goal:st1?'식초 속 아세트산의 농도를 중화 적정을 이용하여 구할 수 있다.':`농도를 아는 표준 용액으로 ${sc.acid.split(' ')[0]}의 농도를 중화 적정으로 구할 수 있다.`,disc:'',errs:{},clean:{},date:new Date().toLocaleDateString('ko-KR')};
  const R=A.rep;
  el.innerHTML=reportHTML(true)+`<div class="row noprint" style="margin-top:16px;justify-content:flex-end"><button class="btn pri" id="sub">보고서 제출하고 채점 받기 →</button></div>`;
  const upd=()=>{R.title=$('#rt',el).value;R.goal=$('#rg',el).value;R.disc=$('#rd',el).value;$('#rlen',el).textContent=`${R.disc.trim().length}자`};
  ['#rt','#rg','#rd'].forEach(s=>$(s,el).addEventListener('input',upd));upd();
  $$('[data-err]',el).forEach(c=>c.onchange=()=>{R.errs[c.dataset.err]=c.checked});
  $$('[data-cl]',el).forEach(c=>c.onchange=()=>{R.clean[c.dataset.cl]=c.checked});
  $('#sub',el).onclick=()=>{upd();if(R.disc.trim().length<40){toast('고찰을 40자 이상 적어 주세요');$('#rd',el).focus();return}
    if(!Object.values(R.errs).some(Boolean)){toast('오차의 원인을 하나 이상 고르세요');return}
    gradeAdv();goStep(8)};
}

/* 채점 */
function gradeAdv(){
  const sc=A.sc,st1=A.stage===1,ind=IND[A.ind],R=A.rep;
  const veq=veqOf(sc,A.Ca,20,A.Ct);
  const readF=A.trials.reduce((a,t)=>a+t.rfOk,0)/A.trials.length;
  const epS=e=>{e=Math.abs(e);return e<=.06?1:e<=.12?.8:e<=.25?.5:e<=.6?.25:0};
  const used=A.trials.filter((t,i)=>A.calc.inc[i]);
  const endF=used.reduce((a,t)=>a+epS(t.err),0)/used.length;
  const v=A.incVols;const range=Math.max(...v)-Math.min(...v);const repF=range<=.10?1:range<=.20?.6:range<=.4?.3:0;
  const indF=(A.firstIndOk?.8:0)+(A.firstChOk?.2:0);
  const trueC=st1?A.Cvin:A.Ca;const myC=num(A.calc.in.m0);const relErr=(myC-trueC)/trueC*100;
  const items=st1?[
    ['실험 준비 (복장·준비물·시료·뷰렛)',10,((A.pts.prep0||0)+(A.pts.prep2||0)+(A.pts.prep4||0))/3],
    ['0.1 M NaOH 조제 (칭량)',5,A.pts.naoh||0],
    ['지시약 선택 · 종말점 색 예측',15,indF],
    ['뷰렛 눈금 읽기',10,readF],
    ['종말점 판단 정확도',25,endF],
    ['재현성 (평균에 포함한 회차의 차이)',10,repF],
    ['결과 계산',15,A.pts.calc||0]]
   :[['실험 준비 (반응식·몰 비·시료·뷰렛)',15,((A.pts.prep0||0)+(A.pts.prep2||0)+(A.pts.prep4||0))/3],
    ['지시약 선택 · 종말점 색 예측',15,indF],
    ['뷰렛 눈금 읽기',10,readF],

  const lab40=Math.round(items.reduce((a,i)=>a+i[1]*i[2],0)/90*40*10)/10;

  record('심화 실습',title,score,detail,{
    stage:A.stage,acid:sc.acid,titrant:st1?`NaOH ${A.Ct.toFixed(4)} M`:sc.titrant,ind:ind.n+(A.firstIndOk?'':' (첫 선택 '+IND[A.firstInd].n+')'),change:endChange(sc,ind),

function reportScore(R){
  const d=R.disc.trim(),L=d.length;
  const len=L>=150?8:L>=80?6:L>=40?4:0;
  const KW=['지시약','종말점','중화점','페놀프탈레인','메틸 오렌지','BTB','분홍','변색','오차','농도','적정','공세척','눈금'];const hit=KW.filter(k=>d.includes(k)).length;
  const kw=hit>=4?4:hit>=2?3:hit>=1?2:0;
  const ne=Object.values(R.errs).filter(Boolean).length;const er=ne===0?0:ne<=4?4:2;
  const nc=Object.values(R.clean).filter(Boolean).length;const cl=nc>=3?4:nc;
  const parts=[['고찰 분량 (40 · 80 · 150자)',8,len],['고찰 핵심어 (지시약 · 종말점 · 오차 등)',4,kw],['오차 원인 분석 (1~4개)',4,er],['실습 평가 자기 점검',4,cl]];
  return {score:len+kw+er+cl,parts};
}

/* ===== 수행평가 점수 (기초 이론 20 · 기초 실습 20 · 심화 실습 40 · 결과 보고서 20) ===== */
const LVN=['초보','중급','고급'];
const r1=x=>Math.round(x*10+1e-9)/10;
const skeyOf=r=>`${r.grade}|${r.cls}|${r.no}|${r.name}`;
function scoreOf(list,adjR){
  const th=LVN.map(lv=>{let b=0;list.filter(x=>x.kind==='기초 이론'&&String(x.item).startsWith(lv)).forEach(x=>{const m=String(x.detail).match(/정답 (\d+)\/(\d+)/);if(m)b=Math.max(b,+m[1]/+m[2])});return b});
  const t=r1(th.reduce((a,b)=>a+b,0)/3*20);
  const names=PTABS.map(p=>p[1]);const done=new Set(list.filter(x=>x.kind==='기초 실습'&&names.includes(x.item)).map(x=>x.item));
  const p=r1(done.size/PTABS.length*20);
  let best=null;const subs=list.filter(x=>x.kind==='심화 실습');
  subs.forEach(x=>{const m=String(x.detail).match(/\[심화 ([\d.]+)\/40 · 보고서 ([\d.]+)\/20\]/);if(m){const o={a:+m[1],r:+m[2],x};if(!best||o.a+o.r>best.a+best.r)best=o}});
  const a=best?best.a:0;let r=best?best.r:0;const adjusted=adjR!=null&&adjR!==''&&!isNaN(+adjR);if(adjusted)r=+adjR;
  return {t,p,a,r,total:r1(t+p+a+r),th,done,best,subs,adjusted,auto:best?best.r:0};
}

async function tcall(params){
  if(SHEET_URL){const q=new URLSearchParams({...params,t:Date.now()});const res=await fetch(`${SHEET_URL}?${q}`);return await res.json()}
  const pw=store.get('tpw','0405');if(params.key!==pw)return {ok:false,error:'비밀번호가 맞지 않아요'};
  const all=store.get('all',[]),adj=store.get('adj',{});
  if(params.action==='data')return {ok:true,rows:all,adj,sheetUrl:''};
  if(params.action==='reset'){if(params.target==='all'){store.set('all',[]);store.set('adj',{})}else{store.set('all',all.filter(r=>skeyOf(r)!==params.target));delete adj[params.target];store.set('adj',adj)}return {ok:true}}
  if(params.action==='setpw'){store.set('tpw',params.newpw);return {ok:true}}
  if(params.action==='adjust'){if(params.score==='')delete adj[params.skey];else adj[params.skey]=+params.score;store.set('adj',adj);return {ok:true}}
  return {ok:false,error:'알 수 없는 요청'};
}

function buildRoster(){
  const rows=(TD.data.rows||[]).filter(r=>r.kind);const adj=TD.data.adj||{};
  const by={};rows.forEach(r=>{const k=skeyOf(r);(by[k]=by[k]||{k,grade:r.grade,cls:r.cls,no:r.no,name:r.name,list:[]}).list.push(r)});
  return Object.values(by).map(s=>{const S=scoreOf(s.list,adj[s.k]);const last=s.list.map(x=>new Date(x.time||x.clientTime)).sort((a,b)=>b-a)[0];return {...s,S,last}});

  const grades=[...new Set(all.map(s=>String(s.grade)))].sort(),classes=[...new Set(all.map(s=>String(s.cls)))].sort((a,b)=>a-b);
  let list=all.filter(s=>(!f.g||String(s.grade)===f.g)&&(!f.c||String(s.cls)===f.c)&&(!f.q||String(s.name).includes(f.q)));
  const srt={no:(a,b)=>a.grade-b.grade||a.cls-b.cls||a.no-b.no,tot:(a,b)=>b.S.total-a.S.total,upd:(a,b)=>(b.last||0)-(a.last||0)}[TD.sort];list.sort(srt);
  const avg=k=>list.length?r1(list.reduce((a,s)=>a+s.S[k],0)/list.length):0;
  const ST=[['t','① 기초 이론',20,'#2F9E6A'],['p','② 기초 실습',20,'#2A7584'],['a','③ 심화 실습',40,'#9C1F74'],['r','④ 결과 보고서',20,'#C8641E']];
  const dt=d=>d?new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  app.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><p class="eyebrow">교사용 · acid–base titration</p><h2 style="margin-top:6px">수행평가 현황판</h2></div>
   <div class="row" style="gap:6px"><button class="btn sm" id="trf">새로고침</button><button class="btn sm" id="tcsv">CSV 내려받기</button><button class="btn sm" id="tpw">비밀번호 변경</button>${TD.data.sheetUrl?`<a class="btn sm" href="${esc(TD.data.sheetUrl)}" target="_blank" rel="noopener">구글 시트 열기</a>`:''}<button class="btn sm" id="treset" style="border-color:var(--bad);color:var(--bad)">전체 초기화</button></div></div>
   ${SHEET_URL?'':'<div class="note warn small" style="margin-top:10px">미리보기 모드: 이 브라우저에서 입장한 학생 기록만 보입니다. 구글 시트(SHEET_URL)를 연결하면 모든 학생의 결과가 모입니다.</div>'}
   <div class="panel row" style="margin-top:14px">
    <label class="row small" style="gap:6px">학년 <select id="fg"><option value="">전체</option>${grades.map(g=>`<option ${f.g===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px">반 <select id="fc"><option value="">전체</option>${classes.map(c=>`<option ${f.c===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px;flex:1;min-width:180px">이름 <input id="fq" value="${esc(f.q)}" placeholder="이름으로 찾기" style="flex:1"></label>
   </div>
   <div class="kpis" style="margin-top:14px">
    <div class="kpi"><span class="l">학생 수</span><span class="v mono">${list.length}<small>명</small></span></div>
    <div class="kpi"><span class="l">평균 총점</span><span class="v mono">${avg('total')}<small> / 100</small></span></div>
    <div class="kpi"><span class="l">보고서 제출</span><span class="v mono">${list.filter(s=>s.S.best).length}<small>명</small></span></div>
    <div class="kpi"><span class="l">기초 실습 7개 완료</span><span class="v mono">${list.filter(s=>s.S.done.size>=7).length}<small>명</small></span></div>
   </div>
   <div class="kpis" style="margin-top:10px">${ST.map(([k,n,m,c])=>`<div class="kpi" style="border-top:4px solid ${c}"><span class="l">${n} 평균</span><span class="v mono">${avg(k)}<small> / ${m}</small></span><div class="meter"><i style="width:${avg(k)/m*100}%;background:${c}"></i></div></div>`).join('')}</div>
   <div class="card" style="margin-top:14px;padding:0;overflow:hidden"><div class="tw"><table class="table roster"><tr>
     <th><button class="linkbtn" data-sort="no">학년-반-번호 ↕</button></th><th>이름</th><th>기초 이론<br><span class="mono small">/20</span></th><th>기초 실습<br><span class="mono small">/20</span></th><th>심화 실습<br><span class="mono small">/40</span></th><th>결과 보고서<br><span class="mono small">/20</span></th><th><button class="linkbtn" data-sort="tot">총점 ↕</button><br><span class="mono small">/100</span></th><th><button class="linkbtn" data-sort="upd">최근 활동 ↕</button></th><th>관리</th></tr>
    ${list.map((s,i)=>`<tr><td class="mono">${s.grade}-${s.cls}-${s.no}</td><td style="font-weight:600">${esc(s.name)}</td><td class="mono">${s.S.t}</td><td class="mono">${s.S.p}</td><td class="mono">${s.S.best?s.S.a:'<span class="muted">—</span>'}</td><td class="mono">${s.S.best||s.S.adjusted?s.S.r:'<span class="muted">—</span>'}${s.S.adjusted?' <span class="pill warn" title="교사 조정">조정</span>':''}</td><td class="mono" style="font-weight:700">${s.S.total}</td><td class="mono small">${dt(s.last)}</td>
     <td style="white-space:nowrap"><button class="btn sm" data-det="${i}">상세</button> <button class="btn sm" data-rs="${i}" style="color:var(--bad)">초기화</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">아직 기록이 없어요</td></tr>'}</table></div></div>
   <p class="small muted" style="margin-top:8px">점수 기준 — 기초 이론: 초보·중급·고급 최고 정답률의 평균 × 20 · 기초 실습: 완료 미션 ÷ 7 × 20 · 심화 실습(40)·결과 보고서(20): 가장 높은 제출물 기준 (보고서는 상세 화면에서 교사가 조정 가능)</p>`;
  $('#fg').onchange=e=>{f.g=e.target.value;drawTeacher()};$('#fc').onchange=e=>{f.c=e.target.value;drawTeacher()};
  $('#fq').oninput=e=>{f.q=e.target.value.trim();clearTimeout(TD.qt);TD.qt=setTimeout(()=>{drawTeacher();const q=$('#fq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)};
  $$('[data-sort]').forEach(b=>b.onclick=()=>{TD.sort=b.dataset.sort;drawTeacher()});
  $('#trf').onclick=()=>{toast('새로 불러오는 중…');reloadTeacher()};
  $('#tcsv').onclick=()=>downloadCSV(list);
  $('#tpw').onclick=changePw;
  $('#treset').onclick=()=>confirmReset('all','전체 학생');
  $$('[data-det]').forEach(b=>b.onclick=()=>studentDetail(list[+b.dataset.det]));
  $$('[data-rs]').forEach(b=>b.onclick=()=>{const s=list[+b.dataset.rs];confirmReset(s.k,`${s.grade}학년 ${s.cls}반 ${s.no}번 ${s.name}`)});
}
function confirmReset(target,label){
  const all=target==='all';
  modal(`<h3 style="color:var(--bad)">${all?'전체 초기화':'학생 초기화'}</h3>
   <p style="margin-top:8px"><b>${esc(label)}</b>의 모든 기록(기초 이론 · 기초 실습 · 심화 실습 · 보고서 · 교사 조정 점수)을 ${SHEET_URL?'구글 시트에서 ':''}삭제합니다. 되돌릴 수 없어요.</p>
   ${all?'<label class="stack" style="gap:4px;margin-top:10px"><span class="small">확인을 위해 <b>초기화</b> 라고 입력하세요</span><input id="rsw" autocomplete="off"></label>':''}
   <p class="small muted" style="margin-top:8px">※ 학생 기기에 남은 개인 진행 표시(완료 체크 등)는 학생이 다시 활동하면 새로 기록됩니다.</p>
   <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>취소</button><button class="btn" id="rsok" style="background:var(--bad);border-color:var(--bad);color:#fff">초기화</button></div>`,(m,close)=>{
    $('#rsok',m).onclick=async()=>{if(all&&$('#rsw',m).value.trim()!=='초기화'){toast('"초기화"를 정확히 입력하세요');return}
      try{const j=await tcall({action:'reset',key:TEACH.pw,target});if(!j.ok){toast(j.error||'실패');return}close();toast(`${label} 기록을 초기화했어요`);reloadTeacher()}catch(e){toast('요청에 실패했어요')}}});
}
function changePw(){
  modal(`<h3>교사 비밀번호 변경</h3>
   <form id="pwf" class="stack" style="margin-top:12px;gap:10px"><label class="stack" style="gap:4px"><span class="small">새 비밀번호 (4~20자)</span><input id="np1" type="password" autocomplete="new-password"></label>
   <label class="stack" style="gap:4px"><span class="small">새 비밀번호 확인</span><input id="np2" type="password" autocomplete="new-password"></label>
   <p class="small muted">${SHEET_URL?'구글 시트(Apps Script)에 저장되어 모든 기기에서 새 비밀번호로 들어옵니다.':'미리보기 모드에서는 이 브라우저에만 저장됩니다.'}</p>
   <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>취소</button><button class="btn pri" type="submit">변경</button></div></form>`,(m,close)=>{
    $('#pwf',m).addEventListener('submit',async e=>{e.preventDefault();const a=$('#np1',m).value,b=$('#np2',m).value;
      if(a.length<4||a.length>20){toast('4~20자로 입력하세요');return}if(a!==b){toast('두 비밀번호가 달라요');return}
      try{const j=await tcall({action:'setpw',key:TEACH.pw,newpw:a});if(!j.ok){toast(j.error||'실패');return}TEACH.pw=a;close();toast('비밀번호를 바꿨어요')}catch(err){toast('요청에 실패했어요')}})});
}
function downloadCSV(list){
  const head=['학년','반','번호','이름','기초 이론(20)','기초 실습(20)','심화 실습(40)','결과 보고서(20)','총점(100)','보고서 조정'];
  const rows=list.map(s=>[s.grade,s.cls,s.no,s.name,s.S.t,s.S.p,s.S.a,s.S.r,s.S.total,s.S.adjusted?'교사 조정':'']);
  const csv='﻿'+[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`중화적정_수행평가_${new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','')}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function studentDetail(s){
  const S=s.S;const dt=d=>new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const miss=PTABS.map(p=>p[1]).filter(n=>!S.done.has(n));
  const subs=S.subs.slice().sort((a,b)=>new Date(b.time||b.clientTime)-new Date(a.time||a.clientTime));
  const log=s.list.filter(x=>x.kind!=='심화 실습'&&x.kind!=='입장').sort((a,b)=>new Date(b.time||b.clientTime)-new Date(a.time||a.clientTime)).slice(0,40);
  modal(`<div class="row" style="justify-content:space-between"><h3>${esc(s.grade)}학년 ${esc(s.cls)}반 ${esc(s.no)}번 ${esc(s.name)}</h3><span class="pill acc">총점 ${S.total} / 100</span></div>
   <div class="kpis" style="margin-top:12px">
    <div class="kpi"><span class="l">① 기초 이론</span><span class="v mono">${S.t}<small>/20</small></span><span class="small muted">초보 ${Math.round(S.th[0]*100)}% · 중급 ${Math.round(S.th[1]*100)}% · 고급 ${Math.round(S.th[2]*100)}%</span></div>
    <div class="kpi"><span class="l">② 기초 실습</span><span class="v mono">${S.p}<small>/20</small></span><span class="small muted">${S.done.size}/7 완료${miss.length?' · 남은: '+miss.join(', '):''}</span></div>
    <div class="kpi"><span class="l">③ 심화 실습</span><span class="v mono">${S.a}<small>/40</small></span><span class="small muted">제출 ${S.subs.length}회 · 최고 기준</span></div>
    <div class="kpi"><span class="l">④ 결과 보고서</span><span class="v mono">${S.r}<small>/20</small></span><span class="small muted">자동 ${S.auto}${S.adjusted?' → 교사 조정':''}</span></div></div>
   <div class="panel row" style="margin-top:12px;gap:8px"><b class="small">결과 보고서 점수 조정</b><input id="adj" type="number" min="0" max="20" step="0.5" value="${S.adjusted?S.r:''}" placeholder="${S.auto}" style="width:90px"><button class="btn sm pri" id="adjs">저장</button>${S.adjusted?'<button class="btn sm" id="adjc">자동 점수로 되돌리기</button>':''}</div>
   <h3 style="margin-top:14px;font-size:17px">심화 실습 제출 (${S.subs.length})</h3>
   ${subs.length?subs.map(x=>{const d=String(x.detail);const gi=d.indexOf('고찰: ');return `<div class="panel" style="margin-top:8px"><div class="row" style="justify-content:space-between"><b>${esc(x.item)}</b><span class="mono small">${dt(x.time||x.clientTime)} · ${esc(x.score)}점</span></div><p class="small" style="margin-top:4px">${esc(gi>0?d.slice(0,gi):d)}</p>${gi>0?`<p class="small" style="margin-top:6px;white-space:pre-wrap;background:var(--surface);padding:8px 10px;border-radius:8px"><b>고찰</b> ${esc(d.slice(gi+4))}</p>`:''}</div>`}).join(''):'<p class="muted small" style="margin-top:6px">아직 제출한 보고서가 없어요.</p>'}
   <h3 style="margin-top:14px;font-size:17px">활동 기록</h3>
   <div class="tw" style="margin-top:6px"><table class="table"><tr><th>시간</th><th>구분</th><th>항목</th><th>점수</th><th>상세</th></tr>${log.map(x=>`<tr><td class="mono small">${dt(x.time||x.clientTime)}</td><td>${esc(x.kind)}</td><td>${esc(x.item)}</td><td class="mono">${esc(x.score)}</td><td class="small" style="text-align:left">${esc(String(x.detail).slice(0,80))}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">없음</td></tr>'}</table></div>
   <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>닫기</button></div>`,(m,close)=>{
    const save=async v=>{try{const j=await tcall({action:'adjust',key:TEACH.pw,skey:s.k,score:v});if(!j.ok){toast(j.error||'실패');return}close();toast(v===''?'자동 점수로 되돌렸어요':`보고서 점수를 ${v}점으로 저장했어요`);reloadTeacher()}catch(e){toast('요청에 실패했어요')}};
    $('#adjs',m).onclick=()=>{const v=$('#adj',m).value.trim();if(v===''){toast('점수를 입력하세요');return}const n=+v;if(isNaN(n)||n<0||n>20){toast('0~20 사이로 입력하세요');return}save(String(n))};
    const c=$('#adjc',m);if(c)c.onclick=()=>save('');
  },true);
}
function openGate(){
  const g=$('#gate');if(!g||g.dataset.busy)return;g.dataset.busy=1;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  g.classList.add('open');
  setTimeout(()=>g.classList.add('gone'),reduce?50:700);
  setTimeout(()=>{g.remove();document.body.style.overflow=''},reduce?400:1400);
}
(function(){const g=$('#gate');if(!g)return;document.body.style.overflow='hidden';$('#gopen').onclick=openGate;$('#gframe').onclick=openGate;setTimeout(()=>$('#gopen').focus(),50)})();
render();flushOutbox();
</script>
</body>
</html>
