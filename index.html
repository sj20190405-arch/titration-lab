<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="세경고등학교 인공지능반도체과 흡광광도법 온라인 실험실 — 기초 이론 게임, 가상 기초 실습, 화학분석기능사 실기 모의시험">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>바이오기초화학 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#15201E; --muted:#56655F; --line:#D3DCD9;
  --accent:#9C1F74; --accent-ink:#FFFFFF; --accent-soft:#F7E4F0; --glass:#2A7584; --glass-soft:#DDEFF2;
  --ok:#1D7F46; --ok-soft:#DDF2E5; --warn:#A96A00; --warn-soft:#FBEFD6; --bad:#B8322A; --bad-soft:#F9E0DE;
  --lcd:#0F2A26; --lcd-ink:#9CF2D6; --shadow:0 1px 2px rgba(20,32,30,.06),0 6px 20px rgba(20,32,30,.06);
  --liquid:#8E1C74; --water:#CFE8F0;
  --r:12px;
  --fd:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --fb:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#E06AB6; --accent-ink:#1A0714; --accent-soft:#3A1731; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#E06AB6; --accent-ink:#1A0714; --accent-soft:#3A1731; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,56px)} h2{font-size:clamp(26px,4vw,34px)} h3{font-size:21px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.panel{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--glass)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.glass{background:var(--glass);border-color:var(--glass);color:var(--surface)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{border-left:3px solid var(--glass);padding:8px 12px;background:var(--glass-soft);border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
main{padding-top:24px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding-block:24px 8px}
.school{font-family:var(--fd);font-size:clamp(28px,4.6vw,42px);line-height:1.15;color:var(--ink);display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline}
.school span{color:var(--accent)}
.hero .lead{font-size:17px;color:var(--muted);max-width:52ch;margin-top:12px}
.door{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.units{margin-top:28px}
.unit{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.unit .num{font-family:var(--fm);font-size:13px;color:var(--muted);min-width:34px;padding-top:3px}
.unit.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit.off{opacity:.62;cursor:default}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* hub */
.mode{display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .tag{font-family:var(--fm);font-size:12px;color:var(--accent)}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.mode svg{width:100%;height:120px}

/* quiz */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lv{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lv:hover{border-color:var(--c)}
.lv .badge{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);font-size:22px;color:#fff;background:var(--c)}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hearts{display:flex;gap:4px}
.heart{width:22px;height:20px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{margin-top:14px}
.qtype{display:inline-block;font-family:var(--fd);font-size:17px;padding:3px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:19px;font-weight:600;margin-top:10px}
.cho{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.cho span{font-family:var(--fd);font-size:40px;width:64px;height:72px;display:grid;place-items:center;background:var(--lcd);color:var(--lcd-ink);border-radius:10px}
.cho span.sp{background:transparent;width:18px}
.jam{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.syl{width:66px;height:78px;border-radius:10px;border:2px dashed var(--glass);display:grid;grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;padding:6px;font-family:var(--fd);font-size:24px;color:var(--glass);background:var(--glass-soft)}
.syl .c{grid-column:1;grid-row:1;display:grid;place-items:center}
.syl .v{grid-column:2;grid-row:1;display:grid;place-items:center;color:var(--muted);font-size:18px}
.syl .j{grid-column:1/3;grid-row:2;display:grid;place-items:center}
.syl.sp{border:0;background:none;width:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ox{display:flex;gap:14px;margin-top:18px}
.ox button{flex:1;font-family:var(--fd);font-size:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:10px}
.ox button:hover{border-color:var(--accent)}
.ansrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:180px;font-size:18px}
.blankq{font-size:19px;line-height:2}
.blankq .b{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:700;padding:0 6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mi.shake{animation:shake .35s}
.orderlist{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.oi{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.oi .n{font-family:var(--fm);color:var(--muted);width:22px}
.oi .t{flex:1}
.oi button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;width:34px;height:30px}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px}
.feedback.ok{background:var(--ok-soft);color:var(--ink);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.feedback b{font-family:var(--fd);font-size:20px;font-weight:400}
.combo{font-family:var(--fd);color:var(--accent);font-size:20px}
.timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:var(--warn)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
.pt{outline:none}.pt .tip{opacity:0;transition:opacity .12s;pointer-events:none}.pt:hover .tip,.pt:focus .tip{opacity:1}.pt:hover circle:nth-child(2),.pt:focus circle:nth-child(2){stroke:var(--ink);stroke-width:2}
.rank{font-family:var(--fd);font-size:88px;line-height:1;color:var(--accent)}

/* practice */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:18px}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .ck{color:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px}
.tool svg{width:70px;height:80px}
.tool.sel{border-color:var(--accent);background:var(--accent-soft)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.bench{grid-template-columns:1fr}}
.stage{background:linear-gradient(var(--surface2),var(--surface2)) padding-box;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:center;align-items:flex-end;gap:20px;padding:14px;min-height:280px;position:relative;flex-wrap:wrap}
.stage svg{max-width:100%}
.holdbtn{user-select:none;-webkit-user-select:none;touch-action:none}
.holdbtn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zoom{width:150px;height:150px;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--surface)}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.stp{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:14px}
.stp::before{counter-increment:s;content:counter(s);font-family:var(--fm);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none}
.stp.done{color:var(--muted)} .stp.done::before{background:var(--ok);color:#fff;content:"✓"}
.stp.cur{background:var(--accent-soft)} .stp.cur::before{background:var(--accent);color:#fff}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip.used{opacity:.35;pointer-events:none}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{min-width:110px;min-height:44px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;padding:6px 10px;font-weight:600;font-size:14px;text-align:center}
.slot.fill{border-style:solid;border-color:var(--glass);background:var(--glass-soft)}
.arrow{color:var(--muted);font-family:var(--fm)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--fm);font-size:11px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.table th{background:var(--surface2);font-weight:600}
.tw{overflow-x:auto}

/* instrument */
.inst{background:#D9DEDC;border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;border:1px solid #BFC6C3;color:#15201E}
:root[data-theme="dark"] .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}}
@media (max-width:760px){.inst{grid-template-columns:1fr}}
.screen{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:12px;min-height:250px;font-family:var(--fm);font-size:13px;position:relative;overflow:hidden}
.screen .big{font-size:30px;font-weight:600}
.screen button{background:rgba(156,242,214,.1);border:1px solid rgba(156,242,214,.4);color:var(--lcd-ink);border-radius:6px;padding:6px 10px;font-family:var(--fm);font-size:12.5px}
.screen button:hover{background:rgba(156,242,214,.22)}
.screen input,.screen select{background:#0a1f1c;color:var(--lcd-ink);border-color:rgba(156,242,214,.35);font-family:var(--fm);padding:4px 8px;font-size:13px}
.screen .off{position:absolute;inset:0;background:#050b0a;display:grid;place-items:center;color:#3c5a54}
.screen table{width:100%;border-collapse:collapse}
.screen td,.screen th{border-bottom:1px solid rgba(156,242,214,.18);padding:3px 4px;text-align:right}
.screen th{text-align:right;font-weight:600;opacity:.7}
.holder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos{background:#11191A;border-radius:8px;padding:6px;color:#cfe;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--fm);font-size:11px;min-height:86px;border:2px solid transparent}
.pos.sel{border-color:var(--accent)}
.pos .cv{width:22px;height:40px;border:1.5px solid #9ab;border-radius:2px;position:relative;background:#1d2b2d}
.pos .cv i{position:absolute;left:0;right:0;bottom:0;height:78%}
.power{width:44px;height:44px;border-radius:50%;border:2px solid #6a7571;background:#2B3432;color:#fff;font-weight:700}
.power.on{background:var(--ok);border-color:var(--ok)}

/* exam */
.examgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.examgrid{grid-template-columns:1fr}}
.stepper{position:sticky;top:70px;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.stepper{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.sb{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}
.sb .d{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--fm);font-size:11px;flex:none}
.sb.done .d{background:var(--ok);color:#fff}
.sb.cur{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.sb.cur .d{background:var(--accent);color:#fff}
.sb:disabled{opacity:.5;cursor:not-allowed}
.stamp{display:inline-grid;place-items:center;width:42px;height:42px;border:2px solid var(--bad);color:var(--bad);border-radius:50%;font-family:var(--fd);font-size:14px;transform:rotate(-12deg);animation:pop .3s}
.sheet{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:18px}
.sheet h3{text-align:center;margin-bottom:10px}
.graphbox{background:#FFFDF7;border:1px solid #E4D9BF;border-radius:6px;overflow:hidden;touch-action:none}
:root[data-theme="dark"] .graphbox{background:#1C1A14;border-color:#3A3527}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .graphbox{background:#1C1A14;border-color:#3A3527}}
.score{font-family:var(--fd);font-size:72px;color:var(--accent);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}
.modalbg{position:fixed;inset:0;background:rgba(10,16,15,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="topbar"><div class="wrap">
  <button class="brand" data-go="home" aria-label="처음으로">

function flaskSVG(o={}){
  const {w=120,h=190,level=0,color='var(--liquid)',alpha=.85,label='',vol='100 mL',id='fk'+Math.random().toString(36).slice(2,7),film=false}=o;
  const markY=52,neckTop=16,bulbTop=96,bottom=176;
  let y;const L=Math.max(0,level);
  if(L<=.9)y=bottom-(L/.9)*(bottom-bulbTop);else y=bulbTop-(L-.9)/.1*(bulbTop-markY);
  y=Math.max(neckTop,y);
  const path=`M52 ${neckTop} V100 C22 110 14 130 14 146 C14 166 32 180 60 180 C88 180 106 166 106 146 C106 130 98 110 68 100 V${neckTop}Z`;
  return `<svg viewBox="0 0 120 190" width="${w}" height="${h}" aria-label="메스플라스크 ${vol}">
  <defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs>
  <rect x="0" y="${y}" width="120" height="${190-y}" fill="${color}" opacity="${alpha}" clip-path="url(#${id})"/>
  <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <rect x="49" y="8" width="22" height="9" rx="2" fill="${film?'var(--glass-soft)':'none'}" stroke="var(--ink)" stroke-width="1.5"/>
  <line x1="48" x2="72" y1="${markY}" y2="${markY}" stroke="var(--ink)" stroke-width="2"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" font-family="IBM Plex Mono,monospace" fill="var(--ink)">${vol}</text>
  ${label?`<text x="60" y="164" text-anchor="middle" font-size="10" font-family="IBM Plex Sans KR,sans-serif" fill="var(--ink)">${esc(label)}</text>`:''}
  </svg>`;
}

function cuvetteSVG(color='none',o={}){const {w=40,h=80,fill=.8}=o;return `<svg viewBox="0 0 40 80" width="${w}" height="${h}"><rect x="6" y="${76-66*fill}" width="28" height="${66*fill}" fill="${color}" opacity=".8"/><rect x="6" y="6" width="28" height="70" fill="none" stroke="var(--ink)" stroke-width="2" rx="1"/><rect x="6" y="6" width="7" height="70" fill="var(--muted)" opacity=".35"/><rect x="27" y="6" width="7" height="70" fill="var(--muted)" opacity=".35"/></svg>`}

function pickQuestions(l){
  const n=LEVELS[l].n;const key='seen'+l;let seen=store.get(key,[]);
  let fresh=QB[l].filter(q=>!seen.includes(q.id));
  let out=[];
  if(l===3){out=shuffle(GEN).slice(0,4).map(g=>g())}
  const need=n-out.length;
  const pickFrom=pool=>{const byType={};const res=[];for(const q of shuffle(pool)){byType[q.t]=byType[q.t]||0;if(byType[q.t]<3&&res.length<need){res.push(q);byType[q.t]++}}for(const q of shuffle(pool)){if(res.length>=need)break;if(!res.includes(q))res.push(q)}return res};
  let st=pickFrom(fresh);
  if(st.length<need){seen=[];const rest=pickFrom(QB[l].filter(q=>!st.includes(q)));st=st.concat(rest.slice(0,need-st.length))}
  seen=seen.concat(st.map(q=>q.id));store.set(key,seen);
  return shuffle(out.concat(st));
}

  if(ok){Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);Q.right++;const pts=100+(Q.combo>1?(Q.combo-1)*20:0)-(Q.hint?40:0);Q.score+=pts;
    $('#fb').innerHTML=`<div class="feedback ok pop"><b>정답! +${pts}</b><p style="margin-top:4px">${esc(q.exp)}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="next">${Q.i+1<Q.qs.length?'다음 문제 →':'결과 보기'}</button></div></div>`;}
  else{Q.combo=0;Q.hearts--;Q.wrong.push({q,ans});
    $('#fb').innerHTML=`<div class="feedback bad pop"><b>아쉬워요</b>${ans?`<p style="margin-top:4px">정답: <b style="font-family:var(--fb);font-size:15px;font-weight:700">${esc(ans)}</b></p>`:''}<p style="margin-top:4px">${esc(q.exp)}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="next">${Q.hearts<=0?'결과 보기':(Q.i+1<Q.qs.length?'다음 문제 →':'결과 보기')}</button></div></div>`;
    $$('.heart path')[Q.hearts]?.setAttribute('fill','var(--line)');}
  $('.hud .mono[style]').textContent=Q.score+'점';
  const n=$('#next');n.focus();n.onclick=()=>{if(Q.hearts<=0||Q.i+1>=Q.qs.length)endQuiz();else{Q.i++;showQ()}};
}
function endQuiz(){
  clearInterval(qTimer);
  const total=Q.qs.length,rate=Q.right/total;
  const rank=Q.hearts<=0?'C':rate>=.9?'S':rate>=.75?'A':rate>=.55?'B':'C';
  const msg={S:'분광광도계가 당신을 알아봅니다. 다음 난이도 도전!',A:'거의 다 왔어요. 오답노트만 한 번 보면 S랭크.',B:'개념의 뼈대는 잡혔어요. 오답노트를 꼭 확인하세요.',C:'괜찮아요. 교과서 188~192쪽을 보고 다시 도전!'}[rank];
  const best=store.get('quizBest',{});if(best[Q.l]==null||Q.score>best[Q.l]){best[Q.l]=Q.score;store.set('quizBest',best)}
  const b2=store.get('best',{});b2.theory=Math.max(b2.theory||0,Math.round(rate*100));store.set('best',b2);
  record('기초 이론',`${LEVELS[Q.l].sub} · ${LEVELS[Q.l].name}`,Q.score,`정답 ${Q.right}/${total} · ${rank}랭크 · 풀이 ${Q.right+Q.wrong.length}/${total} · 최대 콤보 ${Q.maxCombo}${Q.hearts<=0?' · 하트 소진':''}`);
  const L=LEVELS[Q.l];
  app.innerHTML=`<div class="card pop" style="text-align:center">
    <p class="eyebrow">${L.badge} ${L.name} 결과</p>
    <div class="rank" style="margin-top:10px">${rank}</div>
    <p style="margin-top:8px;font-size:17px">${msg}</p>
    <div class="row" style="justify-content:center;margin-top:14px">
      <span class="pill acc">점수 ${Q.score}</span><span class="pill ok">정답 ${Q.right}/${total}</span><span class="pill">최대 콤보 ${Q.maxCombo}</span>${Q.hearts<=0?'<span class="pill bad">하트 소진</span>':''}
    </div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn pri" id="again">다시 도전</button><button class="btn" data-go="theory">난이도 선택</button>${Q.l<3?`<button class="btn" id="up">다음 난이도 →</button>`:`<button class="btn" data-go="practice">기초 실습으로 →</button>`}</div>
  </div>
  ${Q.wrong.length?`<div class="card" style="margin-top:16px"><h3>오답노트</h3><div class="stack" style="margin-top:10px">${Q.wrong.map(w=>`<div class="panel"><span class="pill">${TYPE_NAME[w.q.t]}</span><p style="margin-top:6px;font-weight:600">${esc(w.q.q)}</p>${w.ans?`<p class="small" style="margin-top:4px">정답: <b>${esc(w.ans)}</b></p>`:''}<p class="small muted" style="margin-top:4px">${esc(w.q.exp)}</p></div>`).join('')}</div></div>`:''}`;
  $('#again').onclick=()=>startQuiz(Q.l);const up=$('#up');if(up)up.onclick=()=>startQuiz(Q.l+1);
}
/* ===== 가상 기구 컴포넌트 ===== */
function holdButton(btn,onTick,ms=50){
  let t=null;const start=e=>{e.preventDefault();if(btn.disabled)return;btn.classList.add('active');onTick();t=setInterval(onTick,ms)};
  const stop=()=>{btn.classList.remove('active');clearInterval(t);t=null};
  btn.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!t){start(e)}});btn.addEventListener('keyup',stop);
  onLeave(stop);return stop;
}

function flaskGame(el,o){

      <div class="steps" id="fsteps"></div>
      <div class="row"><button class="btn holdbtn" id="fPour">세척병으로 붓기 (누르고 있기)</button><button class="btn" id="fDrop">한 방울</button></div>
      <div class="row"><button class="btn" id="fSeal" disabled>파라필름 밀봉</button><button class="btn" id="fInv" disabled>뒤집어 섞기 (0/10)</button></div>

      <div id="fmsg"></div>
    </div></div>`;
  const steps=['표선 아래까지 증류수 붓기','표선 근처는 한 방울씩 맞추기','파라필름으로 입구 밀봉','천천히 뒤집어 10회 섞기'];
  const idx=()=>S.phase==='fill'?(S.level<.97?0:1):S.phase==='sealed'?(S.inverts<10?3:4):S.phase==='marked'?2:(S.phase==='over'||S.phase==='spill')?1:4;

      <div class="stack" style="align-items:center;gap:6px"><div class="zoom"><svg viewBox="0 0 150 150" width="150" height="150">
        <rect x="50" y="0" width="50" height="150" fill="var(--surface2)"/>
        <path d="M51 ${75-zoomOff} Q75 ${75-zoomOff+12} 99 ${75-zoomOff} V150 H51Z" fill="${c}" opacity=".6"/>
        <line x1="50" y1="0" x2="50" y2="150" stroke="var(--ink)" stroke-width="2"/><line x1="100" y1="0" x2="100" y2="150" stroke="var(--ink)" stroke-width="2"/>
        <line x1="36" x2="114" y1="81" y2="81" stroke="var(--accent)" stroke-width="2.5"/></svg></div>
        <span class="small muted">표선 확대</span><span class="mono small">${(S.level*100).toFixed(2)} mL</span></div>`;
    $('#fsteps',el).innerHTML=steps.map((s,i)=>`<div class="stp ${i<idx()?'done':i===idx()?'cur':''}">${s}</div>`).join('');
    $('#fSeal',el).disabled=S.phase!=='marked';$('#fInv',el).disabled=S.phase!=='sealed'||S.inverts>=10;$('#fInv',el).textContent=`뒤집어 섞기 (${S.inverts}/10)`;
    $('#fOk',el).disabled=!(S.phase==='sealed'&&S.inverts>=10);
    $('#fPour',el).disabled=$('#fDrop',el).disabled=S.phase!=='fill';
  }
  const msg=(t,c='note')=>{$('#fmsg',el).innerHTML=`<div class="${c}">${t}</div>`};
  function check(){
    if(S.level>1.086){S.phase='spill';msg('플라스크가 넘쳤어요! 시약을 흘렸습니다. (실기에서는 과도한 흘림 −5점) 다시 조제해야 해요.','note bad');onSpill&&onSpill('spill');draw();return}
    if(S.level>1.004){msg(`표선을 넘었어요 (${((S.level-1)*100).toFixed(2)} mL 초과). 표선을 넘기면 덜어낼 수 없어요. 다시 조제하세요.`,'note bad');S.phase='over';onSpill&&onSpill('over');draw();return}
    if(S.level>=0.998){S.phase='marked';msg('표선 일치! 메니스커스 아랫면이 표선에 닿았어요. 파라필름으로 밀봉하세요.','note ok')}
    else if(S.level>.97)msg('표선 근처예요. 이제는 한 방울씩!','note warn');
    draw();
  }
  holdButton($('#fPour',el),()=>{if(S.phase!=='fill')return;S.level+=S.level<.95?.01:.004;check()},60);
  $('#fDrop',el).onclick=()=>{if(S.phase!=='fill')return;S.level+=0.0015;check()};
  $('#fSeal',el).onclick=()=>{S.sealed=true;S.phase='sealed';msg('파라필름을 적당히 늘려 입구를 감쌌어요. 이제 뒤집어 섞으세요.');draw()};

  $('#fOk',el).onclick=()=>onDone&&onDone(S.level);
  draw();
  return {reset(){Object.assign(S,{level:start,sealed:false,inverts:0,phase:'fill'});$('#fmsg',el).innerHTML='';draw()}};
}

/* 분광 모델 */
const G=(l,c,w)=>Math.exp(-(((l-c)/w)**2));
const SPEC={
  km:{name:'KMnO₄ 용액 (보라)',color:'rgba(142,28,116,.8)',f:l=>0.62*G(l,540,32)+0.10*G(l,508,13)+0.07*G(l,568,11)+0.02},
  yel:{name:'노란 색소 용액',color:'rgba(236,190,20,.85)',f:l=>0.7*G(l,427,38)+0.05*G(l,360,30)+0.01},
  blu:{name:'파란 색소 용액',color:'rgba(30,90,200,.8)',f:l=>0.66*G(l,630,26)+0.18*G(l,410,25)*0+0.12*G(l,585,18)+0.01}
};
const lmaxOf=k=>{let b=380,m=-1;for(let l=380;l<=720;l++){const v=SPEC[k].f(l);if(v>m){m=v;b=l}}return b};
function wlColor(l){ // 파장 → 색
  let r=0,g=0,b=0;if(l<380)return '#6a4c93';
  if(l<440){r=-(l-440)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=-(l-510)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=-(l-645)/65}else if(l<=780){r=1}
  return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
}

      <div class="small" style="font-weight:700;margin-top:4px">시료 선반 — 용액을 고른 뒤 홀더 칸을 누르세요</div>
      <div class="row" id="rack" style="gap:6px"></div>
    </div></div>`;
  const scr=$('#scr',el);
  function absOf(sol){
    if(!sol)return null;const lam=S.lam||540;
    const spec=SPEC[sol.spec||'km'];const ratio=spec.f(lam)/SPEC.km.f(540);
    let A=(sol.ppm||0)*inst.slope*(sol.spec&&sol.spec!=='km'?1:ratio)+(sol.ppm?inst.b:0)+gauss()*0.0004;
    if(sol.dirty)A+=0.012+Math.random()*.01;
    A+= S.zeroed?-S.zeroBase:0.045;
    return A;
  }
  function renderHolder(){
    $('#hold',el).innerHTML=S.holder.map((sid,i)=>{const sol=o.getSol(sid);return `<button class="pos ${S.sel===i?'sel':''}" data-p="${i}" aria-label="#${i+1} ${sol?sol.name:'비어 있음'}"><span>#${i+1}${i===7?' (Blank)':''}</span><span class="cv">${sol?`<i style="background:${sol.color||'transparent'}"></i>`:''}</span><span style="font-size:10px;line-height:1.2;text-align:center">${sol?esc(sol.short||sol.name):'—'}</span></button>`}).join('');
    $$('[data-p]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.p;
      if(S.holder[i]){S.holder[i]=null;renderHolder();o.onEvent&&o.onEvent('remove',{pos:i});return}
      if(S.pick==null){toast('먼저 아래 시료 선반에서 용액을 고르세요');return}
      const sid=S.pick;const put=()=>{S.holder=S.holder.map(x=>x===sid?null:x);S.holder[i]=sid;S.pick=null;renderRack();renderHolder();o.onEvent&&o.onEvent('insert',{pos:i,sid})};
      if(o.beforeInsert)o.beforeInsert(sid,put);else put();
    });
  }
  function renderRack(){
    const list=o.listSols();
    $('#rack',el).innerHTML=list.length?list.map(s=>`<button class="chip ${S.pick===s.id?'sel':''}" style="${S.pick===s.id?'border-color:var(--accent);background:var(--accent-soft)':''};font-size:12.5px;padding:6px 10px" data-sid="${s.id}"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${s.color||'transparent'};border:1px solid #889;margin-right:4px"></span>${esc(s.short||s.name)}</button>`).join(''):'<span class="small muted">아직 준비된 용액이 없어요</span>';
    $$('[data-sid]',el).forEach(b=>b.onclick=()=>{S.pick=b.dataset.sid;renderRack()});
  }
  function screen(){
    if(!S.power){scr.innerHTML=`<div class="off">전원 OFF</div>`;return}
    if(S.view==='boot'){
      const items=['CPU & ROM','WAVE MOTOR','CELL MOTOR','FILTER MOTOR','W LAMP','D2 LAMP','D2 WAVE'];
      scr.innerHTML=`<div>Initial Calibration · 자체 진단</div><table style="margin-top:8px">${items.map((it,i)=>`<tr><td style="text-align:left">${it}</td><td>${i<S.bootN?'Complete':i===S.bootN?'Checking…':''}</td></tr>`).join('')}</table>`;return}
    if(S.view==='home'){
      scr.innerHTML=`<div>측정 모드 선택</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <button data-m="photo">측광 모드<br><span style="opacity:.6">Photometric</span></button><button data-m="quant">정량 모드<br><span style="opacity:.6">Quantitation</span></button>
      <button data-m="spec">스펙트럼<br><span style="opacity:.6">Spectrum</span></button><button data-m="kin">키네틱<br><span style="opacity:.6">Kinetics</span></button></div>`;

    if(S.view==='setup'){

       <label class="row" style="gap:8px">셀 타입 <select id="sc"><option>단일셀</option><option selected>멀티셀</option></select></label>
       <label class="row" style="gap:8px">파장(nm) <input id="sl" inputmode="numeric" style="width:90px" value="${S.lam??''}" placeholder="예: 540"></label>
       ${S.mode==='quant'?`<label class="row" style="gap:8px">단위 <select id="su"><option>ppm</option><option>M</option><option>mg/L</option></select></label>`:''}
       <div class="row"><button id="sok">확인</button><button id="sback">뒤로</button></div></div>`;
      $('#sok',scr).onclick=()=>{const v=parseFloat($('#sl',scr).value);if(!(v>=190&&v<=1100)){toast('파장을 190~1100 nm 사이로 입력하세요');return}
        S.lam=v;S.zeroed=false;S.setup.cell=$('#sc',scr).value;if($('#su',scr))S.setup.unit=$('#su',scr).value;S.view='meas';screen();o.onEvent&&o.onEvent('setup',{lam:v,cell:S.setup.cell,unit:S.setup.unit})};
      $('#sback',scr).onclick=()=>{S.view='home';screen()};return}
    if(S.view==='meas'){
      scr.innerHTML=`<div class="row" style="justify-content:space-between"><span>λ ${S.lam} nm · ${S.setup.cell}</span><span style="color:${S.zeroed?'#8ff0d0':'#ffc36b'}">${S.zeroed?'ZERO OK':'ZERO 필요'}</span></div>
       <div class="big" style="margin-top:6px">${S.last!=null?S.last.toFixed(4)+' A':'—.———— A'}</div>

       <div style="max-height:120px;overflow:auto;margin-top:8px"><table><tr><th style="text-align:left">#</th><th style="text-align:left">시료</th><th>흡광도</th><th>%T</th></tr>${S.rows.slice(-12).map(r=>`<tr><td style="text-align:left">${r.pos+1}</td><td style="text-align:left">${esc(r.name)}</td><td>${r.A.toFixed(4)}</td><td>${Math.pow(10,2-r.A).toFixed(1)}</td></tr>`).join('')}</table></div>`;

  function autoZero(){

    const raw=(sol.ppm||0)*inst.slope*(SPEC.km.f(S.lam||540)/SPEC.km.f(540))+(sol.ppm?inst.b:0)+(sol.dirty?0.015:0);

  };
  screen();renderHolder();renderRack();
  return {S,refresh(){renderRack();renderHolder();screen()},absOf};
}

function record(kind,item,score,detail){
  const s=getStudent();if(!s)return;
  const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),clientTime:new Date().toISOString(),grade:s.grade,cls:s.cls,no:s.no,name:s.name,kind,item,score,detail:String(detail||'')};
  const mine=store.get('myrecords',[]);mine.push(r);store.set('myrecords',mine.slice(-300));
  if(SHEET_URL){const ob=store.get('outbox',[]);ob.push(r);store.set('outbox',ob);flushOutbox()}
}
let flushing=false;
async function flushOutbox(){
  if(!SHEET_URL||flushing)return;flushing=true;
  let ob=store.get('outbox',[]);
  while(ob.length){
    try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(ob[0])});ob=store.get('outbox',[]);ob.shift();store.set('outbox',ob)}
    catch(e){break}
  }
  flushing=false;updateWho();
}
window.addEventListener('online',flushOutbox);
function myRecordsHTML(){
  const s=getStudent();if(!s)return `<section class="card" style="margin-top:22px"><h3>실험실 출입 명부</h3><p class="muted" style="margin-top:6px">입장하려면 먼저 이름을 등록하세요.</p><button class="btn pri" id="chgme" style="margin-top:10px">이름 등록</button></section>`;
  const mine=store.get('myrecords',[]).slice().reverse().slice(0,8);
  return `<section class="card" style="margin-top:22px"><div class="row" style="justify-content:space-between"><h3>${esc(sLabel(s))}의 활동 기록</h3><button class="btn sm" id="chgme">다른 학생으로 변경</button></div>
   ${mine.length?`<div class="tw" style="margin-top:10px"><table class="table"><tr><th>시간</th><th>구분</th><th>항목</th><th>점수</th></tr>${mine.map(r=>`<tr><td class="mono small">${new Date(r.clientTime).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(r.kind)}</td><td>${esc(r.item)}</td><td class="mono">${r.score}</td></tr>`).join('')}</table></div>`:'<p class="muted" style="margin-top:6px">아직 기록이 없어요. 기초 이론 게임부터 시작해 보세요.</p>'}
   <p class="small muted" style="margin-top:8px">${SHEET_URL?(store.get('outbox',[]).length?`선생님께 전송 대기 중 ${store.get('outbox',[]).length}건 (인터넷 연결 시 자동 전송)`:'모든 기록이 선생님께 전송되었어요.'):'이 페이지는 선생님 스프레드시트와 아직 연결되지 않아 기록이 이 브라우저에만 저장됩니다.'}</p></section>`;
}

/* 교사용 결과 */
let TD={key:'',rows:null,f:{g:'',c:'',q:''},show:60};
function renderTeacher(){
  if(!SHEET_URL){
    app.innerHTML=`<p class="eyebrow">교사용</p><h2 style="margin-top:6px">학생 결과 보기</h2>
    <div class="card" style="margin-top:16px"><h3>스프레드시트가 아직 연결되지 않았어요</h3>
    <p style="margin-top:8px">학생 결과를 모으려면 Google 스프레드시트에 Apps Script를 한 번 설치하고, 웹 앱 URL을 <code>index.html</code> 맨 위 <code>SHEET_URL</code>에 붙여 넣으세요. 자세한 순서는 함께 드린 README에 있습니다.</p>
    <ol style="margin:10px 0 0;padding-left:20px"><li>Google 스프레드시트 새로 만들기 → 확장 프로그램 → Apps Script</li><li><code>apps-script.gs</code> 내용 붙여 넣기, 교사 비밀번호 바꾸기</li><li>배포 → 새 배포 → 웹 앱 (실행: 나, 액세스: 모든 사용자)</li><li>웹 앱 URL을 <code>SHEET_URL</code>에 넣고 GitHub에 다시 올리기</li></ol></div>`;return}
  if(!TD.rows){
    app.innerHTML=`<p class="eyebrow">교사용</p><h2 style="margin-top:6px">학생 결과 보기</h2>
    <form class="card" id="tkf" style="margin-top:16px;max-width:460px"><label class="stack" style="gap:4px"><b>교사 비밀번호</b><input id="tk" type="password" autocomplete="current-password" value="${esc(TD.key)}"></label>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pri" type="submit">결과 불러오기</button></div><div id="tmsg" style="margin-top:8px"></div></form>`;
    $('#tkf').addEventListener('submit',e=>{e.preventDefault();TD.key=$('#tk').value;loadTeacher()});return}
  drawTeacher();
}
async function loadTeacher(){
  const m=$('#tmsg');if(m)m.innerHTML='<div class="note">불러오는 중…</div>';
  try{const res=await fetch(`${SHEET_URL}?key=${encodeURIComponent(TD.key)}&t=${Date.now()}`);const j=await res.json();
    if(!j.ok){if(m)m.innerHTML=`<div class="note bad">${esc(j.error||'비밀번호를 확인하세요')}</div>`;TD.rows=null;return}
    const seen=new Set();TD.rows=j.rows.filter(r=>{if(!r.id)return true;if(seen.has(r.id))return false;seen.add(r.id);return true});renderTeacher();
  }catch(e){if(m)m.innerHTML=`<div class="note bad">불러오지 못했어요. 웹 앱 URL과 배포 설정(액세스: 모든 사용자)을 확인하세요.</div>`}
}
function drawTeacher(){
  const f=TD.f;const all=TD.rows;
  const rows=all.filter(r=>(!f.g||String(r.grade)===f.g)&&(!f.c||String(r.cls)===f.c)&&(!f.q||String(r.name).includes(f.q)));
  const grades=[...new Set(all.map(r=>String(r.grade)))].sort(),classes=[...new Set(all.map(r=>String(r.cls)))].sort((a,b)=>a-b);
  const by={};rows.forEach(r=>{const k=`${r.grade}-${r.cls}-${r.no}-${r.name}`;(by[k]=by[k]||{r,list:[]}).list.push(r)});
  const sum=Object.values(by).map(({r,list})=>{
    const best=lv=>{const s=list.filter(x=>x.kind==='기초 이론'&&String(x.item).startsWith(lv)).map(x=>+x.score);return s.length?Math.max(...s):null};
    const prac=new Set(list.filter(x=>x.kind==='기초 실습').map(x=>x.item)).size;
    const ex=list.filter(x=>x.kind==='화학분석기능사').map(x=>+x.score);
    const last=list.map(x=>new Date(x.time||x.clientTime)).sort((a,b)=>b-a)[0];
    return {grade:r.grade,cls:r.cls,no:r.no,name:r.name,t1:best('초보'),t2:best('중급'),t3:best('고급'),prac,exBest:ex.length?Math.max(...ex):null,exN:ex.length,last,n:list.length};
  }).sort((a,b)=>a.grade-b.grade||a.cls-b.cls||a.no-b.no);
  const cell=v=>v==null?'<span class="muted">—</span>':v;
  const exCell=v=>v==null?'<span class="muted">—</span>':`<span class="pill ${v>=60?'ok':'bad'}">${v}</span>`;
  const detail=rows.slice().sort((a,b)=>new Date(b.time||b.clientTime)-new Date(a.time||a.clientTime));
  const dt=d=>new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  app.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><p class="eyebrow">교사용</p><h2 style="margin-top:6px">학생 결과</h2></div>
   <div class="row"><span class="pill">학생 ${sum.length}명 · 기록 ${rows.length}건</span><button class="btn sm" id="trf">새로고침</button><button class="btn sm" id="tout">잠그기</button></div></div>
   <div class="panel row" style="margin-top:14px">
    <label class="row small" style="gap:6px">학년 <select id="fg"><option value="">전체</option>${grades.map(g=>`<option ${f.g===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px">반 <select id="fc"><option value="">전체</option>${classes.map(c=>`<option ${f.c===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px;flex:1;min-width:180px">이름 <input id="fq" value="${esc(f.q)}" placeholder="이름으로 찾기" style="flex:1"></label>
   </div>
   <div class="card" style="margin-top:14px"><h3>학생별 요약</h3><p class="small muted" style="margin-top:4px">기초 이론은 난이도별 최고 점수, 기초 실습은 완료한 미션 수(7개 중), 실기는 모의 채점 최고점(60점 이상 초록)입니다.</p>
    <div class="tw" style="margin-top:10px"><table class="table"><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>이론 초보</th><th>이론 중급</th><th>이론 고급</th><th>실습 완료</th><th>실기 최고</th><th>실기 응시</th><th>마지막 활동</th></tr>
    ${sum.map(s=>`<tr><td>${s.grade}</td><td>${s.cls}</td><td>${s.no}</td><td style="font-weight:600">${esc(s.name)}</td><td class="mono">${cell(s.t1)}</td><td class="mono">${cell(s.t2)}</td><td class="mono">${cell(s.t3)}</td><td class="mono">${s.prac}/7</td><td>${exCell(s.exBest)}</td><td class="mono">${s.exN}</td><td class="mono small">${s.last?dt(s.last):''}</td></tr>`).join('')||'<tr><td colspan="11" class="muted">조건에 맞는 기록이 없어요</td></tr>'}</table></div></div>
   <div class="card" style="margin-top:14px"><h3>전체 기록 (최신순)</h3>
    <div class="tw" style="margin-top:10px"><table class="table"><tr><th>시간</th><th>학번</th><th>이름</th><th>구분</th><th>항목</th><th>점수</th><th style="text-align:left">상세</th></tr>
    ${detail.slice(0,TD.show).map(r=>`<tr><td class="mono small">${dt(r.time||r.clientTime)}</td><td class="mono">${r.grade}-${r.cls}-${r.no}</td><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${esc(r.item)}</td><td class="mono">${r.score}</td><td class="small" style="text-align:left">${esc(r.detail)}</td></tr>`).join('')}</table></div>
    ${detail.length>TD.show?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="tmore">더 보기 (${detail.length-TD.show}건 남음)</button></div>`:''}
    <p class="small muted" style="margin-top:8px">원본 데이터는 연결한 Google 스프레드시트의 「결과」 시트에 그대로 쌓입니다. 엑셀로 내려받거나 정렬·필터는 스프레드시트에서 하세요.</p></div>`;
  $('#fg').onchange=e=>{f.g=e.target.value;drawTeacher()};$('#fc').onchange=e=>{f.c=e.target.value;drawTeacher()};
  $('#fq').oninput=e=>{f.q=e.target.value.trim();clearTimeout(TD.qt);TD.qt=setTimeout(()=>{drawTeacher();const q=$('#fq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)};
  $('#trf').onclick=async()=>{toast('새로 불러오는 중…');await loadTeacher()};
  $('#tout').onclick=()=>{TD.rows=null;TD.key='';renderTeacher()};
  const mo=$('#tmore');if(mo)mo.onclick=()=>{TD.show+=100;drawTeacher()};
}
render();flushOutbox();

</script>
</body>
