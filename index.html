<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>중화 적정 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
</head>
<body>
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#15201E; --muted:#56655F; --line:#D3DCD9;
  --accent:#9C1F74; --accent-ink:#FFFFFF; --accent-soft:#F7E4F0; --glass:#2A7584; --glass-soft:#DDEFF2;
  --ok:#1D7F46; --ok-soft:#DDF2E5; --warn:#A96A00; --warn-soft:#FBEFD6; --bad:#B8322A; --bad-soft:#F9E0DE;
  --lcd:#0F2A26; --lcd-ink:#9CF2D6; --shadow:0 1px 2px rgba(20,32,30,.06),0 6px 20px rgba(20,32,30,.06);
  --liquid:#8E1C74; --water:#CFE8F0;
  --r:12px;
  --fd:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --fb:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#E06AB6; --accent-ink:#1A0714; --accent-soft:#3A1731; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#E06AB6; --accent-ink:#1A0714; --accent-soft:#3A1731; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,56px)} h2{font-size:clamp(26px,4vw,34px)} h3{font-size:21px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.panel{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--glass)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.glass{background:var(--glass);border-color:var(--glass);color:var(--surface)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{border-left:3px solid var(--glass);padding:8px 12px;background:var(--glass-soft);border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
main{padding-top:24px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding-block:24px 8px}
.school{font-family:var(--fd);font-size:clamp(28px,4.6vw,42px);line-height:1.15;color:var(--ink);display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline}
.school span{color:var(--accent)}
.hero .lead{font-size:17px;color:var(--muted);max-width:52ch;margin-top:12px}
.door{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.units{margin-top:28px}
.unit{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.unit .num{font-family:var(--fm);font-size:13px;color:var(--muted);min-width:34px;padding-top:3px}
.unit.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit.off{opacity:.62;cursor:default}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* hub */
.mode{display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .tag{font-family:var(--fm);font-size:12px;color:var(--accent)}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.mode svg{width:100%;height:120px}

/* quiz */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lv{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lv:hover{border-color:var(--c)}
.lv .badge{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);font-size:22px;color:#fff;background:var(--c)}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hearts{display:flex;gap:4px}
.heart{width:22px;height:20px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{margin-top:14px}
.qtype{display:inline-block;font-family:var(--fd);font-size:17px;padding:3px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:19px;font-weight:600;margin-top:10px}
.cho{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.cho span{font-family:var(--fd);font-size:40px;width:64px;height:72px;display:grid;place-items:center;background:var(--lcd);color:var(--lcd-ink);border-radius:10px}
.cho span.sp{background:transparent;width:18px}
.jam{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.syl{width:66px;height:78px;border-radius:10px;border:2px dashed var(--glass);display:grid;grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;padding:6px;font-family:var(--fd);font-size:24px;color:var(--glass);background:var(--glass-soft)}
.syl .c{grid-column:1;grid-row:1;display:grid;place-items:center}
.syl .v{grid-column:2;grid-row:1;display:grid;place-items:center;color:var(--muted);font-size:18px}
.syl .j{grid-column:1/3;grid-row:2;display:grid;place-items:center}
.syl.sp{border:0;background:none;width:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ox{display:flex;gap:14px;margin-top:18px}
.ox button{flex:1;font-family:var(--fd);font-size:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:10px}
.ox button:hover{border-color:var(--accent)}
.ansrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:180px;font-size:18px}
.blankq{font-size:19px;line-height:2}
.blankq .b{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:700;padding:0 6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mi.shake{animation:shake .35s}
.orderlist{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.oi{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.oi .n{font-family:var(--fm);color:var(--muted);width:22px}
.oi .t{flex:1}
.oi button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;width:34px;height:30px}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px}
.feedback.ok{background:var(--ok-soft);color:var(--ink);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.feedback b{font-family:var(--fd);font-size:20px;font-weight:400}
.combo{font-family:var(--fd);color:var(--accent);font-size:20px}
.timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:var(--warn)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
.pt{outline:none}.pt .tip{opacity:0;transition:opacity .12s;pointer-events:none}.pt:hover .tip,.pt:focus .tip{opacity:1}.pt:hover circle:nth-child(2),.pt:focus circle:nth-child(2){stroke:var(--ink);stroke-width:2}
.rank{font-family:var(--fd);font-size:88px;line-height:1;color:var(--accent)}

/* practice */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:18px}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .ck{color:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px}
.tool svg{width:70px;height:80px}
.tool.sel{border-color:var(--accent);background:var(--accent-soft)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.bench{grid-template-columns:1fr}}
.stage{background:linear-gradient(var(--surface2),var(--surface2)) padding-box;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:center;align-items:flex-end;gap:20px;padding:14px;min-height:280px;position:relative;flex-wrap:wrap}
.stage svg{max-width:100%}
.holdbtn{user-select:none;-webkit-user-select:none;touch-action:none}
.holdbtn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zoom{width:150px;height:150px;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--surface)}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.stp{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:14px}
.stp::before{counter-increment:s;content:counter(s);font-family:var(--fm);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none}
.stp.done{color:var(--muted)} .stp.done::before{background:var(--ok);color:#fff;content:"✓"}
.stp.cur{background:var(--accent-soft)} .stp.cur::before{background:var(--accent);color:#fff}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip.used{opacity:.35;pointer-events:none}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{min-width:110px;min-height:44px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;padding:6px 10px;font-weight:600;font-size:14px;text-align:center}
.slot.fill{border-style:solid;border-color:var(--glass);background:var(--glass-soft)}
.arrow{color:var(--muted);font-family:var(--fm)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--fm);font-size:11px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.table th{background:var(--surface2);font-weight:600}
.tw{overflow-x:auto}

/* instrument */
.inst{background:#D9DEDC;border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;border:1px solid #BFC6C3;color:#15201E}
:root[data-theme="dark"] .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}}
@media (max-width:760px){.inst{grid-template-columns:1fr}}
.screen{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:12px;min-height:250px;font-family:var(--fm);font-size:13px;position:relative;overflow:hidden}
.screen .big{font-size:30px;font-weight:600}
.screen button{background:rgba(156,242,214,.1);border:1px solid rgba(156,242,214,.4);color:var(--lcd-ink);border-radius:6px;padding:6px 10px;font-family:var(--fm);font-size:12.5px}
.screen button:hover{background:rgba(156,242,214,.22)}
.screen input,.screen select{background:#0a1f1c;color:var(--lcd-ink);border-color:rgba(156,242,214,.35);font-family:var(--fm);padding:4px 8px;font-size:13px}
.screen .off{position:absolute;inset:0;background:#050b0a;display:grid;place-items:center;color:#3c5a54}
.screen table{width:100%;border-collapse:collapse}
.screen td,.screen th{border-bottom:1px solid rgba(156,242,214,.18);padding:3px 4px;text-align:right}
.screen th{text-align:right;font-weight:600;opacity:.7}
.holder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos{background:#11191A;border-radius:8px;padding:6px;color:#cfe;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--fm);font-size:11px;min-height:86px;border:2px solid transparent}
.pos.sel{border-color:var(--accent)}
.pos .cv{width:22px;height:40px;border:1.5px solid #9ab;border-radius:2px;position:relative;background:#1d2b2d}
.pos .cv i{position:absolute;left:0;right:0;bottom:0;height:78%}
.power{width:44px;height:44px;border-radius:50%;border:2px solid #6a7571;background:#2B3432;color:#fff;font-weight:700}
.power.on{background:var(--ok);border-color:var(--ok)}

/* exam */
.examgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.examgrid{grid-template-columns:1fr}}
.stepper{position:sticky;top:70px;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.stepper{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.sb{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}
.sb .d{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--fm);font-size:11px;flex:none}
.sb.done .d{background:var(--ok);color:#fff}
.sb.cur{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.sb.cur .d{background:var(--accent);color:#fff}
.sb:disabled{opacity:.5;cursor:not-allowed}
.stamp{display:inline-grid;place-items:center;width:42px;height:42px;border:2px solid var(--bad);color:var(--bad);border-radius:50%;font-family:var(--fd);font-size:14px;transform:rotate(-12deg);animation:pop .3s}
.sheet{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:18px}
.sheet h3{text-align:center;margin-bottom:10px}
.graphbox{background:#FFFDF7;border:1px solid #E4D9BF;border-radius:6px;overflow:hidden;touch-action:none}
:root[data-theme="dark"] .graphbox{background:#1C1A14;border-color:#3A3527}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .graphbox{background:#1C1A14;border-color:#3A3527}}
.score{font-family:var(--fd);font-size:72px;color:var(--accent);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}
.modalbg{position:fixed;inset:0;background:rgba(10,16,15,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
/* ===== 중화 적정 전용 ===== */
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:120px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
.tbench{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.tbench{grid-template-columns:1fr}}
.scene{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;justify-content:center}
.scene svg{width:100%;max-width:300px;height:auto}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl .row .btn{flex:1;justify-content:center;min-width:120px}
.lens{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lens svg{flex:none}

/* =====================================================================
   화학 엔진 — 전하 균형식으로 pH 계산
   S: 강한 양이온(Na+) − 강한 음이온(Cl−, 2×SO4²−)의 농도 [M]
   Cha/Ka: 약산 전체 농도와 이온화 상수, Cb/Kb: 약염기 전체 농도와 이온화 상수
   ===================================================================== */
const KW=1e-14,KA_AC=1.8e-5,KB_NH3=1.8e-5;
function solvePH(S,Cha=0,Ka=KA_AC,Cb=0,Kb=KB_NH3){
  const KaB=KW/Kb;
  const f=H=>H+S+(Cb?Cb*H/(H+KaB):0)-KW/H-(Cha?Cha*Ka/(Ka+H):0);
  let lo=-15,hi=1;
  for(let i=0;i<80;i++){const m=(lo+hi)/2;if(f(10**m)>0)hi=m;else lo=m}
  return -(lo+hi)/2;
}
/* 적정 시나리오 */
const SC={
  vinegar:{key:'vinegar',title:'식초 속 아세트산',acid:'아세트산(CH₃COOH) — 희석한 식초',titrant:'수산화 소듐(NaOH)',tShort:'NaOH',aShort:'CH₃COOH',type:'약산 + 강염기',aType:'wa',
    eq:'CH₃COOH + NaOH → CH₃COONa + H₂O',na:1,nb:1,salt:'CH₃COONa (염기성 염)',eqpH:'약 8.7 (염기성)',analyte:'acid'},
  hcl:{key:'hcl',title:'염산(HCl)의 농도',acid:'염산(HCl) 미지 농도',titrant:'수산화 소듐(NaOH) 0.1000 M 표준용액',tShort:'NaOH',aShort:'HCl',type:'강산 + 강염기',aType:'sa',
    eq:'HCl + NaOH → NaCl + H₂O',na:1,nb:1,salt:'NaCl (중성 염)',eqpH:'7 (중성)',analyte:'acid'},
  h2so4:{key:'h2so4',title:'황산(H₂SO₄)의 농도',acid:'황산(H₂SO₄) 미지 농도',titrant:'수산화 소듐(NaOH) 0.1000 M 표준용액',tShort:'NaOH',aShort:'H₂SO₄',type:'강산(2가) + 강염기',aType:'sa2',
    eq:'H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O',na:2,nb:1,salt:'Na₂SO₄ (중성 염)',eqpH:'7 (중성)',analyte:'acid'},
  nh3:{key:'nh3',title:'암모니아수(NH₃)의 농도',acid:'암모니아수(NH₃) 미지 농도',titrant:'염산(HCl) 0.1000 M 표준용액',tShort:'HCl',aShort:'NH₃',type:'약염기 + 강산',aType:'wb',
    eq:'NH₃ + HCl → NH₄Cl',na:1,nb:1,salt:'NH₄Cl (산성 염)',eqpH:'약 5.3 (산성)',analyte:'base'}
};
/* 플라스크 속 pH: Va = 시료 부피(mL), Ca = 시료 농도, Ct = 적정액 농도, V = 넣은 적정액 부피 */
function pHat(sc,Ca,Va,Ct,V){
  const Vt=Va+V;
  if(sc.aType==='wa')return solvePH(Ct*V/Vt,Ca*Va/Vt,KA_AC);
  if(sc.aType==='sa')return solvePH((Ct*V-Ca*Va)/Vt);
  if(sc.aType==='sa2')return solvePH((Ct*V-2*Ca*Va)/Vt);
  if(sc.aType==='wb')return solvePH(-Ct*V/Vt,0,KA_AC,Ca*Va/Vt,KB_NH3);
}
const veqOf=(sc,Ca,Va,Ct)=>(sc.aType==='sa2'?2:1)*Ca*Va/Ct;

/* 지시약: 변색 범위(교과서 수업자료) · 색 · 종말점 색 */
const IND={
  pp:{k:'pp',n:'페놀프탈레인',range:[8.2,10.0],pk:8.9,slope:1.3,A:[255,255,255,0],M:null,B:[228,32,140,.95],names:['무색','무색','붉은색(분홍)'],endName:'옅은 분홍색',endPH:8.4},
  mo:{k:'mo',n:'메틸 오렌지',range:[3.1,4.4],pk:3.75,slope:1.5,A:[222,38,44,.95],M:[245,128,24,.95],B:[248,204,32,.95],names:['빨간색','주황색','노란색'],endName:'주황색',endPH:3.9},
  btb:{k:'btb',n:'BTB 용액',range:[6.0,7.6],pk:6.8,slope:1.4,A:[236,196,30,.95],M:[52,150,84,.95],B:[36,86,206,.95],names:['노란색','초록색','파란색'],endName:'초록색',endPH:6.8},
  lit:{k:'lit',n:'리트머스 용액',range:[4.5,8.3],pk:6.4,slope:.5,A:[208,50,64,.9],M:[128,62,150,.9],B:[62,82,196,.9],names:['붉은색','보라색','푸른색'],endName:'보라색',endPH:6.4}
};
const IND_ORDER=['pp','mo','btb','lit'];
const SUIT={sa:['pp','btb','mo'],sa2:['pp','btb','mo'],wa:['pp'],wb:['mo']};
function indFrac(ind,pH){return 1/(1+10**(ind.slope*(ind.pk-pH)))}
function mix(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t)}
function indRGBA(ind,pH,strength=1){
  const f=indFrac(ind,pH);let c;
  if(!ind.M)c=[ind.B[0],ind.B[1],ind.B[2],ind.B[3]*f];
  else c=f<.5?mix(ind.A,ind.M,f*2):mix(ind.M,ind.B,(f-.5)*2);
  return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${(c[3]*strength).toFixed(3)})`;
}
function indName(ind,pH){const [lo,hi]=ind.range;if(ind.k==='pp')return pH<lo?'무색':pH<9?'옅은 분홍색':'붉은색(분홍)';return pH<lo?ind.names[0]:pH>hi?ind.names[2]:ind.names[1]}
/* 이 지시약으로 종말점(색이 바뀌는 지점)에 도달하는 부피 */
function vIndicator(sc,Ca,Va,Ct,ind){
  const veq=veqOf(sc,Ca,Va,Ct);const up=sc.analyte==='acid';
  let lo=0,hi=veq*2;
  for(let i=0;i<60;i++){const m=(lo+hi)/2;const p=pHat(sc,Ca,Va,Ct,m);if(up?(p<ind.endPH):(p>ind.endPH))lo=m;else hi=m}
  return (lo+hi)/2;
}
function judgeIndicator(sc,ind){
  const Ca=sc.aType==='sa2'?.05:sc.aType==='wa'?.085:.1,Va=20,Ct=.1;
  const veq=veqOf(sc,Ca,Va,Ct),vi=vIndicator(sc,Ca,Va,Ct,ind);const err=(vi-veq)/veq*100;
  const ok=SUIT[sc.aType].includes(ind.k);
  let why;
  if(ind.k==='lit')why='리트머스는 변색 범위(pH 4.5~8.3)가 넓고 색이 서서히 변해 종말점을 한 방울 단위로 정할 수 없습니다. 액성 판별용이지 적정용이 아니에요.';
  else if(ok)why=`변색 범위(pH ${ind.range[0]}~${ind.range[1]})가 중화점 근처 pH가 급격히 변하는 구간 안에 있어, 한 방울 차이로 색이 바뀝니다.`;
  else why=`중화점의 pH는 ${sc.eqpH}인데 ${ind.n}은 pH ${ind.range[0]}~${ind.range[1]}에서 변색합니다. 중화점보다 ${err<0?'먼저':'늦게'} 색이 바뀌어 약 ${Math.abs(err).toFixed(1)} %의 오차가 생겨요.`;
  return {ok,err,why};
}
function endChange(sc,ind){
  if(ind.k==='pp')return sc.analyte==='acid'?'무색 → 옅은 분홍색':'붉은색 → 무색';
  const start=sc.analyte==='acid'?ind.names[0]:ind.names[2];
  return `${start} → ${ind.endName}`;
}

  <rect x="134" y="143" width="6" height="22" fill="${INK}" opacity=".8"/><rect x="160" y="143" width="6" height="22" fill="${INK}" opacity=".8"/>
  <rect x="141" y="${yR}" width="18" height="${322-yR}" fill="${s.titrantCol||'rgba(160,200,230,.45)'}"/>
  <path d="M141 ${yR} Q150 ${yR+5} 159 ${yR}" fill="none" stroke="${INK}" stroke-width=".8" opacity=".6"/>

  <rect x="${s.open?147:132}" y="${s.open?323:335.5}" width="${s.open?6:36}" height="${s.open?30:5}" rx="2.5" fill="var(--accent)"/>

  ${(s.drops||[]).map(y=>`<ellipse cx="150" cy="${y}" rx="2.6" ry="3.4" fill="rgba(120,170,215,.9)"/>`).join('')}

   <path d="${liq}" fill="rgba(200,225,240,.35)"/>

   ${s.flash>0.02?`<ellipse cx="150" cy="${lvl+8}" rx="${12+26*(1-s.flash)}" ry="${5+7*(1-s.flash)}" fill="${s.flashCol}" opacity="${Math.min(1,s.flash*1.3).toFixed(2)}"/>`:''}
   <path d="M138 380 H162 V398 L188 448 a3 3 0 0 1 -3 3 H115 a3 3 0 0 1 -3 -3 L138 398Z" fill="none" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>

/* ===== 뷰렛 눈금 확대경 ===== */
function lensSVG(R,o={}){
  const {size=180,eye=0,col='rgba(150,195,230,.55)'}=o;
  const px=120,shift=eye*.14,center=R+shift,cy=size/2,id='ln'+Math.random().toString(36).slice(2,7);
  const y=v=>cy+(v-center)*px;
  const xl=34,xr=size-34;
  const out=[];
  const v0=Math.floor((center-.9)*10),v1=Math.ceil((center+.9)*10);
  for(let t=v0;t<=v1;t++){if(t<0||t>500)continue;const v=t/10,yy=y(v);const whole=t%10===0,half=t%5===0;
    const L=whole?46:half?32:20;out.push(`<line x1="${xl}" x2="${xl+L}" y1="${yy}" y2="${yy}" stroke="${INK}" stroke-width="${whole?1.8:1.1}"/>`);
    if(whole)out.push(`<text x="${xl+L+6}" y="${yy+5}" font-size="15" font-family="IBM Plex Mono,monospace" fill="${INK}" font-weight="600">${t/10}</text>`)}
  const ym=y(R);
  const men=`M${xl} ${ym-9} Q${size/2} ${ym+9} ${xr} ${ym-9} V${size+10} H${xl}Z`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="뷰렛 눈금 확대">
   <defs><clipPath id="${id}"><circle cx="${size/2}" cy="${size/2}" r="${size/2-3}"/></clipPath></defs>
   <g clip-path="url(#${id})"><rect width="${size}" height="${size}" fill="var(--surface)"/>
   <path d="${men}" fill="${col}"/><path d="M${xl} ${ym-9} Q${size/2} ${ym+9} ${xr} ${ym-9}" fill="none" stroke="${INK}" stroke-width="1.6"/>
   ${out.join('')}
   <line x1="${xl}" x2="${xl}" y1="0" y2="${size}" stroke="${INK}" stroke-width="2.4"/><line x1="${xr}" x2="${xr}" y1="0" y2="${size}" stroke="${INK}" stroke-width="2.4"/>
   ${eye?`<line x1="0" x2="${size}" y1="${cy}" y2="${cy}" stroke="var(--bad)" stroke-dasharray="4 4" opacity=".6"/>`:''}
   </g><circle cx="${size/2}" cy="${size/2}" r="${size/2-3}" fill="none" stroke="${INK}" stroke-width="4"/></svg>`;
}

/* ===== 적정 곡선 ===== */
function curveSVG(o){
  const {sc,Ca,Va=20,Ct,ind,marks=[],W=600,H=300,showInd=true}=o;
  const veq=veqOf(sc,Ca,Va,Ct);const Vmax=Math.max(10,Math.ceil(veq*1.8/5)*5);
  const L=44,R=14,T=14,B=38,pw=W-L-R,ph=H-T-B;
  const X=v=>L+v/Vmax*pw,Y=p=>T+(14-p)/14*ph;
  const pts=[];for(let i=0;i<=300;i++){const v=Vmax*i/300;pts.push(`${X(v).toFixed(1)},${Y(pHat(sc,Ca,Va,Ct,v)).toFixed(1)}`)}
  const grid=[];for(let p=0;p<=14;p+=2){grid.push(`<line x1="${L}" x2="${W-R}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(p)+4}" text-anchor="end">${p}</text>`)}
  for(let v=0;v<=Vmax;v+=5)grid.push(`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T+ph}" stroke="var(--line)" opacity=".6"/><text x="${X(v)}" y="${T+ph+16}" text-anchor="middle">${v}</text>`);
  let band='';
  if(ind&&showInd){const [lo,hi]=ind.range;const gid='g'+Math.random().toString(36).slice(2,7);
    band=`<defs><linearGradient id="${gid}" x1="0" y1="1" x2="0" y2="0">${[0,.25,.5,.75,1].map(t=>`<stop offset="${t}" stop-color="${indRGBA(ind,lo+(hi-lo)*t)}"/>`).join('')}</linearGradient></defs>
    <rect x="${L}" y="${Y(hi)}" width="${pw}" height="${Y(lo)-Y(hi)}" fill="url(#${gid})" opacity=".55"/>
    <rect x="${L}" y="${Y(hi)}" width="${pw}" height="${Y(lo)-Y(hi)}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${W-R-6}" y="${Y(hi)-4}" text-anchor="end" style="fill:var(--ink)">${ind.n} 변색 범위 pH ${lo}~${hi}</text>`}
  const mk=marks.map((m,i)=>{const p=pHat(sc,Ca,Va,Ct,m.v);return `<g><circle cx="${X(m.v)}" cy="${Y(p)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/><text x="${X(m.v)+7}" y="${Y(p)-8-i*12}" style="fill:var(--accent);font-weight:600">${esc(m.label||'')}</text></g>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sc.title)} 적정 곡선">
   ${grid.join('')}${band}
   <line x1="${X(veq)}" x2="${X(veq)}" y1="${T}" y2="${T+ph}" stroke="var(--glass)" stroke-width="1.5" stroke-dasharray="5 4"/>
   <text x="${X(veq)+4}" y="${T+12}" style="fill:var(--glass)">중화점 ${veq.toFixed(2)} mL</text>
   <polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
   ${mk}
   <text x="${L+pw/2}" y="${H-4}" text-anchor="middle">넣은 ${sc.tShort} 부피 (mL)</text>
   <text x="12" y="${T+ph/2}" text-anchor="middle" transform="rotate(-90 12 ${T+ph/2})">pH</text>
  </svg>`;
}

function pickQuestions(l){
  const n=LEVELS[l].n;const key='seen'+l;let seen=store.get(key,[]);
  const fresh=QB[l].filter(q=>!seen.includes(q.id));
  let out=[];if(l===3)out=shuffle(GEN).slice(0,3).map(g=>g());
  const need=n-out.length;
  const pickFrom=pool=>{const byType={};const res=[];for(const q of shuffle(pool)){byType[q.t]=byType[q.t]||0;if(byType[q.t]<3&&res.length<need){res.push(q);byType[q.t]++}}for(const q of shuffle(pool)){if(res.length>=need)break;if(!res.includes(q))res.push(q)}return res};
  let st=pickFrom(fresh);
  if(st.length<need){seen=[];const rest=pickFrom(QB[l].filter(q=>!st.includes(q)));st=st.concat(rest.slice(0,need-st.length))}
  seen=seen.concat(st.map(q=>q.id));store.set(key,seen);
  return shuffle(out.concat(st));
}

  }else if(q.t==='match'){
    Q.m={left:null,done:0,miss:0};
    body=`<div class="match"><div class="col">${shuffle(q.pairs.map((p,i)=>({t:p[0],i}))).map(x=>`<button class="mi" data-l="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col">${shuffle(q.pairs.map((p,i)=>({t:p[1],i}))).map(x=>`<button class="mi" data-r="${x.i}">${esc(x.t)}</button>`).join('')}</div></div><p class="small muted" style="margin-top:8px">왼쪽을 누른 뒤 짝이 되는 오른쪽을 누르세요. 2번 이상 틀리면 오답 처리돼요.</p>`;
  }else if(q.t==='order'){
    Q.ord=shuffle(q.items);if(Q.ord.join()===q.items.join())Q.ord=shuffle(q.items);
    body=`<div class="orderlist" id="olist"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="submit">순서 확정</button></div>`;
  }
  const L=LEVELS[Q.l];
  app.innerHTML=`${hudHTML()}
  <div class="card qcard pop">
    <div class="row" style="justify-content:space-between"><span class="qtype">${TYPE_NAME[q.t]}</span>${Q.combo>=2?`<span class="combo">${Q.combo} COMBO</span>`:''}</div>
    ${q.t==='blank'?'':`<p class="qtext">${esc(q.q)}</p>`}
    ${L.timer?`<div class="timer"><i id="tbar" style="width:100%"></i></div>`:''}
    ${body}
    <div class="row" style="margin-top:14px;justify-content:space-between">
      ${['cho','jaeum','calc'].includes(q.t)||q.input?`<button class="btn sm" id="hintbtn">힌트 보기 (−40)</button>`:'<span></span>'}
      <button class="btn sm" id="quit">그만하기</button>
    </div>
    <div id="fb"></div>
  </div>`;
  $('#quit').onclick=()=>endQuiz();
  const hb=$('#hintbtn');if(hb)hb.onclick=()=>{if(Q.hint)return;Q.hint=true;hb.disabled=true;toast('힌트: '+hintFor(q),4000)};
  if(q.t==='cho'||q.t==='jaeum'||q.t==='calc'||q.input){const inp=$('#ans');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')checkInput()};$('#submit').onclick=checkInput}
  $$('.opt').forEach(b=>b.onclick=()=>{if(Q.answered)return;const ok=+b.dataset.i===q.a;b.classList.add(ok?'right':'wrong');if(!ok)$$('.opt').find(x=>+x.dataset.i===q.a).classList.add('right');judge(ok,q.opts[q.a])});
  $$('[data-ox]').forEach(b=>b.onclick=()=>{if(Q.answered)return;const ok=(b.dataset.ox==='1')===q.a;b.style.background=ok?'var(--ok-soft)':'var(--bad-soft)';judge(ok,q.a?'O':'X')});
  if(q.t==='match'){
    $$('[data-l]').forEach(b=>b.onclick=()=>{if(Q.answered||b.classList.contains('done'))return;$$('[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');Q.m.left=b.dataset.l});
    $$('[data-r]').forEach(b=>b.onclick=()=>{if(Q.answered||Q.m.left==null||b.classList.contains('done'))return;
      if(b.dataset.r===Q.m.left){b.classList.add('done');$(`[data-l="${Q.m.left}"]`).classList.add('done');$(`[data-l="${Q.m.left}"]`).classList.remove('sel');Q.m.left=null;Q.m.done++;if(Q.m.done===q.pairs.length)judge(Q.m.miss<2,'')}
      else{Q.m.miss++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(Q.m.miss>=2){judge(false,q.pairs.map(p=>p[0]+' – '+p[1]).join(', '))}}});
  }
  if(q.t==='order'){drawOrder();$('#submit').onclick=()=>{if(Q.answered)return;const ok=Q.ord.join('|')===q.items.join('|');judge(ok,q.items.join(' → '))}}
  if(L.timer){let left=L.timer;const bar=$('#tbar');qTimer=setInterval(()=>{left-=.25;if(bar)bar.style.width=(left/L.timer*100)+'%';if(left<=0){clearInterval(qTimer);if(!Q.answered){toast('시간 초과!');judge(false,answerText(q))}}},250);onLeave(()=>clearInterval(qTimer))}
}
function ansInput(){return `<div class="ansrow"><input id="ans" placeholder="정답을 입력하세요" autocomplete="off"><button class="btn pri" id="submit">제출</button></div>`}
function answerText(q){if(q.t==='cho'||q.t==='jaeum')return q.disp||q.word;if(q.t==='calc')return q.a+' '+(q.unit||'');if(q.input)return q.a[0];if(q.opts)return q.opts[q.a];if(q.t==='ox')return q.a?'O':'X';if(q.items)return q.items.join(' → ');return ''}
function hintFor(q){
  if(q.t==='cho'||q.t==='jaeum'){const w=q.word;return `${w.length}글자, 첫 글자는 "${w[0]}"`}
  if(q.t==='calc')return q.exp.split(/[=→]/)[0].trim()+' … 공식을 떠올려 보세요';
  return `첫 글자는 "${String(q.a[0])[0]}"`;
}
function drawOrder(){
  const el=$('#olist');el.innerHTML=Q.ord.map((t,i)=>`<div class="oi"><span class="n">${i+1}</span><span class="t">${esc(t)}</span><button data-up="${i}" aria-label="위로">▲</button><button data-dn="${i}" aria-label="아래로">▼</button></div>`).join('');
  $$('[data-up]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[Q.ord[i-1],Q.ord[i]]=[Q.ord[i],Q.ord[i-1]];drawOrder()}});
  $$('[data-dn]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;if(i<Q.ord.length-1){[Q.ord[i+1],Q.ord[i]]=[Q.ord[i],Q.ord[i+1]];drawOrder()}});
}
function checkInput(){
  if(Q.answered)return;const q=Q.qs[Q.i];const v=$('#ans').value.trim();if(!v){toast('답을 입력하세요');return}
  let ok;
  if(q.t==='calc'){const n=num(v);ok=!isNaN(n)&&Math.abs(n-q.a)<=q.tol}
  else if(q.input){ok=q.a.some(a=>norm(a)===norm(v))}
  else{const alts=[q.word,q.disp||'',...(q.alt||[])].filter(Boolean);ok=alts.some(a=>norm(a)===norm(v))}
  judge(ok,answerText(q));
}
function judge(ok,ans){
  if(Q.answered)return;Q.answered=true;clearInterval(qTimer);const q=Q.qs[Q.i];
  if(ok){Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);Q.right++;const pts=100+(Q.combo>1?(Q.combo-1)*20:0)-(Q.hint?40:0);Q.score+=pts;
    $('#fb').innerHTML=`<div class="feedback ok pop"><b>정답! +${pts}</b><p style="margin-top:4px">${esc(q.exp)}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="next">${Q.i+1<Q.qs.length?'다음 문제 →':'결과 보기'}</button></div></div>`;}
  else{Q.combo=0;Q.hearts--;Q.wrong.push({q,ans});
    $('#fb').innerHTML=`<div class="feedback bad pop"><b>아쉬워요</b>${ans?`<p style="margin-top:4px">정답: <b style="font-family:var(--fb);font-size:15px;font-weight:700">${esc(ans)}</b></p>`:''}<p style="margin-top:4px">${esc(q.exp)}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="next">${Q.hearts<=0?'결과 보기':(Q.i+1<Q.qs.length?'다음 문제 →':'결과 보기')}</button></div></div>`;
    $$('.heart path')[Q.hearts]?.setAttribute('fill','var(--line)');}
  $('#qscore').textContent=Q.score+'점';
  const n=$('#next');n.focus();n.onclick=()=>{if(Q.hearts<=0||Q.i+1>=Q.qs.length)endQuiz();else{Q.i++;showQ()}};
}
function endQuiz(){
  clearInterval(qTimer);
  const total=Q.qs.length,rate=Q.right/total;
  const rank=Q.hearts<=0?'C':rate>=.9?'S':rate>=.75?'A':rate>=.55?'B':'C';
  const msg={S:'뷰렛이 당신을 알아봅니다. 다음 난이도 도전!',A:'거의 다 왔어요. 오답노트만 한 번 보면 S랭크.',B:'개념의 뼈대는 잡혔어요. 오답노트를 꼭 확인하세요.',C:'괜찮아요. 교과서 79~83쪽과 수업자료를 보고 다시 도전!'}[rank];
  const best=store.get('quizBest',{});if(best[Q.l]==null||Q.score>best[Q.l]){best[Q.l]=Q.score;store.set('quizBest',best)}
  const b2=store.get('best',{});b2.theory=Math.max(b2.theory||0,Q.score);store.set('best',b2);
  record('기초 이론',`${LEVELS[Q.l].sub} · ${LEVELS[Q.l].name}`,Q.score,`정답 ${Q.right}/${total} · ${rank}랭크 · 최대 콤보 ${Q.maxCombo}${Q.hearts<=0?' · 하트 소진':''}${Q.wrong.length?' · 오답: '+Q.wrong.map(w=>TYPE_NAME[w.q.t]).join(', '):''}`);
  const L=LEVELS[Q.l];
  app.innerHTML=`<div class="card pop" style="text-align:center">
    <p class="eyebrow">${L.badge} ${L.name} 결과</p>
    <div class="rank" style="margin-top:10px">${rank}</div>
    <p style="margin-top:8px;font-size:17px">${msg}</p>
    <div class="row" style="justify-content:center;margin-top:14px">
      <span class="pill acc">점수 ${Q.score}</span><span class="pill ok">정답 ${Q.right}/${total}</span><span class="pill">최대 콤보 ${Q.maxCombo}</span>${Q.hearts<=0?'<span class="pill bad">하트 소진</span>':''}
    </div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn pri" id="again">다시 도전</button><button class="btn" data-go="theory">난이도 선택</button>${Q.l<3?`<button class="btn" id="up">다음 난이도 →</button>`:`<button class="btn" data-go="practice">기초 실습으로 →</button>`}</div>
  </div>
  ${Q.wrong.length?`<div class="card" style="margin-top:16px"><h3>오답노트</h3><div class="stack" style="margin-top:10px">${Q.wrong.map(w=>`<div class="panel"><span class="pill">${TYPE_NAME[w.q.t]}</span><p style="margin-top:6px;font-weight:600">${esc(w.q.q)}</p>${w.ans?`<p class="small" style="margin-top:4px">정답: <b>${esc(w.ans)}</b></p>`:''}<p class="small muted" style="margin-top:4px">${esc(w.q.exp)}</p></div>`).join('')}</div></div>`:''}`;
  $('#again').onclick=()=>startQuiz(Q.l);const up=$('#up');if(up)up.onclick=()=>startQuiz(Q.l+1);
}

/* ===== 4. 기초 실습 ===== */
const PTABS=[['tools','실험 기구 도감'],['burette','뷰렛 사용법 · 눈금 읽기'],['pipette','피펫 · 부피 플라스크'],['safety','실습실 안전 수칙'],['naoh','0.1 M NaOH 만들기'],['color','지시약 변색 관찰'],['choose','지시약 선택']];

function nextMission(k){const i=PTABS.findIndex(x=>x[0]===k);const nx=PTABS[i+1];return nx?`<button class="btn pri" id="nextm">다음 미션: ${nx[1]} →</button>`:`<button class="btn pri" data-go="adv">심화 실습으로 →</button>`}

/* 1. 실험 기구 도감 */
const TOOLS=[

 {k:'volpip',n:'홀 피펫',u:'정해진 부피(10 mL, 20 mL)를 정확히 옮긴다. 희석한 식초 20 mL를 삼각 플라스크에 넣을 때 사용. 입으로 빨지 말고 피펫 필러를 끼운다.'},

/* 2. 뷰렛 사용법 · 눈금 읽기 */
function pBurette(el){
  const steps=['뷰렛을 증류수로 깨끗이 씻기','NaOH 용액을 조금 넣어 2~3회 공세척하기','뷰렛을 스탠드에 수직으로 고정하고 꼭지 잠그기','깔때기로 NaOH를 0 눈금 위까지 채우기','깔때기를 빼고 꼭지를 열어 뷰렛 끝의 기포 빼기','메니스커스 아랫면을 0.0 mL 눈금에 맞추기'];
  const newR=()=>Math.round(rnd(5,495))/10;
  const S={ord:shuffle(steps),orderOk:false,reads:0,R:newR(),eye:.6};
  el.innerHTML=`<div class="card"><p class="eyebrow">실습 상황</p><p style="margin-top:6px;font-size:16px"><b>0.1 M 수산화 소듐(NaOH) 표준 용액으로 농도를 모르는 산(식초)을 적정하려고 한다.</b></p>
   <p class="muted" style="margin-top:6px">NaOH는 뷰렛에, 산은 삼각 플라스크에 넣습니다. 적정을 시작하기 전에 뷰렛을 알맞게 준비하고, 눈금을 <b>0.0 mL에 맞춘 뒤</b> 시작해요. 그러면 종말점에서 읽은 눈금이 곧 사용한 NaOH의 부피가 됩니다.</p></div>
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>① 적정을 위한 뷰렛 준비 순서</h3><p class="small muted" style="margin-top:4px">▲▼로 순서를 바꾸고 확인하세요.</p><div class="orderlist" id="bo"></div><div class="row" style="margin-top:10px"><button class="btn pri" id="boc">순서 확인</button></div><div id="bof"></div></div>
   <div class="card"><h3>② 눈금 읽기 3회</h3>
    <div class="note small" style="margin-top:6px">뷰렛 눈금은 <b>위가 0</b>, 아래로 갈수록 커져요. 가장 작은 눈금이 0.1 mL이므로 <b>소수 첫째 자리(0.1 mL)까지</b> 읽습니다. 먼저 눈높이를 수평으로 맞추세요.</div>
    <div class="lens" style="margin-top:12px"><div id="blens"></div>
     <div class="stack" style="flex:1;min-width:180px;gap:8px">
      <label class="small">눈높이 <input type="range" id="eye" min="-1" max="1" step=".05" value="${S.eye}" style="width:100%"></label>
      <span id="eyelab" class="small"></span>
      <div class="ansrow" style="margin-top:0"><input id="brd" inputmode="decimal" placeholder="예: 12.4" style="min-width:100px"><span class="pill">mL</span></div>
      <button class="btn pri" id="bchk">읽은 값 확인</button>
      <span class="pill" id="bcount">0 / 3</span>
     </div></div>
    <div id="bfb"></div></div></div>
   <div class="row" style="margin-top:14px;justify-content:flex-end" id="bnext"></div>`;
  const drawO=()=>{const o=$('#bo',el);o.innerHTML=S.ord.map((t,i)=>`<div class="oi"><span class="n">${i+1}</span><span class="t">${t}</span><button data-u="${i}" aria-label="위로">▲</button><button data-d="${i}" aria-label="아래로">▼</button></div>`).join('');
    $$('[data-u]',o).forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){[S.ord[i-1],S.ord[i]]=[S.ord[i],S.ord[i-1]];drawO()}});
    $$('[data-d]',o).forEach(b=>b.onclick=()=>{const i=+b.dataset.d;if(i<S.ord.length-1){[S.ord[i+1],S.ord[i]]=[S.ord[i],S.ord[i+1]];drawO()}})};
  drawO();
  $('#boc',el).onclick=()=>{S.orderOk=S.ord.join()===steps.join();$('#bof',el).innerHTML=S.orderOk?`<div class="feedback ok pop"><b>정확해요</b><p>공세척을 하지 않으면 남은 증류수 때문에 NaOH가 묽어지고, 기포를 빼지 않으면 부피가 크게 측정돼요. 기포를 뺀 뒤 액면을 0.0 mL에 맞추고 적정을 시작합니다.</p></div>`:`<div class="feedback bad pop"><b>다시 생각해 보세요</b><p>씻기 → 공세척 → 고정·꼭지 잠금 → 채우기 → 깔때기 빼고 기포 제거 → 0 눈금 맞추기</p></div>`;check()};
  const draw=()=>{$('#blens',el).innerHTML=lensSVG(S.R,{eye:S.eye});const lv=Math.abs(S.eye)<.08;$('#eyelab',el).innerHTML=lv?'<span class="pill ok">눈높이 수평 ✓</span>':`<span class="pill warn">눈이 ${S.eye>0?'아래':'위'}에 있어요 → 시차 발생</span>`};
  draw();
  $('#eye',el).oninput=e=>{S.eye=+e.target.value;draw()};
  $('#bchk',el).onclick=()=>{const raw=$('#brd',el).value.trim();const v=num(raw);if(isNaN(v)){toast('숫자로 입력하세요');return}
    if(Math.abs(S.eye)>=.08){$('#bfb',el).innerHTML=`<div class="feedback bad pop"><b>눈높이부터!</b><p>눈이 메니스커스보다 ${S.eye>0?'아래':'위'}에 있으면 실제보다 ${S.eye>0?'크게':'작게'} 읽혀요. 슬라이더를 가운데(수평)로 맞춘 뒤 읽으세요.</p></div>`;return}
    const ok=Math.abs(v-S.R)<=.051;const decOk=/\.\d$/.test(raw);
    if(ok&&decOk){S.reads++;$('#bfb',el).innerHTML=`<div class="feedback ok pop"><b>정확! (${fx(S.R,1)} mL)</b><p>메니스커스 아랫면 기준, 소수 첫째 자리까지 읽었어요.</p></div>`;$('#bcount',el).textContent=`${S.reads} / 3`;
      S.R=newR();S.eye=pk([-.7,.6,.9,-.4]);$('#eye',el).value=S.eye;$('#brd',el).value='';setTimeout(draw,900);check()}
    else $('#bfb',el).innerHTML=`<div class="feedback bad pop"><b>아쉬워요</b><p>${!decOk?'소수 첫째 자리까지(예: 12.4) 적어야 해요. ':''}${ok?'':`정답은 ${fx(S.R,1)} mL. 큰 눈금(1 mL) → 작은 눈금(0.1 mL) 순으로 세어 보세요.`}</p></div>`};
  function check(){if(S.orderOk&&S.reads>=3){markDone('burette');$('#bnext',el).innerHTML=nextMission('burette');bindNext(el,'burette')}}
}

/* 3. 피펫 필러 · 부피 플라스크 */
function fillerSVG(o={}){
  const {flat=false,act='',level=0,where='',residual=false}=o;
  const hl=k=>act===k?'var(--accent)':'#2b2b2b';
  const mark=.72;const top=270,bot=470;const ly=bot-(bot-top)*level;
  return `<svg viewBox="0 0 310 480" width="100%" style="max-width:290px" role="img" aria-label="피펫 필러와 홀 피펫">
   <text x="155" y="14" text-anchor="middle" font-size="12" fill="var(--muted)">${where==='sample'?'피펫 끝: 시료(식초) 속':where==='flask'?'피펫 끝: 삼각 플라스크 벽':'피펫 끝: 공기 중'}</text>
   <rect x="112" y="26" width="36" height="22" rx="5" fill="${hl('A')}"/><text x="130" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">A</text>
   <text x="160" y="42" font-size="11" fill="${INK}">Air · 공기 빼기</text>
   ${flat?`<ellipse cx="130" cy="96" rx="60" ry="26" fill="#C8373B"/>`:`<circle cx="130" cy="98" r="48" fill="#C8373B"/>`}
   <text x="130" y="102" text-anchor="middle" font-size="11" fill="#fff">${flat?'쭈그러짐':'고무구'}</text>
   <rect x="116" y="146" width="28" height="84" rx="4" fill="#C8373B"/>
   <rect x="112" y="160" width="36" height="22" rx="5" fill="${hl('S')}"/><text x="130" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">S</text>
   <text x="106" y="176" text-anchor="end" font-size="11" fill="${INK}">Suction · 빨아올리기</text>
   <rect x="144" y="200" width="46" height="14" rx="3" fill="#C8373B"/>
   <rect x="150" y="192" width="30" height="30" rx="5" fill="${hl('E')}"/><text x="165" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">E</text>
   <circle cx="206" cy="207" r="14" fill="${act==='EB'?'var(--accent)':'#C8373B'}"/><text x="206" y="211" text-anchor="middle" font-size="9" fill="#fff">작은구</text>
   <circle cx="192" cy="222" r="4" fill="${act==='EB'?'var(--accent)':'#fff'}" stroke="${INK}"/><path d="M196 226 L214 244" stroke="var(--muted)"/><text x="200" y="258" font-size="10" fill="${INK}">E 옆 구멍</text>
   <text x="224" y="211" font-size="11" fill="${INK}">Empty · 내보내기</text>
   <rect x="120" y="230" width="20" height="14" fill="#555"/>
   <path d="M126 244 V470 L130 478 L134 470 V244" fill="rgba(200,225,240,.25)" stroke="${INK}" stroke-width="1.5"/>
   <path d="M127 ${Math.max(ly,246)} V470 L130 476 L133 470 V${Math.max(ly,246)}Z" fill="${level>0?'rgba(230,190,120,.8)':'none'}"/>
   ${residual?`<circle cx="130" cy="474" r="3" fill="rgba(230,190,120,.9)"/>`:''}
   <line x1="120" x2="140" y1="${bot-(bot-top)*mark}" y2="${bot-(bot-top)*mark}" stroke="var(--accent)" stroke-width="2.5"/><text x="144" y="${bot-(bot-top)*mark+4}" font-size="11" fill="var(--accent)">표선</text>
  </svg>`;
}
function pPipette(el){
  const FN=[['A','Air — 누른 채 고무구를 쥐어 공기를 빼낸다'],['S','Suction — 누르면 용액이 피펫으로 빨려 올라온다'],['E','Empty — 누르면 용액이 흘러나온다']];
  const FOPTS=['Air — 누른 채 고무구를 쥐어 공기를 빼낸다','Suction — 누르면 용액이 피펫으로 빨려 올라온다','Empty — 누르면 용액이 흘러나온다','Seal — 누르면 피펫이 필러에서 빠진다'];
  const S={fnOk:false,flat:false,level:0,where:'air',act:'',stage:0,residual:false,simOk:false,L:.55,done2:false,over:false};
  const MARK=.72;
  const TASKS=['A를 누른 채 고무구를 쥐어 공기 빼기','피펫 끝을 식초에 담그고 S를 눌러 표선 위까지 빨아올리기','E를 살짝 눌러 메니스커스 아랫면을 표선에 맞추기','삼각 플라스크로 옮겨 E를 눌러 용액 내보내기','E 옆 구멍을 막고 작은 고무구를 눌러 끝에 남은 용액 밀어내기'];
  el.innerHTML=`<div class="card"><p class="eyebrow">왜 중요할까?</p><p style="margin-top:6px">시약은 <b>절대 입으로 빨아올리지 않아요.</b> 홀 피펫에는 반드시 <b>피펫 필러(안전 필러)</b>를 끼워 A · S · E 세 밸브로 조작합니다. 식초 20 mL를 삼각 플라스크에 옮기는 과정으로 연습해 봐요.</p></div>
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>① A · S · E 밸브의 기능</h3>
    <div class="stack" style="margin-top:10px">${FN.map(([k])=>`<label class="row" style="gap:10px;align-items:center"><span class="pill acc" style="font-size:16px;min-width:40px;justify-content:center">${k}</span><select data-fn="${k}" style="flex:1"><option value="">— 기능 선택 —</option>${FOPTS.map(o=>`<option>${o}</option>`).join('')}</select></label>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn pri sm" id="fnc">확인</button></div><div id="fnf"></div>
    <h3 style="margin-top:18px">② 필러로 식초 20 mL 옮기기</h3>
    <ol class="steps" id="ftask" style="margin-top:8px;padding:0;list-style:none"></ol>
    <div class="row" style="margin-top:10px;gap:6px">
     <button class="btn sm" id="fa">A 누르고 고무구 쥐기</button>
     <button class="btn sm holdbtn" id="fs">S 누르기 (누르고 있기)</button>
     <button class="btn sm holdbtn" id="fe">E 누르기 (누르고 있기)</button>
     <button class="btn sm" id="feb">E 옆 구멍 막고 작은 고무구 누르기</button>
    </div>
    <div class="row" style="margin-top:6px;gap:6px"><button class="btn sm glass" id="wsample">피펫 끝을 식초에 담그기</button><button class="btn sm glass" id="wflask">삼각 플라스크로 옮기기</button></div>
    <div id="ff" style="margin-top:8px"></div></div>
   <div class="card" style="display:flex;flex-direction:column;align-items:center"><div id="fsvg" style="width:100%;display:flex;justify-content:center"></div><p class="small muted" id="flv" style="margin-top:6px"></p></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>③ 부피 플라스크 표선 맞추기</h3><p class="small muted" style="margin-top:4px">1 L 부피 플라스크에 녹인 NaOH가 들어 있어요. 세척병으로 채우다가, 표선 가까이에서는 스포이트로 한 방울씩! 메니스커스 아랫면이 표선에 닿으면 완료.</p>
    <div class="row" style="margin-top:10px;align-items:center;justify-content:center"><div id="fl"></div><div id="fzoom"></div></div>
    <div class="row" style="margin-top:10px"><button class="btn holdbtn" id="fill">세척병으로 채우기 (누르고 있기)</button><button class="btn" id="drop">스포이트 한 방울</button><button class="btn pri" id="fok">표선 완료</button></div>
    <div id="ffb"></div></div><div class="row" style="margin-top:14px;justify-content:flex-end" id="pnext"></div>`;
  $('#fnc',el).onclick=()=>{const bad=FN.filter(([k,t])=>$(`[data-fn="${k}"]`,el).value!==t);S.fnOk=!bad.length;$('#fnf',el).innerHTML=S.fnOk?`<div class="feedback ok pop"><b>정답!</b><p>A(Air) 공기 빼기 → S(Suction) 빨아올리기 → E(Empty) 내보내기. E 옆의 작은 구멍을 막고 작은 고무구를 누르면 피펫 끝에 남은 용액까지 밀어낼 수 있어요.</p></div>`:`<div class="feedback bad pop"><p>${bad.map(b=>b[0]).join(', ')} 밸브를 다시 생각해 보세요.</p></div>`;chk()};
  const fb=(t,ok)=>{$('#ff',el).innerHTML=`<div class="feedback ${ok?'ok':'bad'} pop"><p>${t}</p></div>`};
  const draw=()=>{$('#fsvg',el).innerHTML=fillerSVG({flat:S.flat,act:S.act,level:S.level,where:S.where,residual:S.residual});
    $('#ftask',el).innerHTML=TASKS.map((t,i)=>`<li class="stp ${i<S.stage?'done':i===S.stage?'cur':''}">${t}</li>`).join('');
    const d=(S.level-MARK)*20/MARK;$('#flv',el).textContent=S.level>0?`피펫 속 용액: ${(S.level/MARK*20).toFixed(1)} mL (표선 = 20.0 mL)`:'피펫이 비어 있어요'};
  draw();
  const flashAct=k=>{S.act=k;draw();setTimeout(()=>{if(S.act===k){S.act='';draw()}},500)};
  $('#fa',el).onclick=()=>{flashAct('A');if(S.level>0.02&&S.stage>=1){fb('용액이 들어 있을 때 A를 누르면 안 돼요. 공기 빼기는 맨 처음에!',false);return}S.flat=true;if(S.stage===0){S.stage=1;fb('고무구가 쭈그러졌어요. 이제 피펫 끝을 식초에 담그고 S를 누르세요.',true)}draw()};
  holdButton($('#fs',el),()=>{S.act='S';
    if(!S.flat){fb('고무구에 공기가 차 있어 빨아올릴 수 없어요. 먼저 A로 공기를 빼세요.',false);draw();return}
    if(S.where!=='sample'){fb('피펫 끝이 시료에 담겨 있지 않아 공기만 빨려 들어가요.',false);draw();return}
    S.level=Math.min(.95,S.level+.03);if(S.level>=.95){S.flat=false}
    if(S.stage===1&&S.level>MARK+.02){S.stage=2;fb('표선 위까지 올라왔어요. E를 살짝 눌러 표선에 맞추세요.',true)}draw()},110);
  holdButton($('#fe',el),()=>{S.act='E';if(S.level<=0){draw();return}
    if(S.stage===2){S.level=Math.max(0,S.level-.004);if(S.level<MARK-.012){fb('표선 아래로 내려갔어요! 다시 S로 빨아올려 맞추세요.',false);S.stage=1}}
    else if(S.stage===3){if(S.where!=='flask'){fb('삼각 플라스크로 옮긴 뒤에 내보내세요.',false)}else{S.level=Math.max(.02,S.level-.05);if(S.level<=.02){S.residual=true;S.level=0;S.stage=4;fb('피펫 끝에 용액이 조금 남았어요. E 옆 구멍을 막고 작은 고무구를 누르세요.',true)}}}
    else S.level=Math.max(0,S.level-.02);
    draw()},110);
  ['pointerup','pointerleave','keyup'].forEach(ev=>{$('#fe',el).addEventListener(ev,()=>{S.act='';if(S.stage===2&&Math.abs(S.level-MARK)<=.012&&S.where==='sample'){S.stage=3;fb('표선에 딱 맞았어요! 삼각 플라스크로 옮겨 E를 눌러 내보내세요.',true)}draw()});$('#fs',el).addEventListener(ev,()=>{S.act='';draw()})});
  $('#feb',el).onclick=()=>{flashAct('EB');if(S.stage===4&&S.residual){S.residual=false;S.stage=5;S.simOk=true;fb('완료! 피펫 끝에 남은 용액까지 모두 옮겼어요. 식초 20.0 mL가 정확히 들어갔습니다.',true);chk()}else fb('끝에 남은 용액을 밀어낼 때 쓰는 방법이에요. 아직은 필요 없어요.',false);draw()};
  $('#wsample',el).onclick=()=>{S.where='sample';draw()};
  $('#wflask',el).onclick=()=>{if(S.stage===2){fb('아직 표선을 맞추지 않았어요.',false);return}S.where='flask';draw()};
  // 부피 플라스크
  const neckZoom=()=>{const px=900,cy=80,y=cy-(S.L-1)*px;return `<svg viewBox="0 0 160 160" width="150" height="150"><defs><clipPath id="nz"><circle cx="80" cy="80" r="77"/></clipPath></defs><g clip-path="url(#nz)"><rect width="160" height="160" fill="var(--surface)"/><path d="M50 ${y-7} Q80 ${y+7} 110 ${y-7} V170 H50Z" fill="rgba(160,200,230,.55)"/><path d="M50 ${y-7} Q80 ${y+7} 110 ${y-7}" fill="none" stroke="${INK}" stroke-width="1.5"/><line x1="40" x2="120" y1="${cy}" y2="${cy}" stroke="var(--accent)" stroke-width="2.5"/><text x="122" y="${cy-4}" font-size="11" fill="var(--accent)">표선</text><line x1="50" x2="50" y1="0" y2="160" stroke="${INK}" stroke-width="2.4"/><line x1="110" x2="110" y1="0" y2="160" stroke="${INK}" stroke-width="2.4"/></g><circle cx="80" cy="80" r="77" fill="none" stroke="${INK}" stroke-width="4"/></svg>`};
  const drawF=()=>{$('#fl',el).innerHTML=flaskSVG({level:S.L,vol:'1 L',w:110,h:175});$('#fzoom',el).innerHTML=S.L>.9?neckZoom():'<p class="small muted" style="width:150px">표선 근처에 오면 확대경이 켜져요</p>'};
  drawF();

/* 5. 0.1 M NaOH 만들기 — 저울 */
function balanceWidget(host,o){
  // o: {target, tol, onDone(m, info)}

   <div class="row" style="justify-content:center;gap:6px">

  const disp=()=>(S.paper?PAPER:0)+S.naoh-S.tare;
  const draw=()=>{if(S.naoh>0&&!S.done){S.naoh+=.0006}$('#bl',host).textContent=disp().toFixed(2)+' g';
    $('#bp',host).innerHTML=(S.paper?`<path d="M60 28 L100 18 L140 28 Z" fill="#fff" stroke="#888"/>`:'')+(S.naoh>0?`<ellipse cx="100" cy="24" rx="${6+Math.min(18,S.naoh*4)}" ry="${2+Math.min(5,S.naoh)}" fill="#f4f4f4" stroke="#aaa"/>`:'')};
  const tick=setInterval(draw,200);onLeave(()=>clearInterval(tick));draw();

  const add=d=>{if(!S.paper){toast('저울 접시에 바로 시약을 올리면 안 돼요. 시약포지부터!');return}if(S.done)return;S.naoh=Math.max(0,S.naoh+d);draw()};
  $('#b_b',host).onclick=()=>add(rnd(.5,.9));$('#b_s',host).onclick=()=>add(rnd(.02,.07));$('#b_r',host).onclick=()=>add(-rnd(.05,.15));
  $('#b_ok',host).onclick=()=>{if(S.done)return;const m=S.naoh,shown=disp();const tared=Math.abs(S.tare-(S.paper?PAPER:0))<1e-9&&S.paper;
    if(!S.paper||m<=0){toast('NaOH를 먼저 올리세요');return}
    if(!tared){$('#bfb',host).innerHTML=`<div class="feedback bad pop"><b>영점을 안 맞췄어요!</b><p>화면 ${shown.toFixed(2)} g에는 시약포지 무게(${PAPER.toFixed(2)} g)가 포함돼 있어요. 실제 NaOH는 ${m.toFixed(2)} g뿐. 시약을 덜어 내고 다시 해 보세요.</p><button class="btn sm" id="bre" style="margin-top:6px">처음부터</button></div>`;$('#bre',host).onclick=()=>balanceWidget(host,o);return}
    if(Math.abs(m-o.target)>o.tol){$('#bfb',host).innerHTML=`<div class="feedback bad pop"><b>${m<o.target?'모자라요':'너무 많아요'} (${m.toFixed(2)} g)</b><p>목표 ${o.target.toFixed(2)} g ± ${o.tol} g. NaOH는 공기 중 수분을 흡수해 계속 무거워지니 빨리!</p></div>`;return}
    S.done=true;o.onDone&&o.onDone(+m.toFixed(2),{})};
}

  function chk(){if(S.calc&&S.weigh&&S.ordOk){markDone('naoh');$('#nnext',el).innerHTML=nextMission('naoh');bindNext(el,'naoh')}}

/* 7. 지시약 선택 */

    const colOpts=['무색 → 옅은 분홍색','붉은색 → 무색','빨간색 → 주황색','노란색 → 주황색','노란색 → 초록색','파란색 → 초록색','붉은색 → 보라색','푸른색 → 보라색'];
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${i+1}. ${c.lab}</h3><span class="pill acc">${c.t}</span></div>
     <p class="small muted" style="margin-top:4px">반응식: ${c.sc.eq} · 생성된 염: ${c.sc.salt} · 중화점 pH ${c.sc.eqpH}</p>
     <div style="margin-top:8px">${curveSVG({sc:c.sc,Ca:c.Ca,Ct:.1,ind,W:600,H:260,marks:ind?[{v:vIndicator(c.sc,c.Ca,20,.1,ind),label:'종말점'}]:[]})}</div>
     <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px">${IND_ORDER.map(k=>`<button class="indbottle ${s.ind===k?'sel':''}" data-ci="${i}" data-k="${k}"><b>${IND[k].n}</b><span class="small muted">pH ${IND[k].range[0]} ~ ${IND[k].range[1]}</span><span><span class="swatch" style="background:${indRGBA(IND[k],1)}"></span> → <span class="swatch" style="background:${indRGBA(IND[k],13)}"></span></span></button>`).join('')}</div>
     ${j?`<div class="feedback ${j.ok?'ok':'bad'} pop"><b>${j.ok?'알맞은 지시약':'부적합'}</b><p>${j.why}</p></div>`:''}
     ${s.ok?`<label class="stack" style="gap:4px;margin-top:10px"><b class="small">이 지시약의 종말점 색 변화는? (시료에 적정액을 넣어 갈 때)</b><select data-col="${i}"><option value="">— 선택 —</option>${colOpts.map(o=>`<option ${s.col===o?'selected':''}>${o}</option>`).join('')}</select></label>${s.col?`<div class="feedback ${s.colOk?'ok':'bad'} pop"><p>${s.colOk?'정답! 이 색이 되어 흔들어도 유지되면 꼭지를 잠가요.':'다시 생각해 보세요. 처음 용액의 액성에서의 색 → 변색 범위 가운데 색'}</p></div>`:''}`:''}
    </div>`}).join('');
    $$('[data-ci]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.ci;const s=S[i];s.ind=b.dataset.k;s.ok=judgeIndicator(CASES[i].sc,IND[s.ind]).ok;s.col=null;s.colOk=false;draw()});
    $$('[data-col]',el).forEach(sel=>sel.onchange=()=>{const i=+sel.dataset.col;const s=S[i];s.col=sel.value;s.colOk=sel.value===endChange(CASES[i].sc,IND[s.ind]);draw()});
    if(S.every(s=>s.ok&&s.colOk)&&!S.fin){S.fin=1;markDone('choose');$('#chnext',el).innerHTML=nextMission('choose')}

      ${erlenSVG(indRGBA(IND.pp,8.7,.55),.45,90,110)}

    <div class="row" style="margin-top:10px">${sc.analyte==='acid'?`<label class="small">산(${sc.aShort})의 가수 n <select id="na"><option></option><option>1</option><option>2</option><option>3</option></select></label><label class="small">염기(NaOH)의 가수 n′ <select id="nb"><option></option><option>1</option><option>2</option><option>3</option></select></label>`:`<label class="small">염기(NH₃)가 받는 H⁺ 수 n <select id="na"><option></option><option>1</option><option>2</option><option>3</option></select></label><label class="small">산(HCl)의 가수 n′ <select id="nb"><option></option><option>1</option><option>2</option><option>3</option></select></label>`}</div>

/* 공통-3: 지시약 선택 (핵심) */

     <div class="row" style="gap:8px"><div style="width:44px">${TOOLSVG.dropper.replace('PP',k.toUpperCase().slice(0,3)).replace('rgba(228,32,140,.08)',indRGBA(d,k==='pp'?12:7,.3))}</div><div><b>${d.n}</b><br><span class="small muted mono">pH ${d.range[0]} ~ ${d.range[1]}</span></div></div>

/* 공통-4: 뷰렛 준비 */
function aBur(el){

  const NO=['증류수로 헹군 뒤 물기가 남은 채로 바로 채운다','깔때기를 꽂아 둔 채로 적정한다','뷰렛을 눈높이보다 높은 곳에 두고 위에서 붓는다','액면이 0 눈금보다 위에 있는 채로 적정을 시작한다'];
  const S=A.bur||(A.bur={sel:{},items:shuffle(OK.concat(NO)),tries:0,ok:false});
  el.innerHTML=`<div class="card"><h3>뷰렛 준비 — 올바른 행동만 고르세요</h3><p class="small muted" style="margin-top:4px">뷰렛에 넣을 용액: <b>${A.stage===1?`NaOH ${A.Ct.toFixed(4)} M`:A.sc.titrant}</b></p>
   <div class="stack" style="margin-top:10px;gap:8px">${S.items.map(t=>`<button class="sortcard ${S.sel[t]?(S.ok&&!OK.includes(t)?'risk':'safe'):''}" data-t="${esc(t)}"><span>${t}</span><span class="tag2 pill ${S.sel[t]?'ok':''}">${S.sel[t]?'할 일':'—'}</span></button>`).join('')}</div>
   <div class="row" style="margin-top:10px"><button class="btn pri sm" id="burc">확인</button></div><div id="burf">${S.ok?`<div class="feedback ok"><b>뷰렛 준비 완료</b><p>뷰렛 눈금이 0.0 mL에서 시작하므로, 종말점에서 읽은 눈금이 곧 사용한 부피예요. 삼각 플라스크 아래에 흰 종이를 깔면 색 변화가 잘 보여요.</p></div>`:''}</div></div>
   ${nextBtn('다음: 적정 시작',S.ok,'올바른 행동 5가지를 고르세요')}`;
  $$('[data-t]',el).forEach(b=>b.onclick=()=>{if(S.ok)return;const t=b.dataset.t;S.sel[t]=!S.sel[t];aBur(el)});
  $('#burc',el).onclick=()=>{if(S.ok)return;S.tries++;const sel=S.items.filter(t=>S.sel[t]);const miss=OK.filter(t=>!sel.includes(t)),bad=sel.filter(t=>NO.includes(t));
    if(!miss.length&&!bad.length){S.ok=true;A.pts.prep4=S.tries===1?1:.5;aBur(el)}else $('#burf',el).innerHTML=`<div class="feedback bad pop"><p>${miss.length?`빠진 행동 ${miss.length}개. `:''}${bad.length?`잘못된 행동: ${bad.join(' / ')}`:''}</p></div>`};
  bindNextA(el);
}

/* 공통-5: 적정 3회 */

   ${doneAll?'':`<p class="small muted" style="margin-top:4px">${A.trials.length===0?'1회차는 종말점 위치를 알아보는 예비 적정이에요. 대략적인 부피를 알면 2·3회차에서는 그 근처까지 빠르게 넣고, 가까워지면 한 방울씩!':'앞 회차의 부피를 참고해, 종말점 1~2 mL 전부터는 한 방울씩 넣으세요.'}</p>`}
   <div id="tbody" style="margin-top:12px"></div></div>
   <div class="card" style="margin-top:14px"><h3>측정 기록</h3><div class="tw" style="margin-top:8px"><table class="table"><tr><th>회차</th><th>사용한 ${sc.tShort} 부피 (mL)</th></tr>
    ${[0,1,2].map(i=>{const t=A.trials[i];return `<tr><td>${i+1}${i===0?' (예비)':''}</td><td class="mono">${t?fx(t.rf,1):'—'}</td></tr>`}).join('')}
    <tr><td><b>평균</b></td><td class="mono"><b>${A.trials.length?fx(A.trials.reduce((a,t)=>a+t.rf,0)/A.trials.length,2):'—'}</b></td></tr></table><p class="small muted" style="margin-top:6px">매 회 뷰렛을 0.0 mL에 맞추고 시작하므로, 종말점의 눈금 = 사용한 부피입니다.</p></div></div>
   ${nextBtn('다음: 결과 계산',doneAll,'3회 적정을 마치세요')}`;
  bindNextA(el);

      else $('#rdf',tb).innerHTML=`<div class="feedback bad pop"><p>다시 읽어 보세요. 큰 눈금(1 mL) → 작은 눈금(0.1 mL) 순으로 세어 보세요. (기회 1번 더)</p></div>`};

    tb.innerHTML=`<div class="tbench"><div class="scene" id="scn"></div>
     <div class="ctrl">
      <div class="row" style="gap:12px;align-items:flex-start;flex-wrap:wrap"><div style="text-align:center"><div id="fzm"></div><span class="small muted">플라스크 색 (흰 종이 위)</span></div><div style="text-align:center"><div id="live"></div><span class="small muted">뷰렛 눈금 (0.0에서 시작)</span></div></div>
      <div class="row"><button class="btn holdbtn" id="open">꼭지 열기 (누르고 있기)</button><button class="btn" id="d1">한 방울 (0.05 mL)</button></div>
      <div class="row"><button class="btn" id="d2">반 방울 — 벽에 묻혀 씻어 넣기</button><button class="btn glass" id="sw">플라스크 흔들기</button></div>
      <label class="small row" style="gap:6px"><input type="checkbox" id="auto" checked> 넣을 때마다 자동으로 흔들기</label>
      <button class="btn pri" id="stop">종말점! 꼭지 잠그고 눈금 읽기</button>
      <div class="note small">${ind.k==='pp'?'NaOH를 떨어뜨리면 떨어진 자리가 <b>순간 분홍색</b>으로 변했다가 흔들면 사라져요. 종말점에 가까울수록 분홍색이 오래 남아요. <b>흔들어도 옅은 분홍색이 사라지지 않는 순간</b>이 종말점! 바로 꼭지를 잠그세요.':`떨어진 자리의 색이 순간 변했다가 흔들면 돌아와요. 흔들어도 용액 전체가 <b>${ind.endName}</b>으로 유지되는 순간이 종말점!`}</div>
     </div></div>`;
    const auto=$('#auto',tb);
    const pH=()=>pHat(sc,Ca,Va,Ct,T.V);
    const drawS=()=>{const bulk=indRGBA(ind,pH(),.8);$('#fzm',tb).innerHTML=flaskZoomSVG(bulk,st.flash,st.flashCol,st.swirl);$('#scn',tb).innerHTML=sceneSVG({R:T.R0+T.V,open:st.open,flaskVol:20+T.V+(A.stage===1?0:0),bulk,flash:st.flash,flashCol:st.flashCol,drops:st.drops,swirl:st.swirl,titrantCol:tcol});
      $('#live',tb).innerHTML=lensSVG(T.R0+T.V,{size:120})};
    const addV=dv=>{if(T.R0+T.V+dv>50){toast('뷰렛이 비었어요! 종말점을 한참 지나쳤을 거예요.');return}
      T.V+=dv;const far=Math.min(1,Math.abs(veq-T.V)/veq*8);
      const tipCol=indRGBA(ind,sc.analyte==='acid'?12.5:1.5,.85);
      st.flashCol=tipCol;st.flash=Math.min(1,st.flash+.8);st.decay=.015+.1*far;st.drops.push(345);
      if(auto.checked)st.sw=6};
    const loop=setInterval(()=>{
      if(st.open)addV(.1);
      st.drops=st.drops.map(y=>y+14).filter(y=>y<420);
      if(st.sw>0){st.sw--;st.swirl=Math.sin(st.sw*1.4)*6;st.flash=Math.max(0,st.flash-st.decay*3.2)}else{st.swirl=0;st.flash=Math.max(0,st.flash-st.decay*.35)}
      drawS();
      
    },100);
    onLeave(()=>clearInterval(loop));drawS();
    holdButton($('#open',tb),()=>{st.open=true},100);
    ['pointerup','pointerleave','pointercancel','keyup'].forEach(ev=>$('#open',tb).addEventListener(ev,()=>{st.open=false}));
    $('#d1',tb).onclick=()=>addV(.05);$('#d2',tb).onclick=()=>addV(.025);
    $('#sw',tb).onclick=()=>{st.sw=8};
    $('#stop',tb).onclick=()=>{if(T.V<.2){toast('아직 거의 넣지 않았어요');return}st.open=false;clearInterval(loop);T.phase='readFinal';T.col=indName(ind,pH());T.pHend=pH();readUI('f')};
  };
  const finishTrial=()=>{T.err=T.V-veq;A.trials.push(T);A.cur=null;
    const e=T.err;const msg=Math.abs(e)<=.06?'완벽한 종말점!':e<0?`중화점보다 ${fx(-e)} mL 먼저 멈췄어요`:`중화점을 ${fx(e)} mL 지나쳤어요`;
    tb.innerHTML=`<div class="feedback ${Math.abs(e)<=.12?'ok':'bad'} pop"><b>${A.trials.length}회차 기록: ${fx(T.rf,1)} mL</b><p>멈췄을 때 색: <b>${T.col}</b>. ${A.trials.length===1?'예비 적정 결과를 참고해 다음 회차에서는 더 정확하게!':''}</p>
     <p class="small muted" style="margin-top:4px">종말점 판단은 보고서 제출 후 채점에서 공개돼요.</p>
     <div class="row" style="margin-top:10px"><button class="btn pri" id="nt">${A.trials.length<3?`새 삼각 플라스크로 ${A.trials.length+1}회차 →`:'측정 기록 정리 →'}</button></div></div>`;
    void msg;
    $('#nt',tb).onclick=()=>aTit(el);
  };
  if(T.phase==='titrate')titUI();else readUI('f');
}

/* 공통-6: 결과 계산 */
function aCalc(el){
  const sc=A.sc,st1=A.stage===1;const S=A.calc||(A.calc={inc:[true,true,true],in:{},chk:{},tries:0,ok:false});
  const vols=A.trials.map(t=>+t.rf.toFixed(1));
  const incV=vols.filter((v,i)=>S.inc[i]);const vbar=incV.length?incV.reduce((a,b)=>a+b,0)/incV.length:NaN;
  const Ct=A.Ct;
  const rows=st1?[
    ['m1','희석한 식초의 몰 농도 = M(NaOH) × V̄ ÷ 20.00 mL','M',u=>Ct*u.vbar/20,.005,true],
    ['m0','원래 식초의 몰 농도 = 희석 농도 × 10','M',u=>u.m1*10,.005,true],
    ['pct','아세트산 함량 = 몰 농도 × 60.05 g/mol ÷ 10 (g/100 mL, %)','%',u=>u.m0*60.05/10,.01,true]]
   :[['mol','넣은 적정액의 몰 수 = 0.1000 M × V̄ ÷ 1000','mol',u=>.1*u.vbar/1000,.006,true],
    ['m0',sc.analyte==='acid'?`시료의 몰 농도 = (${sc.nb} × 몰 수) ÷ (${sc.na} × 0.02000 L)`:'시료의 몰 농도 = 몰 수 ÷ 0.02000 L','M',u=>u.mol*sc.nb/sc.na/.02,.005,true]];
  el.innerHTML=`<div class="card"><h3>측정값 정리</h3><div class="tw" style="margin-top:8px"><table class="table"><tr><th>평균에 포함</th><th>회차</th><th>사용한 ${sc.tShort} 부피 (mL)</th></tr>
   ${A.trials.map((t,i)=>`<tr><td><input type="checkbox" data-inc="${i}" ${S.inc[i]?'checked':''} ${S.ok?'disabled':''}></td><td>${i+1}${i===0?' (예비)':''}</td><td class="mono">${fx(vols[i],1)}</td></tr>`).join('')}
   <tr><td></td><td><b>평균 V̄</b></td><td class="mono"><b>${fx(vbar,2)}</b></td></tr></table></div>
   <p class="small muted" style="margin-top:6px">값이 크게 벗어난 회차(특히 예비 적정)는 평균에서 뺄 수 있어요. 최소 2회는 포함해야 합니다.</p></div>
   <div class="card" style="margin-top:14px"><h3>계산</h3>
    <div class="panel small" style="margin-top:8px">${st1?`주어진 값: M(NaOH) = <b class="mono">${Ct.toFixed(4)} M</b> (NaOH ${A.mNaOH.toFixed(2)} g / 1 L) · 희석한 식초 20.00 mL · 식초 10배 희석 · CH₃COOH 60.05 g/mol<br>관계식: M(CH₃COOH) × V(CH₃COOH) = M(NaOH) × V(NaOH) (1가 산 + 1가 염기)`:`주어진 값: ${sc.titrant} · 시료 20.00 mL<br>관계식: n·M·V = n′·M′·V′ → ${sc.analyte==='acid'?`${sc.na} × M × 20.00 = ${sc.nb} × 0.1000 × V̄`:`M × 20.00 = 0.1000 × V̄`}`}</div>
    ${rows.map(r=>`<div class="calcrow"><span>${r[1]}</span><input data-in="${r[0]}" inputmode="decimal" value="${esc(S.in[r[0]]??'')}" ${S.ok?'disabled':''} placeholder="${r[0]==='mol'?'예: 0.001635':'값'}"><span class="small">${r[2]} ${S.chk[r[0]]==null?'':S.chk[r[0]]?'<span class="flag" style="color:var(--ok)">✓</span>':'<span class="flag" style="color:var(--bad)">✗</span>'}</span></div>`).join('')}
    <p class="small muted" style="margin-top:8px">평균 부피 V̄ = <b>${fx(vbar,2)} mL</b>를 사용하세요. 몰 농도는 소수 넷째 자리 정도로 적으세요. 앞 칸에 적은 내 값으로 다음 칸을 계산하면 됩니다.</p>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="cc" ${S.ok?'disabled':''}>계산 확인</button></div><div id="cf">${S.ok?`<div class="feedback ok"><b>계산 완료</b><p>${st1?`원래 식초: ${S.in.m0} M · 아세트산 함량 ${S.in.pct} %`:`${sc.aShort} 농도: ${S.in.m0} M`}</p></div>`:''}</div></div>
   ${nextBtn('다음: 결과 보고서',S.ok,'계산을 모두 맞히세요')}`;
  $$('[data-inc]',el).forEach(c=>c.onchange=()=>{S.inc[+c.dataset.inc]=c.checked;if(S.inc.filter(Boolean).length<2){S.inc[+c.dataset.inc]=true;toast('최소 2회는 포함해야 해요')}S.chk={};aCalc(el)});
  $$('[data-in]',el).forEach(i=>i.oninput=()=>{S.in[i.dataset.in]=i.value});
  $('#cc',el).onclick=()=>{S.tries++;const u={vbar:+fx(vbar,2)};S.in.vbar=fx(vbar,2);let all=true;
    for(const r of rows){const v=num(S.in[r[0]]);const exp=r[3](u);let ok;
      if(isNaN(v)||isNaN(exp)){ok=false}else ok=r[5]?Math.abs(v-exp)<=Math.abs(exp)*r[4]+1e-9:Math.abs(v-exp)<=r[4];
      S.chk[r[0]]=ok;u[r[0]]=isNaN(v)?exp:v;if(!ok)all=false}
    if(all){S.ok=true;A.pts.calc=S.tries===1?1:S.tries===2?.7:S.tries===3?.5:.3;A.vbar=u.vbar;A.result=u;A.incVols=incV}
    aCalc(el);if(!all)toast('✗ 표시된 칸을 다시 계산해 보세요')};
  bindNextA(el);
}

/* 공통-7: 결과 보고서 */
const ERRS=['종말점을 지나쳐 색이 진해졌다','종말점 전에 멈췄다','뷰렛 눈금을 읽을 때 시차가 있었다','뷰렛 끝에 기포가 있었다','뷰렛을 공세척하지 않았다','피펫의 표선을 정확히 맞추지 못했다','NaOH가 공기 중 수분·CO₂를 흡수했다','지시약 선택이 알맞지 않았다'];
function reportHTML(ed){
  const sc=A.sc,st1=A.stage===1,ind=IND[A.ind],s=getStudent(),R=A.rep;
  const vols=A.trials.map(t=>+t.rf.toFixed(1));
  const cb=(on,attr)=>ed?`<input type="checkbox" ${attr} ${on?'checked':''}>`:(on?'☑':'☐');
  return `<div class="report" id="repbox">
   <h3>실험 결과 보고서</h3>
   <div class="kv" style="margin-top:12px"><span class="muted">학번 · 이름</span><span>${esc(sLabel(s))}</span><span class="muted">실험 날짜</span><span>${R.date}</span>
    <span class="muted">실험 제목</span>${ed?`<input id="rt" value="${esc(R.title)}">`:`<b>${esc(R.title)}</b>`}</div>
   <div class="sec"><b>1. 실습 목적</b>${ed?`<input id="rg" value="${esc(R.goal)}" style="width:100%">`:`<p>${esc(R.goal)}</p>`}</div>
   <div class="sec"><b>2. 시약과 기구</b><p class="small">${st1?`수산화 소듐(${A.mNaOH.toFixed(2)} g → 1 L, ${A.Ct.toFixed(4)} M), 식초, 증류수, ${ind.n} 용액 / 부피 플라스크, 삼각 플라스크, 비커, 홀 피펫, 전자 저울, 약숟가락, 시약포지, 뷰렛`:`${sc.acid}, ${sc.titrant}, ${ind.n} 용액 / 홀 피펫(20 mL), 삼각 플라스크, 뷰렛, 스탠드, 비커`}</p></div>
   <div class="sec"><b>3. 반응식</b><p class="mono">${sc.eq}</p><p class="small muted">생성된 염: ${sc.salt} · 중화점 pH ${sc.eqpH}</p></div>
   <div class="sec"><b>4. 지시약과 종말점</b><p>사용한 지시약: <b>${ind.n}</b> (변색 범위 pH ${ind.range[0]}~${ind.range[1]}) · 종말점 색 변화: <b>${endChange(sc,ind)}</b></p></div>
   <div class="sec"><b>5. 실험 결과</b><div class="tw"><table class="table"><tr><th>회차</th><th>사용한 ${sc.tShort} 부피 (mL)</th><th>평균 포함</th></tr>
    ${A.trials.map((t,i)=>`<tr><td>${i+1}</td><td class="mono">${fx(vols[i],1)}</td><td>${A.calc.inc[i]?'○':'×'}</td></tr>`).join('')}
    <tr><td><b>평균 V̄</b></td><td class="mono"><b>${esc(A.calc.in.vbar)}</b></td><td></td></tr></table><p class="small muted">매 회 뷰렛 눈금을 0.0 mL에 맞추고 적정을 시작함.</p></div></div>
   <div class="sec"><b>6. 계산 과정</b>${st1?`<p class="small">① M(CH₃COOH) × 20.00 mL = ${A.Ct.toFixed(4)} M × ${esc(A.calc.in.vbar)} mL → 희석한 식초 <b>${esc(A.calc.in.m1)} M</b></p><p class="small">② 10배 희석이므로 원래 식초 = ${esc(A.calc.in.m1)} × 10 = <b>${esc(A.calc.in.m0)} M</b></p><p class="small">③ 아세트산 함량 = ${esc(A.calc.in.m0)} mol/L × 0.1 L × 60.05 g/mol = <b>${esc(A.calc.in.pct)} g/100 mL (%)</b></p>`
     :`<p class="small">① 넣은 적정액의 몰 수 = 0.1000 M × ${esc(A.calc.in.vbar)} mL ÷ 1000 = <b>${esc(A.calc.in.mol)} mol</b></p><p class="small">② ${sc.analyte==='acid'?`${sc.na} × M × 0.02000 L = ${sc.nb} × ${esc(A.calc.in.mol)} mol`:`M × 0.02000 L = ${esc(A.calc.in.mol)} mol`} → <b>${esc(A.calc.in.m0)} M</b></p>`}</div>
   <div class="sec"><b>7. 결론</b><p>${st1?`식초 속 아세트산의 몰 농도는 <b>${esc(A.calc.in.m0)} M</b>, 함량은 약 <b>${esc(A.calc.in.pct)} %</b>이다.`:`${esc(sc.acid.split(' ')[0])}의 몰 농도는 <b>${esc(A.calc.in.m0)} M</b>이다.`}</p></div>
   <div class="sec"><b>8. 오차의 원인</b><div class="stack" style="gap:4px">${ERRS.map((e,i)=>ed||R.errs[i]?`<label class="small row" style="gap:6px">${cb(R.errs[i],`data-err="${i}"`)} ${e}</label>`:'').join('')}</div></div>
   <div class="sec"><b>9. 고찰</b>${ed?`<p class="small muted">종말점을 어떻게 판단했는지, 지시약을 왜 골랐는지, 세 번의 결과가 차이 난 이유, 다시 한다면 무엇을 바꿀지 적어 보세요. (40자 이상)</p><textarea id="rd" placeholder="예) 페놀프탈레인은 변색 범위가 pH 8.2~10.0이라 염기성 염이 생기는 중화점과 잘 맞았다. 1회차에서는 …">${esc(R.disc)}</textarea><span class="small muted" id="rlen"></span>`:`<p style="white-space:pre-wrap">${esc(R.disc)}</p>`}</div>
   <div class="sec"><b>10. 실습 평가 (자기 점검)</b><div class="stack" style="gap:4px">${[['waste','실험 후 시약을 산·염기 구별하여 폐수통에 처리했다'],['tidy','실험 후 실험 도구를 세척하여 정리했다'],['ppe','보안경·실험복·실험용 장갑을 끝까지 착용했다']].map(([k,t])=>`<label class="small row" style="gap:6px">${cb(R.clean[k],`data-cl="${k}"`)} ${t}</label>`).join('')}</div></div>
   ${!ed&&A.graded?`<div class="sec"><b>11. 채점 결과</b><p>${A.graded.score}점 · 상대 오차 ${A.graded.relErr.toFixed(1)} %</p></div>`:''}
  </div>`;
}
function aRep(el){
  const sc=A.sc,st1=A.stage===1;
  if(!A.rep)A.rep={title:st1?'산 염기 중화 적정 — 식초 속 아세트산의 농도':`산 염기 중화 적정 — ${sc.title}`,goal:st1?'식초 속 아세트산의 농도를 중화 적정을 이용하여 구할 수 있다.':`농도를 아는 표준 용액으로 ${sc.acid.split(' ')[0]}의 농도를 중화 적정으로 구할 수 있다.`,disc:'',errs:{},clean:{},date:new Date().toLocaleDateString('ko-KR')};
  const R=A.rep;
  el.innerHTML=reportHTML(true)+`<div class="row noprint" style="margin-top:16px;justify-content:flex-end"><button class="btn pri" id="sub">보고서 제출하고 채점 받기 →</button></div>`;
  const upd=()=>{R.title=$('#rt',el).value;R.goal=$('#rg',el).value;R.disc=$('#rd',el).value;$('#rlen',el).textContent=`${R.disc.trim().length}자`};
  ['#rt','#rg','#rd'].forEach(s=>$(s,el).addEventListener('input',upd));upd();
  $$('[data-err]',el).forEach(c=>c.onchange=()=>{R.errs[c.dataset.err]=c.checked});
  $$('[data-cl]',el).forEach(c=>c.onchange=()=>{R.clean[c.dataset.cl]=c.checked});
  $('#sub',el).onclick=()=>{upd();if(R.disc.trim().length<40){toast('고찰을 40자 이상 적어 주세요');$('#rd',el).focus();return}
    if(!Object.values(R.errs).some(Boolean)){toast('오차의 원인을 하나 이상 고르세요');return}
    gradeAdv();goStep(8)};
}

/* 채점 */
function gradeAdv(){
  const sc=A.sc,st1=A.stage===1,ind=IND[A.ind],R=A.rep;
  const veq=veqOf(sc,A.Ca,20,A.Ct);
  const readF=A.trials.reduce((a,t)=>a+t.rfOk,0)/A.trials.length;
  const epS=e=>{e=Math.abs(e);return e<=.06?1:e<=.12?.8:e<=.25?.5:e<=.6?.25:0};
  const used=A.trials.filter((t,i)=>A.calc.inc[i]);
  const endF=used.reduce((a,t)=>a+epS(t.err),0)/used.length;
  const v=A.incVols;const range=Math.max(...v)-Math.min(...v);const repF=range<=.10?1:range<=.20?.6:range<=.4?.3:0;
  const indF=(A.firstIndOk?.8:0)+(A.firstChOk?.2:0);
  const trueC=st1?A.Cvin:A.Ca;const myC=num(A.calc.in.m0);const relErr=(myC-trueC)/trueC*100;
  const discLen=R.disc.trim().length;const repF2=(discLen>=150?.6:discLen>=80?.45:.3)+(Object.values(R.errs).some(Boolean)?.2:0)+(Object.values(R.clean).filter(Boolean).length>=3?.2:Object.values(R.clean).filter(Boolean).length*.05);
  const items=st1?[
    ['실험 준비 (복장·준비물·시료·뷰렛)',10,((A.pts.prep0||0)+(A.pts.prep2||0)+(A.pts.prep4||0))/3],

function record(kind,item,score,detail,report){

  if(report)r.report=report;
  if(kind!=='입장'){const mine=store.get('myrecords',[]);mine.push({...r,report:undefined});store.set('myrecords',mine.slice(-300))}

let flushing=false;
async function flushOutbox(){
  if(!SHEET_URL||flushing)return;flushing=true;
  let ob=store.get('outbox',[]);
  while(ob.length){
    try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(ob[0])});ob=store.get('outbox',[]);ob.shift();store.set('outbox',ob)}

}

async function loadTeacher(){

function drawTeacher(){
  const f=TD.f;const all=TD.rows;
  const rows=all.filter(r=>(!f.g||String(r.grade)===f.g)&&(!f.c||String(r.cls)===f.c)&&(!f.q||String(r.name).includes(f.q)));
  const grades=[...new Set(all.map(r=>String(r.grade)))].sort(),classes=[...new Set(all.map(r=>String(r.cls)))].sort((a,b)=>a-b);
  const by={};rows.forEach(r=>{const k=`${r.grade}-${r.cls}-${r.no}-${r.name}`;(by[k]=by[k]||{r,list:[]}).list.push(r)});
  const sum=Object.values(by).map(({r,list})=>{
    const best=lv=>{const s=list.filter(x=>x.kind==='기초 이론'&&String(x.item).startsWith(lv)).map(x=>+x.score);return s.length?Math.max(...s):null};
    const prac=new Set(list.filter(x=>x.kind==='기초 실습').map(x=>x.item)).size;
    const adv=st=>{const s=list.filter(x=>x.kind==='심화 실습'&&String(x.item).startsWith(st)).map(x=>+x.score);return s.length?Math.max(...s):null};
    const nrep=list.filter(x=>x.kind==='심화 실습').length;
    const last=list.map(x=>new Date(x.time||x.clientTime)).sort((a,b)=>b-a)[0];
    return {grade:r.grade,cls:r.cls,no:r.no,name:r.name,t1:best('초보'),t2:best('중급'),t3:best('고급'),prac,a1:adv('1단계'),a2:adv('2단계'),nrep,last};
  }).sort((a,b)=>a.grade-b.grade||a.cls-b.cls||a.no-b.no);
  const cell=v=>v==null?'<span class="muted">—</span>':v;
  const exCell=v=>v==null?'<span class="muted">—</span>':`<span class="pill ${v>=70?'ok':v>=50?'warn':'bad'}">${v}</span>`;
  const detail=rows.filter(r=>r.kind!=='입장').sort((a,b)=>new Date(b.time||b.clientTime)-new Date(a.time||a.clientTime));
  const dt=d=>new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  app.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><p class="eyebrow">교사용 · acid–base titration</p><h2 style="margin-top:6px">학생 결과</h2></div>
   <div class="row"><span class="pill">학생 ${sum.length}명 · 기록 ${detail.length}건</span><button class="btn sm" id="trf">새로고침</button><button class="btn sm" id="tout">잠그기</button></div></div>
   <div class="panel row" style="margin-top:14px">
    <label class="row small" style="gap:6px">학년 <select id="fg"><option value="">전체</option>${grades.map(g=>`<option ${f.g===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px">반 <select id="fc"><option value="">전체</option>${classes.map(c=>`<option ${f.c===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px;flex:1;min-width:180px">이름 <input id="fq" value="${esc(f.q)}" placeholder="이름으로 찾기" style="flex:1"></label>
   </div>
   <div class="card" style="margin-top:14px"><h3>학생별 요약</h3><p class="small muted" style="margin-top:4px">기초 이론은 난이도별 최고 점수, 기초 실습은 완료한 미션 수(7개 중), 심화는 단계별 보고서 최고점(70점 이상 초록)입니다.</p>
    <div class="tw" style="margin-top:10px"><table class="table"><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>이론 초보</th><th>이론 중급</th><th>이론 고급</th><th>실습 완료</th><th>심화 1단계</th><th>심화 2단계</th><th>보고서 수</th><th>마지막 활동</th></tr>
    ${sum.map(s=>`<tr><td>${s.grade}</td><td>${s.cls}</td><td>${s.no}</td><td style="font-weight:600">${esc(s.name)}</td><td class="mono">${cell(s.t1)}</td><td class="mono">${cell(s.t2)}</td><td class="mono">${cell(s.t3)}</td><td class="mono">${s.prac}/7</td><td>${exCell(s.a1)}</td><td>${exCell(s.a2)}</td><td class="mono">${s.nrep}</td><td class="mono small">${s.last?dt(s.last):''}</td></tr>`).join('')||'<tr><td colspan="12" class="muted">조건에 맞는 기록이 없어요</td></tr>'}</table></div></div>
   <div class="card" style="margin-top:14px"><h3>전체 기록 (최신순)</h3><p class="small muted" style="margin-top:4px">심화 실습 행을 누르면 보고서 요약(적정 부피·결과·고찰)을 볼 수 있어요.</p>
    <div class="tw" style="margin-top:10px"><table class="table"><tr><th>시간</th><th>학번</th><th>이름</th><th>구분</th><th>항목</th><th>점수</th><th style="text-align:left">상세</th></tr>
    ${detail.slice(0,TD.show).map((r,i)=>`<tr ${r.kind==='심화 실습'?`data-row="${i}" style="cursor:pointer"`:''}><td class="mono small">${dt(r.time||r.clientTime)}</td><td class="mono">${r.grade}-${r.cls}-${r.no}</td><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${esc(r.item)}</td><td class="mono">${r.score}</td><td class="small" style="text-align:left;max-width:420px">${esc(String(r.detail).slice(0,140))}${String(r.detail).length>140?'…':''}</td></tr>`).join('')}</table></div>
    ${detail.length>TD.show?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="tmore">더 보기 (${detail.length-TD.show}건 남음)</button></div>`:''}
    <p class="small muted" style="margin-top:8px">원본 데이터는 Google 스프레드시트 「acid–base titration」의 「결과」 시트에, 보고서 세부 값은 「보고서」 시트에 쌓입니다.</p></div>`;
  $('#fg').onchange=e=>{f.g=e.target.value;drawTeacher()};$('#fc').onchange=e=>{f.c=e.target.value;drawTeacher()};
  $('#fq').oninput=e=>{f.q=e.target.value.trim();clearTimeout(TD.qt);TD.qt=setTimeout(()=>{drawTeacher();const q=$('#fq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)};
  $('#trf').onclick=async()=>{toast('새로 불러오는 중…');await loadTeacher()};
  $('#tout').onclick=()=>{TD.rows=null;TD.key='';renderTeacher()};
  const mo=$('#tmore');if(mo)mo.onclick=()=>{TD.show+=100;drawTeacher()};
  $$('[data-row]').forEach(tr=>tr.onclick=()=>{const r=detail[+tr.dataset.row];modal(`<h3>${esc(r.name)} · ${esc(r.item)}</h3><p class="small muted" style="margin-top:4px">${r.grade}학년 ${r.cls}반 ${r.no}번 · ${dt(r.time||r.clientTime)} · ${r.score}점</p><div class="panel" style="margin-top:10px;white-space:pre-wrap">${esc(String(r.detail).replace(/ · /g,'\n'))}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>닫기</button></div>`)});
}
render();flushOutbox();
</script>
</body>
</html>
